<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6b4f">
<title>ひらがじゃん風 ことば作りカード</title>
<style>
:root{
  --paper:#f6f1e7; --ink:#2b2a28; --felt:#2f6b4f; --felt-dark:#235239; --felt-light:#3d7d60;
  --tile:#fffaf0; --tile-edge:#d9cdb4; --accent:#e0693c; --accent-dark:#b94f27;
  --blue:#e3eefb; --pink:#fbe4e8; --lime:#e4f3dc; --gold:#f4c542;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overscroll-behavior:none;background:var(--paper);color:var(--ink);
  font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",system-ui,sans-serif}
body{min-height:100vh;min-height:100dvh;touch-action:manipulation;-webkit-text-size-adjust:100%}
.felt{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;cursor:pointer}
#app{max-width:520px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 10px max(14px,env(safe-area-inset-bottom))}

/* title */
.title{text-align:center;padding:18px 6px}
.title h1{font-size:1.7rem;line-height:1.3;margin:10px 0 6px;letter-spacing:.04em}
.title .lead{margin:0 0 18px;color:#555;line-height:1.7}
.deco{display:flex;justify-content:center;gap:6px;margin:6px 0 10px}
.panel{background:#fff;border:1px solid var(--tile-edge);border-radius:14px;padding:14px;margin:12px 0;text-align:left}
.panel h2{font-size:.95rem;margin:0 0 8px}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:10px 4px;border:2px solid var(--tile-edge);background:var(--tile);border-radius:10px;font-weight:600}
.seg button.on{border-color:var(--felt);background:var(--felt);color:#fff}
.big{display:block;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);color:#fff;font-size:1.2rem;font-weight:700;box-shadow:0 3px 0 var(--accent-dark)}
.big:active{transform:translateY(2px);box-shadow:0 1px 0 var(--accent-dark)}
details{margin:10px 0}
summary{cursor:pointer;font-weight:600;padding:6px 0}
details p,details li{line-height:1.7;font-size:.92rem}
.small{font-size:.8rem;color:#6b665c;line-height:1.6}

/* tiles */
.tile{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--tile-edge);
  background:var(--tile);border-radius:8px;box-shadow:0 2px 0 var(--tile-edge);
  font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-weight:700;color:var(--ink);
  width:100%;aspect-ratio:3/4;font-size:clamp(18px,6.4vw,30px);padding:0;line-height:1;user-select:none}
.tile.d{background:var(--blue)} .tile.s{background:var(--pink)} .tile.l{background:var(--lime)}
.tile.new{outline:3px solid var(--gold);outline-offset:1px}
.tile.pop{animation:pop .5s ease-out}
.tile.disc{outline:3px dashed #c2362b;outline-offset:1px}
.tile.back{background:repeating-linear-gradient(45deg,#2b5f8a,#2b5f8a 6px,#3a76a8 6px,#3a76a8 12px);color:transparent;border-color:#1f4768}
.tile.mini{font-size:clamp(14px,4.4vw,20px)}
@keyframes pop{0%{transform:translateY(-14px) scale(1.15);opacity:0}100%{transform:none;opacity:1}}
.row{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.hand{min-height:calc((min(100vw, 520px) - 68px) / 8 * 1.334 + 4px);border-radius:8px;padding:2px 0}
.tile[data-drag]{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:grab}
.tile.lift{opacity:.3}
.tile.ghost{position:fixed;z-index:30;pointer-events:none;margin:0;transform:translate(-50%,-70%) rotate(-4deg);
  box-shadow:0 10px 20px rgba(0,0,0,.4);opacity:.97;outline:none;animation:none}
.over{outline:3px solid var(--gold);outline-offset:1px;background-color:rgba(244,197,66,.18)}
.cell.over{background:rgba(244,197,66,.28)}
.dpile.zone{outline:2px dashed rgba(255,255,255,.7);outline-offset:2px;border-radius:8px}
.dpile.zone.over{background:rgba(194,54,43,.45);outline-color:#ffb4a8}
.grp.ok{background:#4c9a62;box-shadow:0 0 0 2px var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:1px solid var(--tile-edge);background:var(--tile);border-radius:999px;padding:4px 10px;font-size:.9rem}
.chips + .two button{padding:8px}
.title .big{margin-bottom:10px;line-height:1.3}
.title .big small{display:block;font-size:.76rem;font-weight:500;opacity:.92;margin-top:2px}
.title .big.alt{background:var(--felt);box-shadow:0 3px 0 var(--felt-dark)}
.title .big.alt2{background:#4a6fa5;box-shadow:0 3px 0 #355079}
.hdr .hb{display:flex;gap:6px}
.hdr .hb button{min-width:38px}
/* 一人用：カードを大きく、枠を3段に */
.felt.bigmode{--cw:min(17vw,9.5vh,80px)}
.felt.bigmode .slots{display:flex;flex-direction:column;gap:6px;margin:6px 0 8px}
.felt.bigmode .grp{display:flex;align-items:center;gap:8px;padding:5px 8px}
.felt.bigmode .grp .gl{flex:none;width:3.2em;margin:0;text-align:left;font-size:.8rem}
.felt.bigmode .grp .cells{display:flex;gap:6px}
.felt.bigmode .cell{width:var(--cw);flex:none}
.felt.bigmode .row.hand{grid-template-columns:repeat(4,var(--cw));justify-content:center;gap:8px;min-height:calc(var(--cw)*2.7 + 8px)}
.felt.bigmode .hand .tile,.felt.bigmode .cell .tile{font-size:calc(var(--cw)*.52)}
.felt.bigmode .msg{font-size:1.02rem}

/* table */
.hdr{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:#555;margin-bottom:6px}
.hdr b{color:var(--ink)}
.hdr button{border:1px solid var(--tile-edge);background:#fff;border-radius:8px;padding:4px 10px}
.felt{background:var(--felt);border-radius:16px;padding:10px;color:#fff;box-shadow:inset 0 2px 10px rgba(0,0,0,.25)}
.who{font-size:.8rem;opacity:.9;margin:0 0 6px;display:flex;justify-content:space-between}
.mid{margin:10px 0;padding:8px;background:var(--felt-dark);border-radius:12px}
.msg{min-height:2.6em;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;line-height:1.5;padding:2px 4px}
.piles{display:flex;gap:8px;align-items:center;margin-top:6px}
.deck{width:44px;flex:none}
.deck .cnt{font-size:.7rem;text-align:center;margin-top:2px;opacity:.9}
.dpile{flex:1;display:flex;flex-wrap:wrap;gap:3px;min-height:34px;align-content:flex-start;padding:4px 3px 0;min-height:44px}
.dpile .tile{width:calc((100% - 21px)/8);font-size:clamp(11px,3.4vw,16px);border-radius:5px}
.dlabel{font-size:.7rem;opacity:.85;margin-bottom:2px;padding-left:3px}
.slots{display:grid;grid-template-columns:2fr 3fr 3fr;gap:8px;margin:6px 0 10px}
.grp{background:var(--felt-light);border-radius:10px;padding:5px}
.grp .gl{font-size:.68rem;text-align:center;margin-bottom:3px;opacity:.95}
.grp .cells{display:grid;gap:3px}
.grp.g2 .cells{grid-template-columns:repeat(2,1fr)} .grp.g3 .cells{grid-template-columns:repeat(3,1fr)}
.cell{aspect-ratio:3/4;border:2px dashed rgba(255,255,255,.55);border-radius:7px;display:block;touch-action:none;position:relative;min-width:0}
.cell .tile{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto}
.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.btns button{border:0;background:#fff;color:var(--ink);border-radius:10px;padding:10px 2px;font-weight:700;font-size:.85rem;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.btns button:disabled{opacity:.4}
.btns .win{grid-column:1/-1;background:var(--accent);color:#fff;font-size:1.1rem;padding:13px}
.btns .win:disabled{background:#9aa;opacity:.7}
.btns button.on{background:#c2362b;color:#fff}

/* overlay */
.ov{position:fixed;inset:0;background:rgba(20,30,25,.72);display:flex;align-items:center;justify-content:center;padding:18px;z-index:10}
.card{background:var(--paper);border-radius:18px;padding:18px;max-width:420px;width:100%;text-align:center;max-height:90vh;overflow:auto}
.card h2{margin:4px 0 10px;font-size:1.5rem}
.words{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:10px 0}
.wd{display:flex;gap:3px;width:calc(var(--n) * 38px + 6px)}
.wd .tile{font-size:20px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.two button{padding:12px;border-radius:12px;border:2px solid var(--tile-edge);background:#fff;font-weight:700}
.two button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
</style>
</head>

const key = s => Array.from(s).sort().join("");
function mkKeyMap(list){ const m = new Map(); for(const w of list){ const k = key(w); if(!m.has(k)) m.set(k, []); m.get(k).push(w);} return m; }
let SET2, SET3, DME, DCPU;
function mkDict(extra){
  const S2 = new Set(DICT.w2), S3 = new Set(DICT.w3);
  for(const w of (extra||[])){ if(w.length===2) S2.add(w); else if(w.length===3) S3.add(w); }
  const ALL = Array.from(S2).concat(Array.from(S3));
  return {S2, S3, K2:mkKeyMap(Array.from(S2)), K3:mkKeyMap(Array.from(S3)), ALL, CH:ALL.map(w=>Array.from(w))};
}
// 基本の辞書 + 追加の言葉で辞書を作る。あなた用（extraMe）とCPU用（extraCpu）は別にできる
function rebuildDict(extraMe, extraCpu){
  DME = mkDict((extraMe||[]).concat(BUILTIN));
  DCPU = extraCpu ? mkDict(extraCpu) : DME;
  SET2 = DME.S2; SET3 = DME.S3;
}

function buildDeck(){
  const d = []; let id = 0;
  for(const c of BASE){ d.push({id:id++, ch:c}); d.push({id:id++, ch:c}); }
  for(const c of VOICED + SPECIAL) d.push({id:id++, ch:c});

}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

// 8まいを 2・3・3 に分けて、全部が辞書の言葉になるか探す
function solve(chars, D){
  D = D || DME; const K2 = D.K2, K3 = D.K3;
  const n = chars.length;
  for(let i=0;i<n;i++) for(let j=i+1;j<n;j++){
    const w2 = K2.get(key(chars[i]+chars[j])); if(!w2) continue;
    const rest = []; for(let t=0;t<n;t++) if(t!==i && t!==j) rest.push(chars[t]);
    for(let b=1;b<5;b++) for(let c=b+1;c<6;c++){
      const wa = K3.get(key(rest[0]+rest[b]+rest[c])); if(!wa) continue;
      let tb = ""; for(let t=1;t<6;t++) if(t!==b && t!==c) tb += rest[t];
      const wb = K3.get(key(tb)); if(!wb) continue;
      return {w:[w2[0], wa[0], wb[0]]};
    }
  }
  return null;
}
function countMap(chars){ const m = {}; for(const c of chars) m[c] = (m[c]||0)+1; return m; }
// 手札の文字だけで作れる言葉
function buildable(chars, D){
  D = D || DME;
  const have = countMap(chars), out = [];
  for(const w of D.ALL){
    const need = countMap(w); let ok = true;
    for(const c in need){ if((have[c]||0) < need[c]){ ok = false; break; } }
    if(ok) out.push(w);
  }
  return out;
}
// 7まいの手札に「あと1まい」で近づく言葉の数
function nearScore(h7, unseen, D){
  const CH = D.CH;
  const have = countMap(h7); let s = 0;
  for(let k=0;k<CH.length;k++){
    const chs = CH[k]; let miss = 0, missCh = "";
    for(let i=0;i<chs.length;i++){
      const c = chs[i]; let before = 0;
      for(let j=0;j<i;j++) if(chs[j]===c) before++;   // 同じ文字が2まい要る語のため
      if((have[c]||0) <= before){ miss++; missCh = c; }
    }
    if(miss === 0) s += 2;
    else if(miss === 1 && chs.length === 3 && (unseen[missCh]||0) > 0) s += 1;
  }
  return s;
}
function pickWeighted(unseen, k){
  const bag = []; for(const c in unseen) for(let i=0;i<unseen[c];i++) bag.push(c);
  const set = new Set(); let guard = 0;
  while(set.size < k && guard++ < 500) set.add(bag[Math.floor(Math.random()*bag.length)]);
  return Array.from(set);
}
// CPUの すてるカード選び。戻り値は手札(8まい)の中の番号
function chooseDiscard(hand8, deckCards, level, D){
  D = D || DCPU;
  const unseen = countMap(deckCards.map(c=>c.ch));
  const letters = Object.keys(unseen);
  const sample = level==="hard" ? letters : (level==="normal" ? pickWeighted(unseen, 14) : []);
  let best = -1, bestScore = -Infinity;
  for(let i=0;i<hand8.length;i++){
    const h7 = hand8.filter((_,k)=>k!==i);
    let s1 = 0;
    for(const L of sample){ if(solve(h7.concat(L), D)) s1 += (level==="hard" ? unseen[L] : 1); }
    const s2 = nearScore(h7, unseen, D);
    let score;
    if(level==="hard") score = s1*1000 + s2 + Math.random();
    else if(level==="normal") score = s1*40 + s2 + Math.random()*4;
    else score = s2 + Math.random()*25;
    if(score > bestScore){ bestScore = score; best = i; }
  }
  return best;
}

// 出題パズル：必ず「2・3・3もじ」の言葉が作れる8まいを出す（言葉は、自作の基本の辞書から選ぶ）
function makePuzzle(){
  const cap = {}; for(const c of BASE) cap[c] = 2; for(const c of VOICED + SPECIAL) cap[c] = 1;
  const pick = a => a[Math.floor(Math.random()*a.length)];
  let last = null;
  for(let tries=0; tries<5000; tries++){
    const a = pick(DICT.w2), b = pick(DICT.w3), c = pick(DICT.w3);
    if(b === c) continue;
    const cnt = {}; let ok = true;
    for(const ch of a+b+c){ cnt[ch] = (cnt[ch]||0) + 1; if(cnt[ch] > (cap[ch]||0)){ ok = false; break; } }
    if(!ok) continue;
    last = {words:[a,b,c], chars:shuffle(Array.from(a+b+c))};
    // すぐ並べられてしまう（もとの順のまま）ことを避ける
    if(last.chars.join("") !== (a+b+c)) return last;
  }
  return last;
}

// JMdict（XML、gz のままでも可）から、2〜3もじの読みを取り出す
async function importJMdict(file, commonOnly, onProgress){
  let stream = file.stream();
  const head = new Uint8Array(await file.slice(0,2).arrayBuffer());
  if(head[0]===0x1f && head[1]===0x8b){
    if(typeof DecompressionStream === "undefined") throw new Error("このブラウザは .gz を開けないよ。解凍した JMdict_e を選んでね");
    stream = stream.pipeThrough(new DecompressionStream("gzip"));
  }
  const reader = stream.pipeThrough(new TextDecoderStream("utf-8")).getReader();
  const found = new Set(); let buf = "", entries = 0, lastTick = 0;
  const hira = x => x.replace(/[\u30a1-\u30f6]/g, ch => String.fromCharCode(ch.charCodeAt(0)-0x60));
  const pri = /<(re|ke)_pri>/, bad = /&(obs|obsc|arch|rare|vulg);/;
  const one = chunk => {
    entries++;
    const hasPri = pri.test(chunk);
    if(commonOnly && !hasPri) return;
    if(!hasPri && bad.test(chunk)) return;
    const re = /<reb>([^<]+)<\/reb>/g; let m;
    while((m = re.exec(chunk))){ const w = hira(m[1]); if(okWord(w)) found.add(w); }
  };
  for(;;){
    const {done, value} = await reader.read(); if(done) break;
    buf += value;
    let i; while((i = buf.indexOf("</entry>")) >= 0){ one(buf.slice(0, i)); buf = buf.slice(i+8); }
    if(Date.now()-lastTick > 250){ lastTick = Date.now(); onProgress && onProgress(entries, found.size); await new Promise(r=>setTimeout(r,0)); }
  }
  if(entries === 0) throw new Error("JMdictのファイルに見えないよ（<entry>が見つからない）");
  return {entries, words:Array.from(found)};
}

function tone(f, t0, dur, type, vol, f2){
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || "sine"; o.frequency.setValueAtTime(f, t0);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0 + dur + 0.03);
}
function noise(t0, dur, f, q, vol){
  const n = Math.max(1, Math.floor(AC.sampleRate * dur)), buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = Math.random()*2 - 1;
  const src = AC.createBufferSource(); src.buffer = buf;
  const bp = AC.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = f; bp.Q.value = q;
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(bp); bp.connect(g); g.connect(AC.destination); src.start(t0);
}
function sfx(name){
  if(!S.sound) return;
  try{
    if(!AC || AC.state !== "running") return;
    const t = AC.currentTime;
    if(name === "place"){ tone(640, t, 0.07, "triangle", 0.09, 430); noise(t, 0.03, 2600, 1, 0.05); }
    else if(name === "draw"){ noise(t, 0.12, 1800, 0.8, 0.09); tone(320, t, 0.1, "sine", 0.03, 520); }
    else if(name === "discard"){ tone(250, t, 0.1, "sine", 0.1, 150); }
    else if(name === "ok"){ tone(880, t, 0.12, "sine", 0.07); tone(1320, t + 0.08, 0.14, "sine", 0.05); }
    else if(name === "win"){ [523, 659, 784, 1047].forEach((f, i) => tone(f, t + i*0.11, 0.24, "triangle", 0.09)); }
    else if(name === "lose"){ tone(392, t, 0.22, "triangle", 0.07); tone(330, t + 0.2, 0.32, "triangle", 0.07); }
  }catch(e){}
}

function newGame(mode){
  mode = mode || S.mode || "cpu"; S.mode = mode;
  if(mode === "puzzle") return newPuzzle();
  const deck = shuffle(buildDeck());
  const me = deck.splice(0,7), cpu = mode === "cpu" ? deck.splice(0,7) : [];
  G = { gid:(G?G.gid:0)+1, mode, turn:0, deck, discard:[], me, cpu, slots:Array(8).fill(null),
        phase:"idle", newId:null, cpuNewId:null, pop:null, msg:"", discardMode:false, confirm:null, result:null, last:null, prevOk:[false,false,false] };
  S.screen = "play";
  const meFirst = mode === "solo" || Math.random() < 0.5;
  setMsg(mode === "solo" ? "山札から1まいずつ引くよ。ゆっくり考えてね" : (meFirst ? "じゃんけんで あなたが先攻！" : "じゃんけんで CPUが先攻！"));
  render(); window.scrollTo(0, 0);

  sleep(mode === "solo" ? 700 : 1100).then(()=>{ if(!G || G.gid!==gid) return; meFirst ? myTurn() : cpuTurn(); });

function newPuzzle(){
  const pz = makePuzzle();
  G = { gid:(G?G.gid:0)+1, mode:"puzzle", turn:0, deck:[], discard:[], me:pz.chars.map((ch,i)=>({id:i, ch})), cpu:[], slots:Array(8).fill(null),
        phase:"act", newId:null, cpuNewId:null, pop:null, msg:"8まいで「2もじ・3もじ・3もじ」の言葉を作ろう。ゆっくり考えてね",
        discardMode:false, confirm:null, result:null, last:null, sol:pz.words, hinted:[], cheat:false, prevOk:[false,false,false] };
  S.screen = "play"; sfx("draw"); render(); window.scrollTo(0, 0);
}
function drawCard(){
  if(G.deck.length === 0){ G.deck = shuffle(G.discard.splice(0)); }
  return G.deck.shift();
}
function myTurn(){
  const c = drawCard(); G.me.push(c); G.newId = c.id; G.cpuNewId = null; G.pop = c.id; G.turn++; sfx("draw");
  G.phase = "act"; G.discardMode = false;
  setMsg(G.mode === "solo" ? `${G.turn}ターン目：「${c.ch}」を引いたよ。言葉を作って あがるか、1まい すてよう`
                           : `山札から「${c.ch}」を引いたよ。言葉を作って あがるか、1まい すてよう`);
  render();
}
async function cpuTurn(){
  const gid = G.gid;
  G.phase = "cpu"; G.discardMode = false; G.newId = null;
  setMsg("CPUの番… 山札から引いてるよ"); render();
  await sleep(900); if(G.gid!==gid) return;
  const c = drawCard(); G.cpu.push(c); G.cpuNewId = c.id; G.pop = c.id; sfx("draw");
  setMsg("CPUが1まい引いたよ。考え中…"); render();
  await sleep(1200); if(G.gid!==gid) return;
  const sol = solve(G.cpu.map(x=>x.ch), DCPU);
  if(sol && Math.random() < NOTICE[S.level]){ return finish("cpu", sol.w, false); }
  const k = chooseDiscard(G.cpu.map(x=>x.ch), G.deck, S.level);
  const out = G.cpu.splice(k,1)[0]; G.discard.push(out); G.cpuNewId = null; G.last = out.id; G.pop = out.id; sfx("discard");
  setMsg(`CPUは「${out.ch}」をすてたよ。あなたの番！`); render();
  await sleep(900); if(G.gid!==gid) return;
  myTurn();
}

function finish(who, words, declared){
  G.phase = "over"; G.result = {who, words, declared};
  if(G.mode === "cpu"){ S.wins[who === "me" ? "me" : "cpu"]++; store.set("wins", S.wins); }
  else if(G.mode === "solo"){
    if(!S.best || G.turn < S.best){ S.best = G.turn; store.set("best", S.best); G.result.newBest = true; }
  } else if(G.mode === "puzzle"){
    if(!G.cheat){ S.solved++; store.set("solved", S.solved); }
  }
  sfx(who === "me" ? "win" : "lose");
  render();
}

// --- player actions
function placedIds(){ return new Set(G.slots.filter(Boolean).map(c=>c.id)); }
function placeCard(id){
  if(G.phase!=="act") return;
  const card = G.me.find(c=>c.id===id); if(!card) return;
  if(G.discardMode){ return discardCard(id); }
  const i = G.slots.indexOf(null); if(i<0) return;
  G.slots[i] = card; G.newId = (G.newId===id? null : G.newId); sfx("place");
  render();
}
function unplace(i){
  if(G.phase!=="act") return;
  if(G.discardMode && G.slots[i]) return discardCard(G.slots[i].id);
  G.slots[i] = null; render();
}
function discardCard(id){
  if(G.mode === "puzzle") return;
  const k = G.me.findIndex(c=>c.id===id); if(k<0) return;
  const out = G.me.splice(k,1)[0];
  G.slots = G.slots.map(c => (c && c.id===id) ? null : c);
  G.discard.push(out); G.last = out.id; G.pop = out.id; G.discardMode = false; G.newId = null; sfx("discard");
  setMsg(`「${out.ch}」をすてたよ`);
  if(G.mode === "cpu") return cpuTurn();
  G.phase = "idle"; render();                       // 一人で引いてすてる：少し間をおいて、次を引く
  const gid = G.gid;
  setTimeout(()=>{ if(G && G.gid===gid && G.phase==="idle") myTurn(); }, 450);
}
function wordsInSlots(){
  const ch = G.slots.map(c=>c?c.ch:"");
  return [ch.slice(0,2).join(""), ch.slice(2,5).join(""), ch.slice(5,8).join("")];
}
function declare(){
  if(G.phase!=="act") return;
  if(G.slots.some(c=>!c)){ setMsg("8まい ぜんぶを枠に入れてから「あがり！」を押してね"); return render(); }
  const [a,b,c] = wordsInSlots();
  const unknown = [];
  if(!SET2.has(a)) unknown.push(a);
  if(!SET3.has(b)) unknown.push(b);
  if(!SET3.has(c)) unknown.push(c);
  if(unknown.length === 0) return finish("me", [a,b,c], false);
  G.confirm = {unknown, words:[a,b,c]}; render();
}
function arrangeWords(words){
  const pool = G.me.slice(), slots = [];
  for(const ch of words.join("")){
    const k = pool.findIndex(c=>c.ch===ch); if(k<0) return false; slots.push(pool.splice(k,1)[0]);
  }
  G.slots = slots; G.discardMode = false; return true;
}
function hint(){
  if(G.phase!=="act") return;
  if(G.mode === "puzzle"){
    const left = [0,1,2].filter(i=>!G.hinted.includes(i));
    if(left.length === 0){ setMsg("ヒントは ぜんぶ出したよ。どうしても分からないときは「こたえ」を見てね"); return render(); }
    const i = left[Math.floor(Math.random()*left.length)]; G.hinted.push(i);
    setMsg(`ヒント：「${G.sol[i]}」が作れるよ（${G.hinted.length}つ目／3つ）`); return render();
  }
  const chars = G.me.map(c=>c.ch);
  const sol = solve(chars);
  if(sol){
    arrangeWords(sol.w);
    setMsg(`あがれるよ！「${sol.w.join("」「")}」で作ったよ。「あがり！」を押してね`);
  } else {
    const ws = buildable(chars);
    if(ws.length === 0) setMsg("今の手札だと、作れる言葉が見つからないよ。1まい すててみよう");
    else {
      const pick = shuffle(ws.slice()).slice(0,3);
      setMsg(`ヒント：「${pick.join("」「")}」が作れるよ（まだ あがれる形じゃないよ）`);
    }
  }
  render();
}
function showAnswer(){
  if(G.mode !== "puzzle" || G.phase !== "act") return;
  if(G.cheat) return newPuzzle();                    // こたえを見たあとは「つぎの問題」
  if(arrangeWords(G.sol)){ G.cheat = true; setMsg("こたえを並べたよ。「あがり！」で次へ進めるよ（できた問題には数えないよ）"); }
  render();
}
function sortHand(){
  G.me.sort((a,b)=>ORDER.indexOf(a.ch)-ORDER.indexOf(b.ch)); render();
}
function clearSlots(){ G.slots = Array(8).fill(null); G.discardMode=false; render(); }

}

function renderPlay(){
  const solo = G.mode !== "cpu", pz = G.mode === "puzzle";
  const placed = placedIds();
  const hand = G.me.filter(c=>!placed.has(c.id));
  const act = G.phase==="act";
  const cells = i => {
    const c = G.slots[i];
    return c ? `<div class="cell" data-i="${i}" style="border-style:solid">${tileHTML(c,"",`data-act="unplace" data-i="${i}" data-id="${c.id}" data-from="slot" ${act&&!G.discardMode?"data-drag=1":""}`)}</div>`
             : `<div class="cell" data-i="${i}"></div>`;
  };
  const okGrp = (a,b) => {
    if(!S.glow) return false;
    const cs = G.slots.slice(a,b); if(cs.some(x=>!x)) return false;
    const w = cs.map(x=>x.ch).join(""); return (w.length===2?SET2:SET3).has(w);
  };
  const ok2 = okGrp(0,2), ok3a = okGrp(2,5), ok3b = okGrp(5,8);
  const okNow = [ok2, ok3a, ok3b];
  if(okNow.some((v,i) => v && !(G.prevOk||[])[i])) sfx("ok");     // 新しく言葉になったら ぴん
  G.prevOk = okNow;
  const cpuTiles = G.cpu.map(c => S.showCpu
      ? `<span class="tile ${tileClass(c.ch)} mini ${G.cpuNewId===c.id?"new":""} ${G.pop===c.id?"pop":""}">${c.ch}</span>`
      : `<span class="tile back mini ${G.cpuNewId===c.id?"new":""} ${G.pop===c.id?"pop":""}">・</span>`).join("");
  const dis = G.discard.slice(-16).map(c=>`<span class="tile ${tileClass(c.ch)} ${G.last===c.id?"new":""} ${G.pop===c.id?"pop":""}">${c.ch}</span>`).join("");
  const allPlaced = G.slots.every(Boolean);
  const hdr = G.mode === "cpu" ? `CPU：<b>${LEVELS[S.level]}</b> ／ 勝ち あなた<b>${S.wins.me}</b>-CPU<b>${S.wins.cpu}</b>`
            : pz ? `ひとりパズル ／ できた問題 <b>${S.solved}</b>`
            : `引いてすてる ／ <b>${G.turn}</b>ターン目 ／ ベスト <b>${S.best?S.best+"ターン":"なし"}</b>`;
  const piles = `
      <div class="piles">
        <div class="deck"><span class="tile back mini" style="aspect-ratio:3/4">・</span><div class="cnt">山札 ${G.deck.length}</div></div>
        <div style="flex:1"><div class="dlabel">すてたカード（ここにドラッグでも すてられるよ）</div><div class="dpile">${dis||'<span class="small" style="color:#cfe;opacity:.8">まだ ないよ</span>'}</div></div>
      </div>`;
  $app.innerHTML = `
  <div class="hdr"><span>${hdr}</span>
    <span class="hb"><button data-act="sound" aria-label="効果音">${S.sound?"🔊":"🔇"}</button><button data-act="title">もどる</button></span></div>
  <div class="felt ${solo?"bigmode":""}">
    ${solo?"":`<p class="who"><span>CPUの手札（${G.cpu.length}まい）</span></p>
    <div class="row" style="grid-template-columns:repeat(${Math.max(8,G.cpu.length)},1fr)">${cpuTiles}</div>`}
    <div class="mid">
      <div class="msg">${G.msg}</div>
      ${pz?"":piles}
    </div>
    <p class="who"><span>${pz?"言葉を作ろう":"あなた：言葉を作ろう"}</span></p>
    <div class="slots">
      <div class="grp g2 ${ok2?"ok":""}"><div class="gl">2もじ${ok2?" ✓":""}</div><div class="cells">${cells(0)}${cells(1)}</div></div>
      <div class="grp g3 ${ok3a?"ok":""}"><div class="gl">3もじ${ok3a?" ✓":""}</div><div class="cells">${cells(2)}${cells(3)}${cells(4)}</div></div>
      <div class="grp g3 ${ok3b?"ok":""}"><div class="gl">3もじ${ok3b?" ✓":""}</div><div class="cells">${cells(5)}${cells(6)}${cells(7)}</div></div>
    </div>
    <p class="who"><span>${pz?"手札":"あなたの手札"}</span><span>${G.discardMode?"▼ すてるカードをタップ":""}</span></p>
    <div class="row hand">${hand.map(c=>tileHTML(c, `${G.newId===c.id?"new":""} ${G.pop===c.id?"pop":""} ${G.discardMode?"disc":""}`, `data-act="place" data-id="${c.id}" data-from="hand" ${act?"":"disabled"} ${act&&!G.discardMode?"data-drag=1":""}`)).join("")}</div>
    <div class="btns">
      <button data-act="hint" ${act?"":"disabled"}>ヒント</button>
      <button data-act="sort" ${act?"":"disabled"}>五十音順</button>
      <button data-act="clear" ${act?"":"disabled"}>枠をもどす</button>
      ${pz ? `<button data-act="answer" ${act?"":"disabled"}>${G.cheat?"つぎの問題":"こたえ"}</button>`
           : `<button data-act="discard" class="${G.discardMode?"on":""}" ${act?"":"disabled"}>${G.discardMode?"やめる":"すてる"}</button>`}
      <button class="win" data-act="declare" ${act&&allPlaced?"":"disabled"}>あがり！</button>
    </div>
  </div>`;
  G.pop = null;
  if(G.confirm) $app.insertAdjacentHTML("beforeend", confirmHTML());
  if(G.result) $app.insertAdjacentHTML("beforeend", resultHTML());
}
function confirmHTML(){
  const c = G.confirm;
  return `<div class="ov"><div class="card"><h2>辞書にない言葉があるよ</h2>
    <div class="words">${c.words.map(wordHTML).join("")}</div>
    <p>辞書にない：<b>「${c.unknown.join("」「")}」</b></p>
    <p class="small">実在する言葉だよ、とあなたが認めるなら あがれるよ（原作は みんなで認め合うルール）。</p>
    <div class="two"><button data-act="confirm-no">やめる</button><button class="pri" data-act="confirm-yes">認める</button></div></div></div>`;
}
function resultHTML(){
  const r = G.result, me = r.who === "me", m = G.mode;
  let title, extra = "", again = "もう1回";
  if(m === "cpu"){
    title = me ? "あがり！ あなたの勝ち 🎉" : "CPUの勝ち…";
    extra = `<p class="small">せんせき：あなた ${S.wins.me} 勝 ／ CPU ${S.wins.cpu} 勝</p>`;
  } else if(m === "solo"){
    title = `あがり！ ${G.turn}ターンで あがれたよ 🎉`;
    extra = `<p class="small">${r.newBest ? "ベスト記録を こうしんしたよ！" : "ベスト：" + S.best + "ターン"}</p>`;
  } else {
    title = G.cheat ? "こたえで あがり！" : "できた！ 🎉";
    extra = `<p class="small">${G.cheat ? "（こたえを見たので、できた問題には数えないよ）" : "これまでに できた問題：" + S.solved + "問"}</p>`;
    again = "つぎの問題";
  }
  return `<div class="ov"><div class="card"><h2>${title}</h2>
    <div class="words">${r.words.map(wordHTML).join("")}</div>
    ${r.declared?'<p class="small">（自分で言葉と認めたものを含むよ）</p>':""}
    ${extra}
    <div class="two"><button data-act="title">もどる</button><button class="pri" data-act="again">${again}</button></div></div></div>`;
}
function render(){ S.screen==="title" ? renderTitle() : renderPlay(); }

$app.addEventListener("click", e => {
  if(Date.now() < suppressUntil) return;
  const el = e.target.closest("[data-act]"); if(!el || el.disabled) return;
  const a = el.dataset.act;
  if(a==="level"){ S.level = el.dataset.v; store.set("level", S.level); render(); }
  else if(a==="cpuhand"){ S.showCpu = el.dataset.v==="1"; store.set("showCpu", S.showCpu); render(); }
  else if(a==="start"){ newGame(el.dataset.mode); }
  else if(a==="again"){ newGame(G.mode); }
  else if(a==="answer"){ showAnswer(); }
  else if(a==="sound"){ S.sound = !S.sound; store.set("sound", S.sound); if(S.sound) sfx("place"); render(); }
  else if(a==="soundset"){ S.sound = el.dataset.v==="1"; store.set("sound", S.sound); if(S.sound) sfx("place"); render(); }
  else if(a==="exportdict"){ exportDict(); }
  else if(a==="title"){ if(G) G.gid++; S.screen="title"; render(); window.scrollTo(0, 0); }
  else if(a==="place"){ placeCard(Number(el.dataset.id)); }
  else if(a==="unplace"){ unplace(Number(el.dataset.i)); }
  else if(a==="hint"){ hint(); }
  else if(a==="sort"){ sortHand(); }
  else if(a==="clear"){ clearSlots(); }
  else if(a==="discard"){ toggleDiscard(); }
  else if(a==="declare"){ declare(); }
  else if(a==="confirm-no"){ G.confirm = null; render(); }
  else if(a==="confirm-yes"){ const w = G.confirm.words; G.confirm.unknown.forEach(addUserWord); G.confirm = null; finish("me", w, true); }
  else if(a==="glow"){ S.glow = el.dataset.v==="1"; store.set("glow", S.glow); render(); }
  else if(a==="delword"){ delUserWord(el.dataset.w); render(); }
  else if(a==="clearwords"){ if(confirm("認めた言葉を ぜんぶ消すよ。いい？")){ S.userWords=[]; store.set("userwords",[]); refreshDict(); render(); } }
  else if(a==="bigmode"){ S.bigMode = el.dataset.v; document.querySelectorAll('[data-act="bigmode"]').forEach(b=>b.classList.toggle("on", b.dataset.v===S.bigMode)); }
  else if(a==="cpubig"){ S.cpuBig = el.dataset.v==="1"; store.set("cpubig", S.cpuBig); refreshDict(); S.bigOpen = true; render(); }
  else if(a==="pickdict"){ S.bigOpen = true; const f = document.getElementById("dictfile"); if(f){ f.value = ""; f.click(); } }
  else if(a==="delbig"){ if(confirm("読み込んだ辞書を消すよ。いい？")){ S.big = null; store.del("bigdict"); refreshDict(); render(); } }
  else if(a==="copywords"){
    const txt = S.userWords.join(" ");
    (navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(txt) : Promise.reject()).then(()=>{ el.textContent="コピーしたよ"; }).catch(()=>{ prompt("コピーして使ってね", txt); });
  }
});

$app.addEventListener("change", async e => {
  if(e.target.id !== "dictfile" || !e.target.files || !e.target.files[0]) return;
  const f = e.target.files[0], common = S.bigMode === "common"; S.bigOpen = true;
  const say = t => { const el = document.getElementById("dictstatus"); if(el) el.textContent = t; };
  say("読み込み中…（そのままお待ちください）");
  try{
    const r = await importJMdict(f, common, (n, k) => say(`読み込み中… ${n.toLocaleString()}件を見たよ（${k.toLocaleString()}語）`));
    if(r.words.length < 50) throw new Error("取り出せた言葉が少なすぎるよ。ファイルを確認してね");
    const big = {mode: common ? "common" : "all", w: r.words};
    if(!store.set("bigdict", big)) throw new Error("端末に保存できなかったよ（容量オーバー）。「よく使う言葉だけ」で試してね");
    S.big = big; refreshDict();
    render();
    const el = document.getElementById("dictstatus"); if(el) el.textContent = `読み込めたよ！ ${r.words.length.toLocaleString()}語（${r.entries.toLocaleString()}件から）`;
  }catch(err){ say("うまく読み込めなかったよ：" + (err && err.message ? err.message : err)); }
});

// ---- ドラッグ＆ドロップ（指でもマウスでも）
let DRAG = null, lastOver = null, suppressUntil = 0;
// ゴーストは「指より少し上」に見えるので、見えているカードの中心を、落とす位置として使う
function hitPoint(e, d){ return {x:e.clientX, y:e.clientY - 0.2*d.h}; }
function overTarget(x, y){
  const el = document.elementFromPoint(x, y); if(!el) return null;
  let n;
  if((n = el.closest(".cell"))) return {type:"slot", i:Number(n.dataset.i), el:n, x, y};
  if((n = el.closest(".hand"))) return {type:"hand", el:n, x, y};
  if((n = el.closest(".dpile"))) return {type:"discard", el:n, x, y};
  return null;
}
// 手札の中で、落とした横位置にカードを差しこむ
function insertIntoHand(card, x, y){
  const tiles = Array.from(document.querySelectorAll('.hand .tile[data-from="hand"]'))
    .filter(el => Number(el.dataset.id) !== card.id);
  let anchor = null;
  if(tiles.length){
    let best = null, bd = Infinity;
    for(const el of tiles){
      const r = el.getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2;
      const dd = (x-cx)*(x-cx) + 2.5*(y-cy)*(y-cy);        // 同じ段のカードを優先
      if(dd < bd){ bd = dd; best = {el, cx}; }
    }
    const idx = tiles.indexOf(best.el);
    const target = x < best.cx ? tiles[idx] : (tiles[idx+1] || null);
    anchor = target ? Number(target.dataset.id) : null;
  }
  G.me.splice(G.me.indexOf(card), 1);
  const to = anchor === null ? -1 : G.me.findIndex(c=>c.id===anchor);
  if(to < 0) G.me.push(card); else G.me.splice(to, 0, card);
}
function dropTo(d, t){
  const card = G.me.find(c=>c.id===d.id); if(!card) return;
  const fromSlot = d.from === "slot", si = Number(d.i);
  if(t.type === "slot"){
    if(fromSlot){ if(si !== t.i){ const tmp = G.slots[si]; G.slots[si] = G.slots[t.i]; G.slots[t.i] = tmp; } }
    else { G.slots[t.i] = card; }            // 入れ替わった元のカードは手札にもどる
  } else if(t.type === "hand"){
    if(fromSlot) G.slots[si] = null;
    insertIntoHand(card, t.x, t.y);
  } else if(t.type === "discard"){
    if(G.mode !== "puzzle") G.pendingDiscard = d.id;
  }
}
const DEBUG = /[?&]debug/.test(location.search);
let dbgEl = null;
function dbg(m){
  if(!DEBUG) return;
  if(!dbgEl){ dbgEl = document.createElement("div");
    dbgEl.style.cssText = "position:fixed;left:0;right:0;bottom:0;max-height:28vh;overflow:auto;background:rgba(0,0,0,.82);color:#9f9;font:11px/1.4 monospace;padding:4px;z-index:99;pointer-events:none;white-space:pre-wrap";
    document.body.appendChild(dbgEl); }
  dbgEl.textContent = (m + "\n" + dbgEl.textContent).slice(0, 1200);
}
const canDrag = t => t && G && G.phase === "act" && !G.discardMode && !G.confirm && !G.result;
const mkDrag = (t, x, y) => ({el:t, id:Number(t.dataset.id), from:t.dataset.from, i:t.dataset.i,
                              x0:x, y0:y, on:false, ghost:null, w:t.offsetWidth, h:t.offsetHeight});
function beginGhost(d){
  d.on = true;
  const g = d.el.cloneNode(true);
  g.className = d.el.className.replace(/\b(new|pop|lift)\b/g, "") + " ghost";
  g.removeAttribute("data-act"); g.removeAttribute("data-drag");
  g.style.width = d.w + "px"; g.style.height = d.h + "px";
  document.body.appendChild(g); d.ghost = g;
  d.el.classList.add("lift"); document.body.classList.add("dragging");
  const dp = $app.querySelector(".dpile"); if(dp) dp.classList.add("zone");
  dbg("drag start " + d.from + " " + d.id);
}
function moveDrag(x, y){
  const d = DRAG; if(!d.on) beginGhost(d);
  d.ghost.style.left = x + "px"; d.ghost.style.top = y + "px";
  const pt = hitPoint({clientX:x, clientY:y}, d);
  const t = overTarget(pt.x, pt.y);
  if(lastOver && (!t || t.el !== lastOver)) lastOver.classList.remove("over");
  if(t){ t.el.classList.add("over"); lastOver = t.el; } else lastOver = null;
}
function finishDrag(x, y, cancel){
  const d = DRAG; DRAG = null; if(!d || !d.on) return;
  if(d.ghost) d.ghost.remove();
  document.body.classList.remove("dragging");
  suppressUntil = Date.now() + 350;
  let t = null;
  if(!cancel){ const pt = hitPoint({clientX:x, clientY:y}, d); t = overTarget(pt.x, pt.y); if(t){ dropTo(d, t); if(t.type !== "discard" && !(G && G.mode==="puzzle" && t.type==="discard")) sfx("place"); } }
  dbg("drop " + (cancel ? "CANCEL" : (t ? t.type : "none")));
  lastOver = null;
  if(G && G.pendingDiscard != null){ const id = G.pendingDiscard; G.pendingDiscard = null; return discardCard(id); }
  render();
}

// マウス：pointer イベント
$app.addEventListener("pointerdown", e => {
  if(e.pointerType === "touch" || e.button !== 0 || DRAG) return;
  const t = e.target.closest(".tile[data-drag]"); if(!canDrag(t)) return;
  DRAG = mkDrag(t, e.clientX, e.clientY); DRAG.pid = e.pointerId;
});
window.addEventListener("pointermove", e => {
  if(!DRAG || DRAG.pid !== e.pointerId) return;
  if(!DRAG.on && Math.hypot(e.clientX-DRAG.x0, e.clientY-DRAG.y0) < 8) return;
  e.preventDefault(); moveDrag(e.clientX, e.clientY);
}, {passive:false});
window.addEventListener("pointerup", e => {
  if(!DRAG || DRAG.pid !== e.pointerId) return;
  if(DRAG.on) finishDrag(e.clientX, e.clientY, false); else DRAG = null;
});
window.addEventListener("pointercancel", e => { if(DRAG && DRAG.pid === e.pointerId){ if(DRAG.on) finishDrag(e.clientX, e.clientY, true); else DRAG = null; } });

// 指：touch イベント（iPhoneのSafariで、スクロールやバウンスを確実にとめるため）
$app.addEventListener("touchstart", e => {
  if(DRAG || e.touches.length !== 1) return;
  const t = e.target.closest(".tile[data-drag]"); if(!canDrag(t)) return;
  const tc = e.touches[0];
  DRAG = mkDrag(t, tc.clientX, tc.clientY); DRAG.touch = tc.identifier;
  dbg("touchstart");
}, {passive:true});
window.addEventListener("touchmove", e => {
  if(!DRAG || DRAG.touch === undefined) return;
  const tc = Array.from(e.touches).find(x => x.identifier === DRAG.touch); if(!tc) return;
  if(e.cancelable) e.preventDefault();               // ← ページが動かないように
  if(!DRAG.on && Math.hypot(tc.clientX-DRAG.x0, tc.clientY-DRAG.y0) < 6) return;
  moveDrag(tc.clientX, tc.clientY);
}, {passive:false});
function touchEnd(e, cancel){
  if(!DRAG || DRAG.touch === undefined) return;
  const tc = Array.from(e.changedTouches).find(x => x.identifier === DRAG.touch); if(!tc) return;
  const d = DRAG;
  if(e.cancelable) e.preventDefault();                // ネイティブの click は止めて、タップは自分で処理する
  if(d.on) finishDrag(tc.clientX, tc.clientY, cancel);
  else { DRAG = null; if(!cancel){ dbg("tap"); d.el.click(); } }
}
window.addEventListener("touchend", e => touchEnd(e, false), {passive:false});
window.addEventListener("touchcancel", e => touchEnd(e, true), {passive:false});
$app.addEventListener("contextmenu", e => { if(e.target.closest(".tile")) e.preventDefault(); });
render();
</script>
</body>

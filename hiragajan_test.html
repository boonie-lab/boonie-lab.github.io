<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6b4f">
<title>ひらがじゃん風 ことば作りカード</title>
<style>
:root{
  --paper:#f6f1e7; --ink:#2b2a28; --felt:#2f6b4f; --felt-dark:#235239; --felt-light:#3d7d60;
  --tile:#fffaf0; --tile-edge:#d9cdb4; --accent:#e0693c; --accent-dark:#b94f27;
  --blue:#e3eefb; --pink:#fbe4e8; --lime:#e4f3dc; --gold:#f4c542;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overscroll-behavior:none;background:var(--paper);color:var(--ink);
  font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",system-ui,sans-serif}
body{min-height:100vh;min-height:100dvh;touch-action:manipulation;-webkit-text-size-adjust:100%}
.felt{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;cursor:pointer}
#app{max-width:520px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 10px max(14px,env(safe-area-inset-bottom))}

/* title */
.title{text-align:center;padding:18px 6px}
.title h1{font-size:1.7rem;line-height:1.3;margin:10px 0 6px;letter-spacing:.04em}
.title .lead{margin:0 0 18px;color:#555;line-height:1.7}
.deco{display:flex;justify-content:center;gap:6px;margin:6px 0 10px}
.panel{background:#fff;border:1px solid var(--tile-edge);border-radius:14px;padding:14px;margin:12px 0;text-align:left}
.panel h2{font-size:.95rem;margin:0 0 8px}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:10px 4px;border:2px solid var(--tile-edge);background:var(--tile);border-radius:10px;font-weight:600}
.seg button.on{border-color:var(--felt);background:var(--felt);color:#fff}
.big{display:block;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);color:#fff;font-size:1.2rem;font-weight:700;box-shadow:0 3px 0 var(--accent-dark)}
.big:active{transform:translateY(2px);box-shadow:0 1px 0 var(--accent-dark)}
details{margin:10px 0}
summary{cursor:pointer;font-weight:600;padding:6px 0}
details p,details li{line-height:1.7;font-size:.92rem}
.small{font-size:.8rem;color:#6b665c;line-height:1.6}

/* tiles */
.tile{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--tile-edge);
  background:var(--tile);border-radius:8px;box-shadow:0 2px 0 var(--tile-edge);
  font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-weight:700;color:var(--ink);
  width:100%;aspect-ratio:3/4;font-size:22px;font-size:clamp(18px,6.4vw,30px);padding:0;line-height:1;user-select:none}
.tile.d{background:var(--blue)} .tile.s{background:var(--pink)} .tile.l{background:var(--lime)}
.tile.new{outline:3px solid var(--gold);outline-offset:1px}
.tile.pop{animation:pop .5s ease-out}
.tile.disc{outline:3px dashed #c2362b;outline-offset:1px}
.tile.back{background:repeating-linear-gradient(45deg,#2b5f8a,#2b5f8a 6px,#3a76a8 6px,#3a76a8 12px);color:transparent;border-color:#1f4768}
.tile.mini{font-size:16px;font-size:clamp(14px,4.4vw,20px)}
@keyframes pop{0%{transform:translateY(-14px) scale(1.15);opacity:0}100%{transform:none;opacity:1}}
.row{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.hand{min-height:calc((min(100vw, 520px) - 68px) / 8 * 1.334 + 4px);border-radius:8px;padding:2px 0}
.tile[data-drag]{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:grab}
.tile.lift{opacity:.3}
.tile.ghost{position:fixed;z-index:30;pointer-events:none;margin:0;transform:translate(-50%,-70%) rotate(-4deg);
  box-shadow:0 10px 20px rgba(0,0,0,.4);opacity:.97;outline:none;animation:none}
.over{outline:3px solid var(--gold);outline-offset:1px;background-color:rgba(244,197,66,.18)}
.cell.over{background:rgba(244,197,66,.28)}
.dpile.zone{outline:2px dashed rgba(255,255,255,.7);outline-offset:2px;border-radius:8px}
.dpile.zone.over{background:rgba(194,54,43,.45);outline-color:#ffb4a8}
.grp.ok{background:#4c9a62;box-shadow:0 0 0 2px var(--gold)}
.rl{display:block;font-size:.6rem;white-space:nowrap;margin-top:1px}
.grp.ok.rare{background:#5f7a99;box-shadow:0 0 0 2px #cdd8e8}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:1px solid var(--tile-edge);background:var(--tile);border-radius:999px;padding:4px 10px;font-size:.9rem}
.chips + .two button{padding:8px}
.title .big{margin-bottom:10px;line-height:1.3}
.title .big small{display:block;font-size:.76rem;font-weight:500;opacity:.92;margin-top:2px}
.title .big.alt{background:var(--felt);box-shadow:0 3px 0 var(--felt-dark)}
.title .big.alt2{background:#4a6fa5;box-shadow:0 3px 0 #355079}
.title .big.alt3{background:#8a5fb0;box-shadow:0 3px 0 #66427f}
.sect{font-size:1rem;margin:16px 0 8px;letter-spacing:.06em;color:#555;border-top:1px dashed var(--tile-edge);padding-top:12px}
.codebox{display:block;width:100%;min-height:6.5em;font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;word-break:break-all;border:1px solid var(--tile-edge);border-radius:8px;padding:8px;background:#fff;color:var(--ink);resize:vertical;margin:6px 0}
.errbox{background:#fde7e4;border:1px solid #e9a79f;color:#7a1f14;border-radius:10px;padding:10px;margin:10px 0;font-size:.9rem;line-height:1.6;text-align:left}
.two button:disabled{opacity:.4}
.hdr .hb{display:flex;gap:6px}
.hdr .hb button{min-width:38px;white-space:nowrap}
.hdr > span:first-child{min-width:0;margin-right:6px}
/* 一人用：カードを大きく、枠を3段に */
.felt.bigmode{--cw:15vw}
@supports (width:min(1px,2px)){.felt.bigmode{--cw:min(17vw,9.5vh,80px)}}
.felt.bigmode .slots{display:flex;flex-direction:column;gap:6px;margin:6px 0 8px}
.felt.bigmode .grp{display:flex;align-items:center;gap:8px;padding:5px 8px}
.felt.bigmode .grp .gl{flex:none;width:4.4em;margin:0;text-align:left;font-size:.8rem}
.felt.bigmode .grp .cells{display:flex;gap:6px}
.felt.bigmode .cell{width:var(--cw);flex:none}
.felt.bigmode .row.hand{grid-template-columns:repeat(4,var(--cw));justify-content:center;gap:8px;min-height:calc(var(--cw)*2.7 + 8px)}
.felt.bigmode .hand .tile,.felt.bigmode .cell .tile{font-size:calc(var(--cw)*.52)}
.felt.bigmode .msg{font-size:1.02rem}

/* table */
.hdr{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:#555;margin-bottom:6px}
.hdr b{color:var(--ink)}
.hdr button{border:1px solid var(--tile-edge);background:#fff;border-radius:8px;padding:4px 10px}
.felt{background:var(--felt);border-radius:16px;padding:10px;color:#fff;box-shadow:inset 0 2px 10px rgba(0,0,0,.25)}
.who{font-size:.8rem;opacity:.9;margin:0 0 6px;display:flex;justify-content:space-between}
.mid{margin:10px 0;padding:8px;background:var(--felt-dark);border-radius:12px}
.msg{min-height:2.6em;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;line-height:1.5;padding:2px 4px}
.piles{display:flex;gap:8px;align-items:center;margin-top:6px}
.deck{width:44px;flex:none}
.deck .cnt{font-size:.7rem;text-align:center;margin-top:2px;opacity:.9}
.dpile{flex:1;display:flex;flex-wrap:wrap;gap:3px;min-height:34px;align-content:flex-start;padding:4px 3px 0;min-height:44px}
.dpile .tile{width:calc((100% - 21px)/8);font-size:13px;font-size:clamp(11px,3.4vw,16px);border-radius:5px}
.dlabel{font-size:.7rem;opacity:.85;margin-bottom:2px;padding-left:3px}
.slots{display:grid;grid-template-columns:2fr 3fr 3fr;gap:8px;margin:6px 0 10px}
.grp{background:var(--felt-light);border-radius:10px;padding:5px}
.grp .gl{font-size:.68rem;text-align:center;margin-bottom:3px;opacity:.95}
.grp .cells{display:grid;gap:3px}
.grp.g2 .cells{grid-template-columns:repeat(2,1fr)} .grp.g3 .cells{grid-template-columns:repeat(3,1fr)}
.cell{aspect-ratio:3/4;border:2px dashed rgba(255,255,255,.55);border-radius:7px;display:block;touch-action:none;position:relative;min-width:0}
.cell .tile{position:absolute;top:0;left:0;right:0;bottom:0;width:100%;height:100%;aspect-ratio:auto}
.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.btns button{border:0;background:#fff;color:var(--ink);border-radius:10px;padding:10px 2px;font-weight:700;font-size:.85rem;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.btns button:disabled{opacity:.4}
.btns .win{grid-column:1/-1;background:var(--accent);color:#fff;font-size:1.1rem;padding:13px}
.btns .win:disabled{background:#9aa;opacity:.7}
.btns button.on{background:#c2362b;color:#fff}

/* overlay */
.ov{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(20,30,25,.72);display:flex;align-items:center;justify-content:center;padding:18px;z-index:10}
.card{background:var(--paper);border-radius:18px;padding:18px;max-width:420px;width:100%;text-align:center;max-height:90vh;overflow:auto}
.card h2{margin:4px 0 10px;font-size:1.5rem}
.words{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:10px 0}
.wd{display:flex;gap:3px;width:calc(var(--n) * 38px + 6px)}
.wd .tile{font-size:20px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.two button{padding:12px;border-radius:12px;border:2px solid var(--tile-edge);background:#fff;font-weight:700}
.two button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
</style>
</head>

function mkDict(extra){
  const S2 = new Set(DICT.w2), S3 = new Set(DICT.w3);

  const ALL = Array.from(S2).concat(Array.from(S3));
  return {S2, S3, K2:mkKeyMap(Array.from(S2)), K3:mkKeyMap(Array.from(S3)), ALL, CH:ALL.map(w=>Array.from(w))};
}

function solve(chars, D){
  D = D || DME; const K2 = D.K2, K3 = D.K3;
  const n = chars.length;
  for(let i=0;i<n;i++) for(let j=i+1;j<n;j++){
    const w2 = K2.get(key(chars[i]+chars[j])); if(!w2) continue;
    const rest = []; for(let t=0;t<n;t++) if(t!==i && t!==j) rest.push(chars[t]);
    for(let b=1;b<5;b++) for(let c=b+1;c<6;c++){
      const wa = K3.get(key(rest[0]+rest[b]+rest[c])); if(!wa) continue;
      let tb = ""; for(let t=1;t<6;t++) if(t!==b && t!==c) tb += rest[t];
      const wb = K3.get(key(tb)); if(!wb) continue;
      return {w:[w2[0], wa[0], wb[0]]};
    }
  }
  return null;
}
function countMap(chars){ const m = {}; for(const c of chars) m[c] = (m[c]||0)+1; return m; }

function buildable(chars, D){
  D = D || DME;
  const have = countMap(chars), out = [];

    const need = countMap(w); let ok = true;
    for(const c in need){ if((have[c]||0) < need[c]){ ok = false; break; } }
    if(ok) out.push(w);
  }
  return out;
}

    else if(miss === 1 && chs.length === 3 && (unseen[missCh]||0) > 0) s += 1;
  }
  return s;
}
function pickWeighted(unseen, k){
  const bag = []; for(const c in unseen) for(let i=0;i<unseen[c];i++) bag.push(c);
  const set = new Set(); let guard = 0;
  while(set.size < k && guard++ < 500) set.add(bag[Math.floor(Math.random()*bag.length)]);
  return Array.from(set);
}
// CPUの すてるカード選び。戻り値は手札(8まい)の中の番号
function chooseDiscard(hand8, deckCards, level, D){
  D = D || DCPU;
  const unseen = countMap(deckCards.map(c=>c.ch));
  const letters = Object.keys(unseen);
  const sample = level==="hard" ? letters : (level==="normal" ? pickWeighted(unseen, 14) : []);
  let best = -1, bestScore = -Infinity;
  for(let i=0;i<hand8.length;i++){
    const h7 = hand8.filter((_,k)=>k!==i);
    let s1 = 0;
    for(const L of sample){ if(solve(h7.concat(L), D)) s1 += (level==="hard" ? unseen[L] : 1); }
    const s2 = nearScore(h7, unseen, D);
    let score;
    if(level==="hard") score = s1*1000 + s2 + Math.random();
    else if(level==="normal") score = s1*40 + s2 + Math.random()*4;
    else score = s2 + Math.random()*25;
    if(score > bestScore){ bestScore = score; best = i; }
  }
  return best;
}

// 出題パズル：必ず「2・3・3もじ」の言葉が作れる8まいを出す（言葉は、自作の基本の辞書から選ぶ）
function makePuzzle(){
  const cap = {}; for(const c of BASE) cap[c] = 2; for(const c of VOICED + SPECIAL) cap[c] = 1;
  const pick = a => a[Math.floor(Math.random()*a.length)];
  let last = null;
  for(let tries=0; tries<5000; tries++){
    const a = pick(DICT.w2), b = pick(DICT.w3), c = pick(DICT.w3);
    if(b === c) continue;
    const cnt = {}; let ok = true;
    for(const ch of a+b+c){ cnt[ch] = (cnt[ch]||0) + 1; if(cnt[ch] > (cap[ch]||0)){ ok = false; break; } }
    if(!ok) continue;
    last = {words:[a,b,c], chars:shuffle(Array.from(a+b+c))};
    // すぐ並べられてしまう（もとの順のまま）ことを避ける
    if(last.chars.join("") !== (a+b+c)) return last;
  }
  return last;
}

// JMdict（XML、gz のままでも可）から、2〜3もじの読みを取り出す
async function importJMdict(file, commonOnly, onProgress){
  let stream = file.stream();
  const head = new Uint8Array(await file.slice(0,2).arrayBuffer());
  if(head[0]===0x1f && head[1]===0x8b){
    if(typeof DecompressionStream === "undefined") throw new Error("このブラウザは .gz を開けないよ。解凍した JMdict_e を選んでね");
    stream = stream.pipeThrough(new DecompressionStream("gzip"));
  }
  const reader = stream.pipeThrough(new TextDecoderStream("utf-8")).getReader();
  const found = new Set(); let buf = "", entries = 0, lastTick = 0;
  const hira = x => x.replace(/[\u30a1-\u30f6]/g, ch => String.fromCharCode(ch.charCodeAt(0)-0x60));
  const pri = /<(re|ke)_pri>/, bad = /&(obs|obsc|arch|rare|vulg);/;
  const one = chunk => {
    entries++;
    const hasPri = pri.test(chunk);
    if(commonOnly && !hasPri) return;
    if(!hasPri && bad.test(chunk)) return;
    const re = /<reb>([^<]+)<\/reb>/g; let m;
    while((m = re.exec(chunk))){ const w = hira(m[1]); if(okWord(w)) found.add(w); }
  };
  for(;;){
    const {done, value} = await reader.read(); if(done) break;
    buf += value;
    let i; while((i = buf.indexOf("</entry>")) >= 0){ one(buf.slice(0, i)); buf = buf.slice(i+8); }
    if(Date.now()-lastTick > 250){ lastTick = Date.now(); onProgress && onProgress(entries, found.size); await new Promise(r=>setTimeout(r,0)); }
  }
  if(entries === 0) throw new Error("JMdictのファイルに見えないよ（<entry>が見つからない）");
  return {entries, words:Array.from(found)};
}

function tone(f, t0, dur, type, vol, f2){
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || "sine"; o.frequency.setValueAtTime(f, t0);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0 + dur + 0.03);
}
function noise(t0, dur, f, q, vol){
  const n = Math.max(1, Math.floor(AC.sampleRate * dur)), buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = Math.random()*2 - 1;
  const src = AC.createBufferSource(); src.buffer = buf;
  const bp = AC.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = f; bp.Q.value = q;
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(bp); bp.connect(g); g.connect(AC.destination); src.start(t0);
}
function sfx(name){

    else if(name === "draw"){ noise(t, 0.12, 1800, 0.8, 0.09); tone(320, t, 0.1, "sine", 0.03, 520); }
    else if(name === "discard"){ tone(250, t, 0.1, "sine", 0.1, 150); }
    else if(name === "ok"){ tone(880, t, 0.12, "sine", 0.07); tone(1320, t + 0.08, 0.14, "sine", 0.05); }
    else if(name === "win"){ [523, 659, 784, 1047].forEach((f, i) => tone(f, t + i*0.11, 0.24, "triangle", 0.09)); }
    else if(name === "lose"){ tone(392, t, 0.22, "triangle", 0.07); tone(330, t + 0.2, 0.32, "triangle", 0.07); }
    else if(name === "obj"){ tone(330, t, 0.09, "square", 0.04); tone(220, t + 0.1, 0.18, "square", 0.04); }

        <li><b>出題パズル</b>：かならず作れる8まいが配られるよ。ゆっくり考えてね。できたら、用意していた答えの例も見られるよ。</li>
        <li><b>ひとりプレイ</b>：7まいで始めて、1まい引いては、あがるか1まいすてる。何ターンであがれたかを競うよ。</li>

      ${BUILTIN.length?`<p class="small">このアプリには、よく使う言葉 ${BUILTIN.length.toLocaleString()}語が最初から入っているよ。さらに増やしたいときだけ、読み込んでね。</p>`:""}

      <button class="big" style="font-size:1rem;padding:12px;margin-top:10px" data-act="pickdict">ファイルを選ぶ</button>

      ${S.big?'<div class="two"><button data-act="delbig">読み込んだ辞書を消す</button><button data-act="exportdict">辞書をファイルに書き出す</button></div>':""}
      <h2 style="margin-top:12px">CPUが使う言葉</h2>

    </details>
    <details class="panel"><summary>あなたが認めた言葉（${S.userWords.length}語）</summary>
      ${S.userWords.length ? `<div class="chips">${S.userWords.map(x=>`<button class="chip" data-act="delword" data-w="${x}">${x} ✕</button>`).join("")}</div>
        <div class="two"><button data-act="copywords">コピーする</button><button data-act="clearwords">ぜんぶ消す</button></div>`
        : `<p class="small">辞書にない言葉で「認める」を押すと、ここに たまっていくよ。たまった言葉は、次から辞書の言葉として光ったり、CPUも使ったりするよ。</p>`}

  </div>`;
}

function renderPlay(){
  const solo = G.mode === "solo" || G.mode === "puzzle", pz = G.mode === "puzzle";
  const placed = placedIds();
  const hand = G.me.filter(c=>!placed.has(c.id));
  const act = G.phase==="act", arr = canArr();
  const cells = i => {
    const c = G.slots[i];
    return c ? `<div class="cell" data-i="${i}" style="border-style:solid">${tileHTML(c,"",`data-act="unplace" data-i="${i}" data-id="${c.id}" data-from="slot" ${arr&&!G.discardMode?"data-drag=1":""}`)}</div>`
             : `<div class="cell" data-i="${i}"></div>`;
  };
  const okGrp = (a,b) => {
    if(!S.glow) return false;
    const cs = G.slots.slice(a,b); if(cs.some(x=>!x)) return false;
    const w = cs.map(x=>x.ch).join("");
    if(!(w.length===2?SET2:SET3).has(w)) return 0;
    return COMMON.has(w) ? 1 : 2;      // 1=よく使う言葉、2=あまり一般的ではない言葉
  };
  const mark = v => v===2 ? ' <span class="rl">ありかも？</span>' : (v ? " ✓" : "");
  const ok2 = okGrp(0,2), ok3a = okGrp(2,5), ok3b = okGrp(5,8);
  const okNow = [ok2, ok3a, ok3b];
  if(okNow.some((v,i) => v && !(G.prevOk||[])[i])) sfx("ok");     // 新しく言葉になったら ぴん
  G.prevOk = okNow;
  const showOpp = G.mode === "online" ? G.showOpp : S.showCpu;
  const cpuTiles = G.cpu.map(c => showOpp
      ? `<span class="tile ${tileClass(c.ch)} mini ${G.cpuNewId===c.id?"new":""} ${G.pop===c.id?"pop":""}">${c.ch}</span>`
      : `<span class="tile back mini ${G.cpuNewId===c.id?"new":""} ${G.pop===c.id?"pop":""}">・</span>`).join("");
  const dis = G.discard.slice(-16).map(c=>`<span class="tile ${tileClass(c.ch)} ${G.last===c.id?"new":""} ${G.pop===c.id?"pop":""}">${c.ch}</span>`).join("");
  const allPlaced = G.slots.every(Boolean);
  const hdr = G.mode === "online" ? `オンライン ／ 勝ち あなた<b>${S.owins.me}</b>-あいて<b>${S.owins.opp}</b> ／ 異議あり あと<b>${G.objLeft.me}</b>回`
            : G.mode === "cpu" ? `CPU：<b>${LEVELS[S.level]}</b> ／ 勝ち あなた<b>${S.wins.me}</b>-CPU<b>${S.wins.cpu}</b>`
            : pz ? `ひとりパズル ／ できた問題 <b>${S.solved}</b>`
            : `引いてすてる ／ <b>${G.turn}</b>ターン目 ／ ベスト <b>${S.best?S.best+"ターン":"なし"}</b>`;
  const piles = `
      <div class="piles">
        <div class="deck"><span class="tile back mini" style="aspect-ratio:3/4">・</span><div class="cnt">山札 ${G.deck.length}</div></div>
        <div style="flex:1"><div class="dlabel">すてたカード（ここにドラッグでも すてられるよ）</div><div class="dpile">${dis||'<span class="small" style="color:#cfe;opacity:.8">まだ ないよ</span>'}</div></div>
      </div>`;
  $app.innerHTML = `
  <div class="hdr"><span>${hdr}</span>
    <span class="hb"><button data-act="sound" aria-label="効果音">${S.sound?"🔊":"🔇"}</button><button data-act="title">もどる</button></span></div>
  <div class="felt ${solo?"bigmode":""}">
    ${solo?"":`<p class="who"><span>${G.mode==="online"?"あいて":"CPU"}の手札（${G.cpu.length}まい）</span></p>
    <div class="row" style="grid-template-columns:repeat(${Math.max(8,G.cpu.length)},1fr)">${cpuTiles}</div>`}
    <div class="mid">
      <div class="msg">${G.msg}</div>
      ${pz?"":piles}
    </div>
    <p class="who"><span>${pz?"言葉を作ろう":"あなた：言葉を作ろう"}</span></p>
    <div class="slots">
      <div class="grp g2 ${ok2?"ok":""} ${ok2===2?"rare":""}"><div class="gl">2もじ${mark(ok2)}</div><div class="cells">${cells(0)}${cells(1)}</div></div>
      <div class="grp g3 ${ok3a?"ok":""} ${ok3a===2?"rare":""}"><div class="gl">3もじ${mark(ok3a)}</div><div class="cells">${cells(2)}${cells(3)}${cells(4)}</div></div>
      <div class="grp g3 ${ok3b?"ok":""} ${ok3b===2?"rare":""}"><div class="gl">3もじ${mark(ok3b)}</div><div class="cells">${cells(5)}${cells(6)}${cells(7)}</div></div>
    </div>
    <p class="who"><span>${pz?"手札":"あなたの手札"}</span><span>${G.discardMode?"▼ すてるカードをタップ":""}</span></p>
    <div class="row hand">${hand.map(c=>tileHTML(c, `${G.newId===c.id?"new":""} ${G.pop===c.id?"pop":""} ${G.discardMode?"disc":""}`, `data-act="place" data-id="${c.id}" data-from="hand" ${arr?"":"disabled"} ${arr&&!G.discardMode?"data-drag=1":""}`)).join("")}</div>
    <div class="btns">
      <button data-act="hint" ${act?"":"disabled"}>ヒント</button>
      <button data-act="sort" ${arr?"":"disabled"}>五十音順</button>
      <button data-act="clear" ${arr?"":"disabled"}>枠をもどす</button>
      ${pz ? `<button data-act="answer" ${act?"":"disabled"}>${G.cheat?"つぎの問題":"こたえ"}</button>`
           : `<button data-act="discard" class="${G.discardMode?"on":""}" ${act?"":"disabled"}>${G.discardMode?"やめる":"すてる"}</button>`}
      <button class="win" data-act="declare" ${act&&allPlaced&&!G.noDeclare?"":"disabled"}>あがり！</button>
    </div>
  </div>`;
  G.pop = null;
  if(G.confirm) $app.insertAdjacentHTML("beforeend", confirmHTML());
  if(G.phase === "judge" && G.judge) $app.insertAdjacentHTML("beforeend", judgeHTML());
  if(G.result) $app.insertAdjacentHTML("beforeend", resultHTML());
  if(G.lost) $app.insertAdjacentHTML("beforeend", lostHTML());
}
function confirmHTML(){
  const c = G.confirm, rare = c.rare || [];
  const title = c.unknown.length ? "辞書にない言葉があるよ" : "判断が必要な言葉があるよ";
  const note = c.unknown.length
    ? "実在する言葉だよ、とあなたが認めるなら あがれるよ（原作は みんなで認め合うルール）。"
    : "辞書には載っているけど、ふだんはあまり使わない言葉だよ（人の名前や、魚・植物の名前など）。このままあがる？";
  const note2 = note + (G.mode === "online" ? " このあと あいてが「認める」か「異議あり！」を選ぶよ。" : "");
  return `<div class="ov"><div class="card"><h2>${title}</h2>
    <div class="words">${c.words.map(wordHTML).join("")}</div>
    ${c.unknown.length?`<p>辞書にない：<b>「${c.unknown.join("」「")}」</b></p>`:""}
    ${rare.length?`<p>ありかも？：<b>「${rare.join("」「")}」</b></p>`:""}
    <p class="small">${note2}</p>
    <div class="two"><button data-act="confirm-no">やめる</button><button class="pri" data-act="confirm-yes">${c.unknown.length?"認める":"あがる"}</button></div></div></div>`;
}
function judgeHTML(){
  const J = G.judge, ws = J.words, left = G.objLeft.me;
  const cls = w => !(w.length === 2 ? SET2 : SET3).has(w) ? 2 : (COMMON.has(w) ? 0 : 1);   // 0=よく使う 1=ありかも？ 2=辞書にない
  const unk = ws.filter(w => cls(w) === 2), rare = ws.filter(w => cls(w) === 1);
  const note = (unk.length || rare.length)
    ? "あなたの辞書では 判断が必要な言葉があるよ。言葉として「認める」？"
    : "どれも辞書にある言葉だよ。おかしいと思ったら「異議あり！」も出せるよ。";
  return `<div class="ov"><div class="card"><h2>あいてが あがり宣言！</h2>
    <div class="words">${ws.map(wordHTML).join("")}</div>
    ${unk.length ? `<p>辞書にない：<b>「${unk.join("」「")}」</b></p>` : ""}
    ${rare.length ? `<p>ありかも？：<b>「${rare.join("」「")}」</b></p>` : ""}
    <p class="small">${note}</p>
    <div class="two"><button data-act="resp-obj" ${left > 0 ? "" : "disabled"}>異議あり！<br><span class="small">のこり${left}回</span></button><button class="pri" data-act="resp-ok">認める</button></div>
    <p class="small">「認める」だと あいての勝ち。「異議あり！」だと あいてのあがりは取り消しになるよ。</p></div></div>`;
}
function lostHTML(){
  return `<div class="ov"><div class="card"><h2>つながりが 切れたよ</h2>
    <p class="small">${esc(G.lost === true ? "つながりが切れたよ" : G.lost)}<br>あいての電波や、画面のスリープが原因かも。もう一度 つなぎ直してね。</p>
    <div class="two"><button class="pri" data-act="title" style="grid-column:1/-1">もどる</button></div></div></div>`;
}
function resultHTML(){
  const r = G.result, me = r.who === "me", m = G.mode;
  let title, extra = "", again = "もう1回", againOff = false;
  if(m === "cpu"){
    title = me ? "あがり！ あなたの勝ち 🎉" : "CPUの勝ち…";
    extra = `<p class="small">せんせき：あなた ${S.wins.me} 勝 ／ CPU ${S.wins.cpu} 勝</p>`;
  } else if(m === "online"){
    title = me ? "あがり！ あなたの勝ち 🎉" : "あいての勝ち…";
    extra = `<p class="small">オンラインの せんせき：あなた ${S.owins.me} 勝 ／ あいて ${S.owins.opp} 勝</p>`;
    if(G.role === "host"){ if(G.askAgain) extra += `<p class="small"><b>あいてが もう1回 したいって</b></p>`; }
    else { again = G.askedAgain ? "伝えたよ" : "もう1回 おねがい"; againOff = !!G.askedAgain; if(G.askedAgain) extra += `<p class="small">ホストに伝えたよ。はじまるのを待ってね</p>`; }
  } else if(m === "solo"){
    title = `あがり！ ${G.turn}ターンで あがれたよ 🎉`;
    extra = `<p class="small">${r.newBest ? "ベスト記録を こうしんしたよ！" : "ベスト：" + S.best + "ターン"}</p>`;
  } else {
    title = G.cheat ? "こたえで あがり！" : "できた！ 🎉";
    extra = `<p class="small">${G.cheat ? "（こたえを見たので、できた問題には数えないよ）" : "これまでに できた問題：" + S.solved + "問"}</p>`;
    if(!G.cheat && G.sol){
      const same = r.words.slice().sort().join() === G.sol.slice().sort().join();
      extra += `<p class="small">出題で用意していた答え（例）：<b>${G.sol.map(w => "「" + w + "」").join("")}</b><br>${same ? "あなたの答えと同じだったよ！" : "ちがう答えでも、辞書にある言葉なら OK だよ。"}</p>`;
    }
    again = "つぎの問題";
  }
  return `<div class="ov"><div class="card"><h2>${title}</h2>
    <div class="words">${r.words.map(wordHTML).join("")}</div>
    ${r.declared ? '<p class="small">（辞書にない／ありかも？の言葉を含むよ）</p>' : ""}
    ${extra}
    <div class="two"><button data-act="title">もどる</button><button class="pri" data-act="again" ${againOff ? "disabled" : ""}>${again}</button></div></div></div>`;
}
function render(){
  if(S.screen === "title") renderTitle(); else if(S.screen === "online") renderOnline(); else renderPlay();
  if(NOAR) fixAspect();
}

$app.addEventListener("click", e => {
  if(Date.now() < suppressUntil) return;
  const el = e.target.closest("[data-act]"); if(!el || el.disabled) return;
  const a = el.dataset.act;
  if(a==="level"){ S.level = el.dataset.v; store.set("level", S.level); render(); }
  else if(a==="cpuhand"){ S.showCpu = el.dataset.v==="1"; store.set("showCpu", S.showCpu); render(); }
  else if(a==="start"){ newGame(el.dataset.mode); }
  else if(onlineAct(a, el)){ /* オンライン関連 */ }
  else if(a==="again"){ newGame(G.mode); }
  else if(a==="answer"){ showAnswer(); }
  else if(a==="sound"){ S.sound = !S.sound; store.set("sound", S.sound); if(S.sound) sfx("place"); render(); }
  else if(a==="soundset"){ S.sound = el.dataset.v==="1"; store.set("sound", S.sound); if(S.sound) sfx("place"); render(); }
  else if(a==="exportdict"){ exportDict(); }
  else if(a==="title"){ if(G) G.gid++; S.screen="title"; render(); window.scrollTo(0, 0); }
  else if(a==="place"){ placeCard(Number(el.dataset.id)); }
  else if(a==="unplace"){ unplace(Number(el.dataset.i)); }
  else if(a==="hint"){ hint(); }
  else if(a==="sort"){ sortHand(); }
  else if(a==="clear"){ clearSlots(); }
  else if(a==="discard"){ toggleDiscard(); }
  else if(a==="declare"){ declare(); }
  else if(a==="confirm-no"){ G.confirm = null; render(); }
  else if(a==="confirm-yes"){ const w = G.confirm.words; if(G.mode !== "online") G.confirm.unknown.forEach(addUserWord); G.confirm = null; declareDone(w, true); }
  else if(a==="glow"){ S.glow = el.dataset.v==="1"; store.set("glow", S.glow); render(); }
  else if(a==="delword"){ delUserWord(el.dataset.w); render(); }
  else if(a==="clearwords"){ if(confirm("認めた言葉を ぜんぶ消すよ。いい？")){ S.userWords=[]; store.set("userwords",[]); refreshDict(); render(); } }
  else if(a==="bigmode"){ S.bigMode = el.dataset.v; document.querySelectorAll('[data-act="bigmode"]').forEach(b=>b.classList.toggle("on", b.dataset.v===S.bigMode)); }
  else if(a==="cpubig"){ S.cpuBig = el.dataset.v==="1"; store.set("cpubig", S.cpuBig); refreshDict(); S.bigOpen = true; render(); }
  else if(a==="pickdict"){ S.bigOpen = true; const f = document.getElementById("dictfile"); if(f){ f.value = ""; f.click(); } }
  else if(a==="delbig"){ if(confirm("読み込んだ辞書を消すよ。いい？")){ S.big = null; store.del("bigdict"); refreshDict(); render(); } }
  else if(a==="copywords"){
    const txt = S.userWords.join(" ");
    (navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(txt) : Promise.reject()).then(()=>{ el.textContent="コピーしたよ"; }).catch(()=>{ prompt("コピーして使ってね", txt); });
  }
});

$app.addEventListener("change", async e => {
  if(e.target.id !== "dictfile" || !e.target.files || !e.target.files[0]) return;
  const f = e.target.files[0], common = S.bigMode === "common"; S.bigOpen = true;
  const say = t => { const el = document.getElementById("dictstatus"); if(el) el.textContent = t; };
  say("読み込み中…（そのままお待ちください）");
  try{
    const r = await importJMdict(f, common, (n, k) => say(`読み込み中… ${n.toLocaleString()}件を見たよ（${k.toLocaleString()}語）`));
    if(r.words.length < 50) throw new Error("取り出せた言葉が少なすぎるよ。ファイルを確認してね");
    const big = {mode: common ? "common" : "all", w: r.words};
    if(!store.set("bigdict", big)) throw new Error("端末に保存できなかったよ（容量オーバー）。「よく使う言葉だけ」で試してね");
    S.big = big; refreshDict();
    render();
    const el = document.getElementById("dictstatus"); if(el) el.textContent = `読み込めたよ！ ${r.words.length.toLocaleString()}語（${r.entries.toLocaleString()}件から）`;
  }catch(err){ say("うまく読み込めなかったよ：" + (err && err.message ? err.message : err)); }
});

// ---- ドラッグ＆ドロップ（指でもマウスでも）
let DRAG = null, lastOver = null, suppressUntil = 0;
// ゴーストは「指より少し上」に見えるので、見えているカードの中心を、落とす位置として使う
function hitPoint(e, d){ return {x:e.clientX, y:e.clientY - 0.2*d.h}; }
function overTarget(x, y){
  const el = document.elementFromPoint(x, y); if(!el) return null;
  let n;
  if((n = el.closest(".cell"))) return {type:"slot", i:Number(n.dataset.i), el:n, x, y};
  if((n = el.closest(".hand"))) return {type:"hand", el:n, x, y};
  if((n = el.closest(".dpile"))) return {type:"discard", el:n, x, y};
  return null;
}
// 手札の中で、落とした横位置にカードを差しこむ
function insertIntoHand(card, x, y){
  const tiles = Array.from(document.querySelectorAll('.hand .tile[data-from="hand"]'))
    .filter(el => Number(el.dataset.id) !== card.id);
  let anchor = null;
  if(tiles.length){
    let best = null, bd = Infinity;
    for(const el of tiles){
      const r = el.getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2;
      const dd = (x-cx)*(x-cx) + 2.5*(y-cy)*(y-cy);        // 同じ段のカードを優先
      if(dd < bd){ bd = dd; best = {el, cx}; }
    }
    const idx = tiles.indexOf(best.el);
    const target = x < best.cx ? tiles[idx] : (tiles[idx+1] || null);
    anchor = target ? Number(target.dataset.id) : null;
  }
  G.me.splice(G.me.indexOf(card), 1);
  const to = anchor === null ? -1 : G.me.findIndex(c=>c.id===anchor);
  if(to < 0) G.me.push(card); else G.me.splice(to, 0, card);
}
function dropTo(d, t){
  const card = G.me.find(c=>c.id===d.id); if(!card) return;
  const fromSlot = d.from === "slot", si = Number(d.i);
  if(t.type === "slot"){
    if(fromSlot){ if(si !== t.i){ const tmp = G.slots[si]; G.slots[si] = G.slots[t.i]; G.slots[t.i] = tmp; } }
    else { G.slots[t.i] = card; }            // 入れ替わった元のカードは手札にもどる
  } else if(t.type === "hand"){
    if(fromSlot) G.slots[si] = null;
    insertIntoHand(card, t.x, t.y);
  } else if(t.type === "discard"){
    if(G.mode !== "puzzle" && G.phase === "act") G.pendingDiscard = d.id;
  }
}

// ---- コード（SDPをbase64にして [HJ-O:…] / [HJ-A:…] で包む）
function b64e(str){
  const u = new TextEncoder().encode(str); let s = "";
  for(let i = 0; i < u.length; i++) s += String.fromCharCode(u[i]);
  return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function b64d(t){
  t = t.replace(/-/g, "+").replace(/_/g, "/"); while(t.length % 4) t += "=";
  const bin = atob(t), u = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(u);
}
function makeCode(kind, sdp){ return "[HJ-" + kind + ":" + b64e(sdp) + "]"; }
function parseCode(text, kind){
  // 「[」「]」が抜けていても読む。コードのあとに文章が続いていても、読める所までを使う
  const m = /HJ-([OA]):([A-Za-z0-9_\-\s]+)/.exec(text || "");
  if(!m) throw new Error("コードが見つからないよ。「HJ-」で始まるコードを まるごと貼ってね");
  if(m[1] !== kind) throw new Error(kind === "O" ? "これは「返事のコード」だよ。ホストから届いた「最初のコード」を貼ってね" : "これは「最初のコード」だよ。あいてから届いた「返事のコード」を貼ってね");
  const toks = m[2].trim().split(/\s+/);
  let sdp = "", sawBroken = false;
  for(let k = toks.length; k >= 1 && !sdp; k--){      // 後ろにくっついた文章を 1つずつ外してためす
    let t = ""; try{ t = b64d(toks.slice(0, k).join("")); }catch(e){}
    if(t.indexOf("v=0") === 0){ sawBroken = true; if(t.indexOf("a=candidate") > 0 && /\n$/.test(t)) sdp = t; }
  }
  if(!sdp){
    if(sawBroken) throw new Error("コードが途中で切れているみたい（" + m[2].replace(/\s+/g, "").length + "文字だけ届いたよ）。もう一度 まるごとコピーして送ってもらってね");
    throw new Error("コードが こわれているみたい。もう一度 まるごとコピーしてね");
  }
  return sdp;
}
function inviteText(kind, code){ return code; }   // コードだけを渡す（説明文は つけない）
function waitIce(pc, ms){
  return new Promise(res => {
    if(pc.iceGatheringState === "complete") return res();
    let t = null;
    const done = () => { pc.removeEventListener("icegatheringstatechange", chk); clearTimeout(t); res(); };
    const chk = () => { if(pc.iceGatheringState === "complete") done(); };
    pc.addEventListener("icegatheringstatechange", chk);
    t = setTimeout(done, ms);
  });
}

}

  dc.onmessage = ev => { if(NET !== me) return; let m = null; try{ m = JSON.parse(ev.data); }catch(e){ return; } onNetMsg(m); };

}
function sendMsg(m){ try{ if(NET && NET.dc && NET.dc.readyState === "open") NET.dc.send(JSON.stringify(m)); }catch(e){} }

// ---- 番号でつなぐ（PeerJSの無料の仲介サーバー経由。ゲームの中身はスマホどうしで直接やり取り）
const PEER_PREFIX = "hrgj-", PEER_URLS = ["https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js", "https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"];
let peerLoading = null;
function loadPeerJS(){
  if(window.Peer) return Promise.resolve();
  if(peerLoading) return peerLoading;
  const one = u => new Promise((res, rej) => {
    const s = document.createElement("script"); s.src = u; s.onload = res; s.onerror = () => rej(new Error("load")); document.head.appendChild(s);
    setTimeout(() => rej(new Error("timeout")), 10000);
  });
  peerLoading = (async () => {
    for(const u of PEER_URLS){ try{ await one(u); if(window.Peer) return; }catch(e){} }
    peerLoading = null; throw new Error("つなぐための部品を読み込めなかったよ（ネットにつながっているか確認してね）。うまくいかないときは「コードでつなぐ」を使ってね");
  })();
  return peerLoading;
}
// 番号の部屋を開く。使われている番号なら null
function openPeer(id){
  return new Promise((res, rej) => {
    let done = false;
    const peer = id ? new Peer(id, {config:ICE_CFG, debug:0}) : new Peer({config:ICE_CFG, debug:0});
    const t = setTimeout(() => { if(done) return; done = true; try{ peer.destroy(); }catch(e){} rej(new Error("仲介サーバーに届かなかったよ。時間をおくか、「コードでつなぐ」を使ってね")); }, 12000);
    peer.on("open", () => { if(done) return; done = true; clearTimeout(t); res(peer); });
    peer.on("error", er => {
      if(done) return; done = true; clearTimeout(t); try{ peer.destroy(); }catch(e){}
      if(er && er.type === "unavailable-id") res(null); else rej(new Error("仲介サーバーとの通信でエラーになったよ（" + ((er && er.type) || "不明") + "）。時間をおくか、「コードでつなぐ」を使ってね"));
    });
  });
}
function attachConn(me, conn){
  me.dc = {get readyState(){ return conn.open ? "open" : "closed"; }, send(s){ conn.send(s); }, close(){ try{ conn.close(); }catch(e){} }};
  const fire = () => { if(NET !== me || me.open) return; me.open = true; sendMsg({t:"hello", proto:PROTO}); onConnected(); };
  conn.on("open", fire); if(conn.open) fire();
  conn.on("data", d => {
    if(NET !== me) return; let m = d;
    if(typeof d === "string"){ try{ m = JSON.parse(d); }catch(e){ return; } }
    onNetMsg(m);
  });
  conn.on("close", () => { if(NET === me) netLost(); });
  conn.on("error", () => {});
}

// G.owner：いま番の人（"me"＝ホスト／"opp"＝ゲスト）。G.judge：判定待ちのあがり宣言。

const cardsOut = a => a.map(c => ({id:c.id, ch:c.ch}));
function guestView(msg, fx){
  return {t:"state", newGame:!!G.newGame, turn:(G.owner === "opp" ? "me" : "opp"), phase:phaseFor("opp"),
    me:cardsOut(G.cpu), opp:(G.showOpp ? cardsOut(G.me) : null), oppN:G.me.length,
    discard:cardsOut(G.discard), deckN:G.deck.length, last:G.last, pop:G.pop,
    newId:G.cpuNewId, oppNewId:G.newId, objLeft:{me:G.objLeft.opp, opp:G.objLeft.me},
    noDeclare:!!(G.noDeclare && G.owner === "opp"), showOpp:G.showOpp,
    judge:(G.judge && G.judge.who === "me") ? {who:"opp", words:G.judge.words, declared:G.judge.declared} : null,
    result:G.result ? {who:(G.result.who === "opp" ? "me" : "opp"), words:G.result.words, declared:G.result.declared} : null,
    msg:msg, fx:fx || []};
}
function playFx(list){ (list || []).forEach((n, i) => setTimeout(() => sfx(n), i * 220)); }
function onlineSync(mMe, mOpp, fxMe, fxOpp){
  G.phase = phaseFor("me"); G.msg = mMe;
  sendMsg(guestView(mOpp, fxOpp || fxMe));
  G.newGame = false;
  playFx(fxMe); render();
}
function startOnlineGame(){
  const deck = shuffle(buildDeck());
  const mine = deck.splice(0, 7), theirs = deck.splice(0, 7);
  G = { gid:(G ? G.gid : 0) + 1, mode:"online", role:"host", turn:0, deck, discard:[], me:mine, cpu:theirs, slots:Array(8).fill(null),
        phase:"idle", newId:null, cpuNewId:null, pop:null, msg:"", discardMode:false, confirm:null, result:null, last:null, prevOk:[false,false,false],
        owner:null, judge:null, noDeclare:false, showOpp:O.showOpp, objLeft:{me:OBJ_MAX, opp:OBJ_MAX}, newGame:true, askAgain:false, lost:null };
  S.screen = "play";
  const first = Math.random() < 0.5 ? "me" : "opp";
  onlineBegin(first, `じゃんけんで ${first === "me" ? "あなた" : "あいて"}が先攻！ `, `じゃんけんで ${first === "me" ? "あいて" : "あなた"}が先攻！ `, ["draw"]);
  window.scrollTo(0, 0);
}
// 番のはじめ：山札から1まい引く
function onlineBegin(who, preMe, preOpp, fx){
  const c = drawCard(), mine = who === "me";
  G.owner = who; G.noDeclare = false; G.discardMode = false; G.judge = null; G.pop = c.id;
  if(mine){ G.me.push(c); G.newId = c.id; G.cpuNewId = null; }
  else { G.cpu.push(c); G.cpuNewId = c.id; G.newId = null; }
  const drew = `山札から「${c.ch}」を引いたよ。言葉を作って あがるか、1まい すてよう`;
  onlineSync((preMe || "") + (mine ? drew : "あいての番… 1まい引いたよ。考え中…"),
             (preOpp || "") + (mine ? "あいての番… 1まい引いたよ。考え中…" : drew), fx || ["draw"]);
}
function hostDiscard(who, id){
  if(G.result || G.judge || G.owner !== who) return;
  const hand = who === "me" ? G.me : G.cpu, k = hand.findIndex(c => c.id === id);
  if(k < 0 || hand.length !== 8) return;
  const out = hand.splice(k, 1)[0];
  if(who === "me") G.slots = G.slots.map(c => (c && c.id === id) ? null : c);
  G.discard.push(out); G.last = out.id;
  const pOut = `「${out.ch}」をすてたよ。`, pIn = `あいては「${out.ch}」をすてたよ。`;
  onlineBegin(who === "me" ? "opp" : "me", who === "me" ? pOut : pIn, who === "me" ? pIn : pOut, ["discard", "draw"]);
}
function onlineDiscard(id){
  if(!G || G.phase !== "act") return;
  if(G.role === "host") return hostDiscard("me", id);
  sendMsg({t:"discard", id}); G.phase = "wait"; G.discardMode = false; render();
}
// あがり宣言（宣言する人の側から呼ぶ）
function declareDone(words, declared){
  if(G.mode !== "online") return finish("me", words, declared);
  if(G.role === "host"){
    G.judge = {who:"me", words, declared};
    onlineSync("あいてが 判定中… 待ってね", "あいてが あがりを宣言したよ。判定してね", ["ok"]);
  } else {
    sendMsg({t:"declare", words, declared, ids:G.slots.map(c => c.id)});
    G.phase = "judgewait"; setMsg("あいてが 判定中… 待ってね"); render();
  }
}
function hostGuestDeclare(m){
  if(G.result || G.judge || G.owner !== "opp" || G.noDeclare) return;
  const ws = Array.isArray(m.words) ? m.words.map(String) : [], ids = Array.isArray(m.ids) ? m.ids : [];
  if(ws.length !== 3 || ws[0].length !== 2 || ws[1].length !== 3 || ws[2].length !== 3 || ids.length !== 8 || new Set(ids).size !== 8) return;
  const chs = ids.map(id => { const c = G.cpu.find(x => x.id === id); return c ? c.ch : null; });
  if(chs.indexOf(null) >= 0 || chs.join("") !== ws.join("")) return;
  G.judge = {who:"opp", words:ws, declared:!!m.declared};
  onlineSync("あいてが あがりを宣言したよ。判定してね", "あいてが 判定中… 待ってね", ["ok"]);
}
// 判定する側のボタン
function onlineRespond(ans){
  if(!G || G.mode !== "online" || G.phase !== "judge") return;
  if(ans === "obj" && G.objLeft.me <= 0) return;
  if(G.role === "host") return hostResolve(ans);
  sendMsg({t:"resp", ans}); G.phase = "wait"; setMsg("返事を送ったよ…"); render();
}
function hostResolve(ans){
  const J = G.judge; if(!J) return;
  const resp = J.who === "me" ? "opp" : "me";
  if(ans === "obj"){
    if(G.objLeft[resp] <= 0) return;
    G.objLeft[resp]--; G.judge = null; G.noDeclare = true;
    const mDecl = "異議あり！で あがりは取り消しになったよ。1まい すてて 番を終えよう（このターンは もうあがれないよ）";
    const mResp = `「異議あり！」を出したよ（のこり${G.objLeft[resp]}回）。あいてのあがりは取り消し。あいての番が つづくよ`;
    onlineSync(J.who === "me" ? mDecl : mResp, J.who === "me" ? mResp : mDecl, ["obj"]);
  } else if(ans === "ok") onlineFinish(J.who, J.words, J.declared);
}
function onlineFinish(winner, words, declared){
  G.result = {who:winner, words, declared}; G.judge = null;
  S.owins[winner]++; store.set("owins", S.owins);
  adoptWords(words);
  const win = winner === "me";
  onlineSync(win ? "あがり！ あなたの勝ち！" : "あいてが あがったよ", win ? "あいてが あがったよ" : "あがり！ あなたの勝ち！", [win ? "win" : "lose"], [win ? "lose" : "win"]);
}
function onlineAgain(){
  if(!G || G.mode !== "online") return;
  if(G.role === "host") return startOnlineGame();
  if(G.askedAgain) return;
  sendMsg({t:"again"}); G.askedAgain = true; render();
}
// ---- ゲスト側：ホストから届いた状態を画面に反映
function guestFresh(){
  return { gid:(G ? G.gid : 0) + 1, mode:"online", role:"guest", turn:0, deck:[], discard:[], me:[], cpu:[], slots:Array(8).fill(null),
           phase:"wait", newId:null, cpuNewId:null, pop:null, msg:"", discardMode:false, confirm:null, result:null, last:null, prevOk:[false,false,false],
           owner:null, judge:null, noDeclare:false, showOpp:true, objLeft:{me:OBJ_MAX, opp:OBJ_MAX}, askedAgain:false, lost:null };
}
function onNetState(m){
  if(!G || G.mode !== "online" || G.role !== "guest" || m.newGame){ G = guestFresh(); takeWake(); }
  S.screen = "play";
  const ids = new Set(m.me.map(c => c.id));
  const keep = G.me.filter(c => ids.has(c.id)), have = new Set(keep.map(c => c.id));
  G.me = keep.concat(m.me.filter(c => !have.has(c.id)));                 // 並べた順は そのまま。新しいカードは右に
  G.slots = G.slots.map(c => (c && ids.has(c.id)) ? c : null);
  G.cpu = m.opp ? m.opp : Array.from({length:m.oppN}, (_, i) => ({id:-1 - i, ch:"・"}));
  G.discard = m.discard; G.deck = new Array(m.deckN).fill(0);
  G.last = m.last; G.pop = m.pop; G.newId = m.newId; G.cpuNewId = m.oppNewId;
  G.owner = m.turn; G.phase = m.phase; G.judge = m.judge; G.objLeft = m.objLeft; G.noDeclare = m.noDeclare; G.showOpp = m.showOpp; G.msg = m.msg;
  if(G.phase !== "act"){ G.confirm = null; G.discardMode = false; }
  if(m.result && !G.result){ G.result = m.result; S.owins[m.result.who]++; store.set("owins", S.owins); adoptWords(m.result.words); }
  playFx(m.fx); render();
}
function onNetMsg(m){
  if(!NET || !m || typeof m.t !== "string") return;
  if(m.t === "hello"){ if(m.proto !== PROTO) netLost("アプリの版が あいてと ちがうよ。ページを再読み込みしてね"); return; }
  if(m.t === "state"){ if(NET.role === "guest") onNetState(m); return; }
  if(NET.role !== "host" || !G || G.mode !== "online") return;
  if(m.t === "discard") hostDiscard("opp", Number(m.id));
  else if(m.t === "declare") hostGuestDeclare(m);
  else if(m.t === "resp"){ if(G.judge && G.judge.who === "me" && (m.ans === "ok" || m.ans === "obj")) hostResolve(m.ans); }
  else if(m.t === "again"){ G.askAgain = true; render(); }
}

// ---- 画面：オンライン対戦のつなぎかた

        ・つなぐための部品（PeerJS）を、最初にネットから読み込むよ。<br>
        ・同じ番号を知っている人なら入れてしまうので、あいて以外には番号を教えないでね。部屋は、最初に入った1人だけが使えるよ。<br>
        ・<b>同じWi-Fi</b>だと つながりやすいよ。離れていると、回線によっては つながらないことがあるよ（要確認）。<br>
        ・対戦中は画面を消さないでね。つながりが切れたら、はじめからやり直し。通信の道すじ調べに、Googleの無料の公開サーバー（STUN）も使うよ。</p></details>
      <details class="panel"><summary>うまくいかないとき：コードでつなぐ</summary>
        <p class="small">仲介サーバーが使えないときのための方法だよ。コード（長い文字のならび）を、LINEやメールで交換してつなぐよ。</p>
        <div class="two"><button data-act="o-mhost">部屋を作る<br><span class="small">コードを作って送る人</span></button><button data-act="o-mjoin">部屋に入る<br><span class="small">届いたコードを貼る人</span></button></div>
        <ol class="small" style="padding-left:1.2em">
          <li><b>ホスト</b>：コードを作って、あいてに送る（コードだけを まるごと）</li>
          <li><b>ゲスト</b>：届いたコードを貼って「つなぐ準備」→ 出てきた<b>返事のコード</b>をホストに送る</li>
          <li><b>ホスト</b>：返事のコードを貼って「つなぐ」→ 自動で はじまるよ</li>
        </ol>
        <p class="small">コードを交換してから つながるまで、2〜3分以内がおすすめ。途中でページを閉じると やり直しだよ。</p></details>
      <details class="panel"><summary>オンライン対戦のルール</summary>
        <ol class="small" style="padding-left:1.2em">
          <li>番が来たら 山札から1まい引いて、<b>あがる</b>か<b>1まい すてる</b>（CPU戦と同じ）。</li>

          <li>辞書にある言葉でも 異議あり！は出せるよ（おかしな言葉が辞書に混ざっていることがあるため）。</li>
          <li>あいてが番のあいだも、自分のカードを並べて考えておけるよ。</li>
        </ol></details>`;
  } else if(st === "room-gen"){

    body = `<div class="panel" style="text-align:center"><h2>あいてに この番号を伝えてね</h2>
        <div style="font-size:3.2rem;font-weight:800;letter-spacing:.18em;margin:6px 0 2px;font-family:'Hiragino Mincho ProN','Yu Mincho',serif">${esc(O.room)}</div>
        <p class="small" style="margin:0">あいてが「部屋に入る」で この番号を入れると、自動ではじまるよ。<br>このページは 閉じないでね。</p></div>
      <div class="panel"><h2>あいての手札</h2>
        <div class="seg"><button data-act="o-showopp" data-v="1" class="${O.showOpp ? "on" : ""}">見える（原作どおり）</button><button data-act="o-showopp" data-v="0" class="${!O.showOpp ? "on" : ""}">かくす</button></div></div>`;
  } else if(st === "room-in"){

        <input id="o-num" class="codebox" style="min-height:0;font-size:2rem;text-align:center;letter-spacing:.3em" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" value="${esc(O.input)}" placeholder="0000">
        <button class="big" style="margin-top:8px" data-act="o-roomgo">つなぐ</button></div>`;
  } else if(st === "room-join"){
    body = `<div class="panel"><p style="margin:0">部屋を さがして つないでいるよ…（20秒ほど待ってね）</p></div>`;
  } else if(st === "host-gen"){
    body = `<div class="panel"><p style="margin:0">コードを作っているよ…（数秒かかるよ）</p></div>`;

      <div class="panel"><h2>あいての手札</h2>
        <div class="seg"><button data-act="o-showopp" data-v="1" class="${O.showOpp ? "on" : ""}">見える（原作どおり）</button><button data-act="o-showopp" data-v="0" class="${!O.showOpp ? "on" : ""}">かくす</button></div></div>
      <p class="small">このページは 閉じないでね。返事のコードを貼って「つなぐ」を押すと はじまるよ。</p>`;
  } else if(st === "guest-in"){
    body = `<div class="panel"><h2>ホストから届いたコードを貼る</h2>${inBox("ホストのコードを ここに貼る")}
        <div class="two"><button data-act="o-paste">📥 貼り付け</button><button class="pri" data-act="o-guestgo">つなぐ準備</button></div></div>`;
  } else if(st === "guest-gen"){
    body = `<div class="panel"><p style="margin:0">返事のコードを作っているよ…（数秒かかるよ）</p></div>`;
  } else if(st === "guest-wait"){
    body = `<div class="panel"><h2>この返事のコードを ホストに送る</h2>${codeBox}${sendBtns}</div>
      <p class="small">ホストがコードを貼って「つなぐ」を押すと、自動で はじまるよ。このページは 閉じないでね。</p>`;
  } else if(st === "connecting"){
    body = `<div class="panel"><p style="margin:0">つないでいるよ…（20秒ほど待ってね）</p></div>`;
  } else if(st === "ready"){
    body = `<div class="panel"><p style="margin:0"><b>つながったよ！</b> ホストが ゲームを はじめるのを待っているよ…</p></div>`;
  }
  $app.innerHTML = `<div class="title" style="padding-top:8px">
    <h1 style="font-size:1.4rem;margin:6px 0 10px">🌐 オンライン対戦（1対1）</h1>${err}${body}
    <button class="big alt" style="font-size:1rem;padding:11px;margin-top:6px" data-act="o-back">← タイトルにもどる</button></div>`;
}
function onlineAct(a, el){
  if(a === "online"){ netClose(); O = {step:"menu", err:"", code:"", codeText:"", input:"", showOpp:store.get("showopp", true)}; S.screen = "online"; render(); window.scrollTo(0, 0); return true; }
  if(a === "o-back"){ netClose(); S.screen = "title"; render(); window.scrollTo(0, 0); return true; }
  if(a === "o-host"){ hostRoom(); return true; }
  if(a === "o-join"){ netClose(); O.step = "room-in"; O.err = ""; O.input = ""; render(); return true; }
  if(a === "o-roomgo"){ joinRoom(); return true; }
  if(a === "o-mhost"){ hostStart(); return true; }
  if(a === "o-mjoin"){ netClose(); O.step = "guest-in"; O.err = ""; O.input = ""; render(); return true; }
  if(a === "o-showopp"){ O.showOpp = el.dataset.v === "1"; store.set("showopp", O.showOpp); render(); return true; }
  if(a === "o-copy"){ copyInvite(el); return true; }
  if(a === "o-share"){ shareInvite(); return true; }
  if(a === "o-paste"){ pasteIn(); return true; }
  if(a === "o-connect"){ hostAccept(); return true; }
  if(a === "o-guestgo"){ guestJoin(); return true; }
  if(a === "resp-ok"){ onlineRespond("ok"); return true; }
  if(a === "resp-obj"){ onlineRespond("obj"); return true; }
  if(G && G.mode === "online" && S.screen === "play"){
    if(a === "again"){ onlineAgain(); return true; }
    if(a === "title"){
      if(!G.result && !G.lost && NET && NET.open && !confirm("対戦をやめて もどるよ。いい？")) return true;
      G.gid++; netClose(); S.screen = "title"; render(); window.scrollTo(0, 0); return true;
    }
  }
  return false;
}
$app.addEventListener("input", e => { if(e.target && (e.target.id === "o-in" || e.target.id === "o-num")) O.input = e.target.value; });

// ---- 古い端末（aspect-ratio が使えない）向けの、高さの自前計算
function fixAspect(){
  document.querySelectorAll(".tile:not(.ghost), .cell").forEach(el => {
    if(el.classList.contains("tile") && el.closest(".cell")) return;
    el.style.height = ""; const w = el.offsetWidth;
    if(w) el.style.height = Math.round(w * 4 / 3) + "px";
  });
}
window.addEventListener("resize", () => { if(NOAR) fixAspect(); });

render();
</script>

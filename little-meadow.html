<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<title>ちいさな草原</title>
<style>
*{box-sizing:border-box}
:root{--sat:env(safe-area-inset-top)}
html,body{margin:0;height:100%;overflow:hidden;background:#1f2a1c;color:#f3f1e6;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#probe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#app{position:relative;display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:1100px;margin:0 auto;padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left)}
header{display:flex;justify-content:space-between;align-items:center;padding:calc(6px + var(--sat)) 12px 6px;gap:8px}
#clock{font-size:13px;line-height:1.35}
#clock b{font-weight:600;font-size:15px}
#clock .c2{display:block}
#clock .spd{color:#f2d470;font-weight:600}
.seg{display:flex;border:1px solid #5d6b55;border-radius:8px;overflow:hidden;flex-shrink:0;width:max-content}
button{font:inherit;color:inherit;background:transparent;border:0;cursor:pointer}
.seg button{padding:8px 14px;font-size:13px;border-left:1px solid #5d6b55}
.seg button:first-child{border-left:0}
.seg button.on{background:#dfe8c8;color:#22301d}
#pgbtn{padding:8px 12px;border:1px solid #5d6b55;border-radius:8px;font-size:12.5px;white-space:nowrap;flex-shrink:0}
#main{flex:1;min-height:0;display:flex;flex-direction:column}
#view{flex:1;min-height:0;min-width:0;position:relative;margin:0 12px;border-radius:10px;overflow:hidden;background:#4a6b3a}
#sc{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none;display:block}
#stage{position:absolute;top:8px;right:8px;z-index:2;border-radius:6px;border:1.5px solid rgba(255,255,255,.8);overflow:hidden;opacity:.95;cursor:pointer}
#stage.inside{position:static;margin:0 auto 6px;flex:none;opacity:1}
#cv{display:block;width:100%;height:100%}
#toast{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 110px);background:rgba(31,42,28,.9);padding:6px 12px;border-radius:16px;font-size:13px;text-align:center;opacity:0;transition:opacity .5s;cursor:pointer;z-index:3}
#peek{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);width:max-content;max-width:88%;background:rgba(31,42,28,.92);padding:7px 14px;border-radius:12px;font-size:13px;line-height:1.5;text-align:center;opacity:0;transition:opacity .4s;pointer-events:none;z-index:5}
#fs{position:absolute;right:10px;bottom:10px;z-index:4;width:38px;height:38px;border-radius:50%;background:rgba(31,42,28,.72);border:1px solid rgba(255,255,255,.45);display:flex;align-items:center;justify-content:center;color:#fff;padding:0}
#side{flex:none;padding:6px 12px max(10px,calc(env(safe-area-inset-bottom) - 8px))}
#panel{height:116px;cursor:pointer;overflow-x:hidden;overflow-y:auto;padding:2px 2px 0;font-size:13px;line-height:1.45}
#panel .nm{font-size:16px;font-weight:600}
#panel .sub{color:#b9c4a8}
#panel .ttl{color:#f2d470}
#panel .care{color:#ffb38a}
.go{text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;color:#e9f1d4;cursor:pointer}
.go.gone{opacity:.5}
.bar{display:inline-block;vertical-align:middle;width:90px;height:8px;border-radius:4px;background:#46553f;overflow:hidden;margin:0 6px}
.bar i{display:block;height:100%;background:#a9d06b}
#tools{display:flex;gap:8px;margin-top:6px}
#tools button{flex:1;padding:9px 2px;border:1px solid #5d6b55;border-radius:8px;font-size:12.5px;white-space:nowrap}
#tools button.off{opacity:.45}
#tools button.on{background:#dfe8c8;color:#22301d}
#modal{position:absolute;inset:0;background:rgba(15,22,13,.78);display:none;align-items:center;justify-content:center;padding:20px;z-index:7}
#modal .box{background:#2b3826;border-radius:12px;padding:16px 16px 14px;max-width:420px;width:100%;max-height:86%;overflow:auto;font-size:14px;line-height:1.7}
#modal h2{margin:0 0 6px;font-size:18px;font-weight:600}
#modal ul{margin:8px 0;padding-left:1.2em}
#modal .ok{margin-top:10px;width:100%;padding:11px;border-radius:8px;background:#dfe8c8;color:#22301d;font-size:15px}
.row{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 4px;border-top:1px solid #3b4a35;font-size:13px}
.row .chip{width:18px;height:18px;border-radius:50%;flex:none;border:3px solid #000}
.row .rn{font-size:15px;font-weight:600;min-width:4.2em}
.row .rs{color:#b9c4a8;flex:1}
#page{position:absolute;inset:0;z-index:6;background:#222d1f;display:none;flex-direction:column;padding:var(--sat) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#page .ph{display:flex;align-items:center;gap:8px;padding:8px 12px 8px}
#page .ph h2{flex:1;margin:0;font-size:17px;font-weight:600}
#pclose,.sb,.fitr button{padding:7px 14px;border:1px solid #5d6b55;border-radius:8px;font-size:13px}
#tabs{display:flex;margin:0 12px;border:1px solid #5d6b55;border-radius:8px;overflow:hidden;flex:none}
#tabs button{flex:1;padding:9px 2px;font-size:13px;border-left:1px solid #5d6b55}
#tabs button:first-child{border-left:0}
#tabs button.on{background:#dfe8c8;color:#22301d}
#pbody{flex:1;min-height:0;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px 20px;font-size:13.5px;line-height:1.6;touch-action:pan-y}
#pbody h3{font-size:14px;margin:18px 0 4px;font-weight:600}
.note{color:#b9c4a8;font-size:12px;margin-top:8px;line-height:1.55}
#bigmap{display:block;margin:0 auto;border-radius:8px}
.tog{padding:7px 12px;border:1px solid #5d6b55;border-radius:16px;font-size:13px}
.tog.on{background:#dfe8c8;color:#22301d}
.dh{margin:12px 0 2px;font-weight:600;color:#f2d470;font-size:13px}
.ev{display:flex;gap:8px;width:100%;text-align:left;padding:7px 2px;border-top:1px solid #3b4a35;font-size:13.5px;line-height:1.45;align-items:baseline}
.ev .et{color:#b9c4a8;font-size:12px;flex:none;width:3.2em}
.ev .ex{flex:1}
.ev .ar{color:#b9c4a8}
.ev.gone{opacity:.5;cursor:default}
.ev.plain{cursor:default}
.cmp{display:flex;flex-direction:column;gap:10px;align-items:center}
.cmp.wide{flex-direction:row;justify-content:center;align-items:flex-start;gap:12px}
.cmp canvas{display:block;border-radius:8px}
.cap{font-size:12.5px;margin-bottom:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.big{font-size:22px;font-weight:600;margin-bottom:6px}
table.st{border-collapse:collapse;width:100%;max-width:520px}
.st td{padding:4px 6px 4px 0;border-top:1px solid #3b4a35;vertical-align:top}
.st td:first-child{color:#b9c4a8;white-space:nowrap;width:9.5em}
table.dy{border-collapse:collapse}
.dy td,.dy th{padding:3px 12px 3px 0;text-align:right;font-weight:400;font-size:12.5px;border-top:1px solid #3b4a35}
.dy th{color:#b9c4a8;border-top:0}
.fitr{display:flex;align-items:center;gap:8px;margin:6px 0;flex-wrap:wrap}
.fitr span{min-width:2em;text-align:center}
#app.land #main{flex-direction:row}
#app.land #view{margin:calc(6px + var(--sat)) 0 calc(6px + env(safe-area-inset-bottom)) 12px}
#app.land #side{width:236px;display:flex;flex-direction:column;padding:calc(5px + var(--sat)) 12px calc(6px + env(safe-area-inset-bottom))}
#app.land header{padding:0 0 5px}
#app.land #clock{font-size:12px}
#app.land #clock b{font-size:13px}
#app.land #clock .c2{display:inline;margin-left:6px}
#app.land #clock .lg{display:none}
#app.land #pgbtn{padding:5px 7px;font-size:11.5px}
#app.land #panel{flex:1;height:auto;min-height:0;font-size:12.5px;line-height:1.42}
#app.land #panel .nm{font-size:15px}
#app.land .bar{width:60px}
#app.land #tools{gap:5px;margin-top:4px}
#app.land #tools button{padding:8px 0;font-size:11.5px}
#app.full{max-width:none;padding:0}
#app.full header,#app.full #side{display:none}
#app.full #view{margin:0;border-radius:0}
#app.full #stage{top:calc(8px + var(--sat));right:calc(8px + env(safe-area-inset-right))}
#app.full #fs{right:calc(10px + env(safe-area-inset-right));bottom:calc(10px + env(safe-area-inset-bottom))}
#app.full #toast{bottom:calc(10px + env(safe-area-inset-bottom))}
#app.full #peek{bottom:calc(78px + env(safe-area-inset-bottom))}
</style>
</head>
<body>
<div id="probe"></div>
<div id="app">
<header id="hdr">
<div id="clock"></div>
<button id="pgbtn">草原のページ</button>
</header>
<div id="main">
<div id="view">
<canvas id="sc"></canvas>
<div id="stage"><canvas id="cv"></canvas></div>
<div id="peek"></div>
<div id="toast"></div>
<button id="fs" aria-label="全画面の切り替え"></button>
</div>
<div id="side">
<div id="panel"></div>
<div id="tools">
<button id="roster">みんな</button>
<button id="bell">鈴をつける</button>
<button id="sow">種をまく</button>
</div>
</div>
</div>
<div id="page">
<div class="ph"><h2>草原のページ</h2><button id="pclose">とじる</button></div>
<div id="tabs"><button data-t="map">地図</button><button data-t="log">できごと</button><button data-t="cmp">くらべる</button><button data-t="sum">まとめ</button></div>
<div id="pbody"></div>
</div>
<div id="modal"><div class="box" id="mbox"></div></div>
</div>
<script>
//SIM-START
var COLS=60,ROWS=40,CELL=10,W=COLS*CELL,H=ROWS*CELL,N=COLS*ROWS;
var DAY=86400,LIFE=3*DAY,MATURE=12*3600,COOLDOWN=5*3600,MAXPOP=50;
var GROW=0.0003,SPREAD=0.00012,BITE=0.02,GAIN=0.4,FLOOR=0.22,RICH=0.5,DRY=0.72;
var SYL='モコピルタンポナミクトリハユキソラマロチ'.split('');
var WOOLS=[[45,25,93],[42,45,86],[220,6,72],[28,35,52],[260,8,36],[345,55,86],[150,35,82],[265,40,84],[52,70,80],[200,45,84]];
var S=null;
var hooks={event:function(){},tick:function(){}};

function rnd(a,b){return a+Math.random()*(b-a)}
function clamp(v,a,b){return v<a?a:v>b?b:v}
function pick(n){return Math.floor(Math.random()*n)}
function dist(a,b){var dx=a.x-b.x,dy=a.y-b.y;return Math.sqrt(dx*dx+dy*dy)}
function makeName(){
  var n,i,len,taken;
  do{
    len=Math.random()<0.6?2:3;n='';
    for(i=0;i<len;i++)n+=SYL[pick(SYL.length)];
    taken=S.cr.some(function(c){return c.name===n});
  }while(n[0]==='ン'||taken);
  return n;
}
function randWool(){var w=WOOLS[Math.random()<0.65?pick(5):5+pick(5)];return{wh:w[0],ws:w[1],wl:clamp(w[2]+rnd(-4,4),25,95)}}
function randLook(){
  var w=randWool(),r=Math.random(),r2=Math.random();
  return{wh:w.wh,ws:w.ws,wl:w.wl,fc:pick(5),pat:r<0.55?0:r<0.8?1:2,horn:r2<0.5?0:r2<0.8?1:2,ear:pick(3),size:rnd(0.88,1.12)};
}
function mixLook(a,b){
  var p=Math.random()<0.5?a:b,q=p===a?b:a,w;
  var L={wh:p.wh,ws:p.ws,wl:p.wl};
  if(Math.random()<0.3){L.ws=(a.ws+b.ws)/2;L.wl=(a.wl+b.wl)/2}
  if(Math.random()<0.05){w=randWool();L.wh=w.wh;L.ws=w.ws;L.wl=w.wl}
  L.wl=clamp(L.wl+rnd(-3,3),25,95);
  function g(k,n,m){return Math.random()<m?pick(n):(Math.random()<0.5?a:b)[k]}
  L.fc=g('fc',5,0.05);L.pat=g('pat',3,0.08);L.horn=g('horn',3,0.06);L.ear=g('ear',3,0.06);
  L.size=clamp((a.size+b.size)/2+rnd(-0.05,0.05),0.8,1.2);
  return L;
}
function mkCreature(x,y,t,L){
  var c={id:S.nid++,name:makeName(),x:x,y:y,h:rnd(0,6.28),age:0,life:LIFE*rnd(0.8,1.2),e:45,
    sp:t.sp,vis:t.vis,lazy:t.lazy,hung:t.hung,
    wh:L.wh,ws:L.ws,wl:L.wl,fc:L.fc,pat:L.pat,horn:L.horn,ear:L.ear,size:L.size,
    st:'rest',tx:x,ty:y,timer:rnd(5,40),cd:0,kids:0,pa:'',pb:'',ma:-1,mb:-1,tid:-1,b:{},bf:-1,poo:0,bell:false,kl:[],dead:false};
  S.cr.push(c);return c;
}
function randTraits(){return{sp:rnd(4.5,7.5),vis:rnd(3,6),lazy:Math.random(),hung:rnd(48,62)}}
function mixTraits(a,b){
  function m(k,lo,hi,d){return clamp((a[k]+b[k])/2+rnd(-d,d),lo,hi)}
  return{sp:m('sp',3.5,8.5,0.45),vis:m('vis',2.5,7,0.4),lazy:m('lazy',0,1,0.12),hung:m('hung',44,66,2)};
}
function newHist(t){return{from:t,born:0,gone:0,imm:0,dr:0,peak:0,day:Math.floor(t/DAY)+1,db:0,dx:0,days:[],log:[]}}
function hlog(o){var h=S.hist;o.t=Math.round(S.t);h.log.push(o);if(h.log.length>400)h.log.shift()}
function newDrought(t){return{next:t+rnd(2.5,5)*DAY,until:0,warned:false}}
function newWorld(){
  var now=new Date(),i,x,y,c;
  S={t:now.getHours()*3600+now.getMinutes()*60+now.getSeconds(),gacc:0,imm:0,nid:1,
     g:new Float32Array(N),f:new Float32Array(N),cl:new Float32Array(N),cln:0,cr:[],gavg:0.6,poo:[],fl:[],dr:null};
  S.dr=newDrought(S.t);S.hist=newHist(S.t);
  var p1=rnd(0,6),p2=rnd(0,6),p3=rnd(0,6);
  for(y=0;y<ROWS;y++)for(x=0;x<COLS;x++){
    S.g[y*COLS+x]=clamp(0.62+0.25*Math.sin(x*0.31+p1)+0.25*Math.sin(y*0.23+p2)+0.15*Math.sin((x+y)*0.17+p3)+rnd(-0.06,0.06),0.15,1);
  }
  for(i=0;i<12;i++){
    c=mkCreature(rnd(60,W-60),rnd(40,H-40),randTraits(),randLook());
    c.age=rnd(0,0.4)*c.life;c.e=rnd(60,95);
  }
}
function darkness(t){
  var h=(t%DAY)/3600;
  if(h<4.5||h>=19.5)return 1;
  if(h<6)return 1-(h-4.5)/1.5;
  if(h>=18)return (h-18)/1.5;
  return 0;
}
function cellOf(c){
  var cx=clamp(Math.floor(c.x/CELL),0,COLS-1),cy=clamp(Math.floor(c.y/CELL),0,ROWS-1);
  return cy*COLS+cx;
}
function fertAt(px,py,a,b){
  var cx=clamp(Math.floor(px/CELL),0,COLS-1),cy=clamp(Math.floor(py/CELL),0,ROWS-1),x,y,i;
  for(y=cy-1;y<=cy+1;y++)for(x=cx-1;x<=cx+1;x++){
    if(x<0||y<0||x>=COLS||y>=ROWS)continue;
    i=y*COLS+x;S.f[i]=Math.min(1.5,S.f[i]+(x===cx&&y===cy?a:b));
  }
}
function growGrass(dt){
  var dry=S.dr.until>0?DRY:1;
  var g=S.g,f=S.f,cl=S.cl,cn=0,r=GROW*dt*dry,sp=SPREAD*dt*dry,dec=1-dt/20000,i=0,x,y,v,na,sum=0;
  for(y=0;y<ROWS;y++)for(x=0;x<COLS;x++,i++){
    v=g[i];
    na=((x>0?g[i-1]:v)+(x<COLS-1?g[i+1]:v)+(y>0?g[i-COLS]:v)+(y<ROWS-1?g[i+COLS]:v))/4;
    v+=(r*Math.max(v,0.02)*(1-v)+sp*na*(1-v))*(1+2*f[i]);
    g[i]=v>1?1:v;sum+=g[i];
    f[i]*=dec;
    if(cl[i]>0){cl[i]-=dt/43200;if(cl[i]<0.02)cl[i]=0;else cn++}
  }
  S.gavg=sum/N;S.cln=cn;
}
function bondOf(a,b){return a.b[b.id]||0}
function addBond(a,b,v){
  a.b[b.id]=Math.min(1,(a.b[b.id]||0)+v);b.b[a.id]=Math.min(1,(b.b[a.id]||0)+v);
}
function tickBonds(dt){
  var cr=S.cr,n=cr.length,i,j,c,o,k,v,alive={},best,bv,dec=1-dt/200000,gain=0.0006*dt/30;
  for(i=0;i<n;i++)alive[cr[i].id]=1;
  for(i=0;i<n;i++){
    c=cr[i];
    for(j=i+1;j<n;j++){
      o=cr[j];
      if(Math.abs(c.x-o.x)<25&&Math.abs(c.y-o.y)<25&&dist(c,o)<25)
        addBond(c,o,gain*((c.st==='groom'&&c.tid===o.id)||(o.st==='groom'&&o.tid===c.id)?4:1));
    }
  }
  for(i=0;i<n;i++){
    c=cr[i];best=-1;bv=0.2;
    for(k in c.b){
      if(!alive[k]){delete c.b[k];continue}
      v=c.b[k]*dec;
      if(v<0.02){delete c.b[k];continue}
      c.b[k]=v;if(v>bv){bv=v;best=+k}
    }
    c.bf=best;
  }
}
function eligible(c){
  return !c.dead&&c.age>=MATURE&&c.age<c.life*0.9&&c.e>70&&c.cd<=0&&c.st!=='sleep'&&S.gavg>RICH&&S.cr.length<MAXPOP;
}
function findMate(c){
  var best=null,bs=1e9,range=c.vis*CELL*2.5,i,o,d,s;
  for(i=0;i<S.cr.length;i++){
    o=S.cr[i];if(o===c||!eligible(o))continue;
    d=dist(c,o);if(d>range)continue;
    s=d-80*bondOf(c,o);
    if(s<bs){bs=s;best=o}
  }
  return best;
}
function byId(id){if(id<0||id==null)return null;for(var i=0;i<S.cr.length;i++)if(S.cr[i].id===id)return S.cr[i];return null}
function parentOf(c){
  if(c.age>=MATURE)return null;
  var p=byId(c.ma)||byId(c.mb);
  return p&&Math.random()<1-0.6*c.age/MATURE?p:null;
}
function seekFood(c,treat){
  var q=parentOf(c);if(!q||dist(c,q)<22)q=c;
  var cx=clamp(Math.floor(q.x/CELL),0,COLS-1),cy=clamp(Math.floor(q.y/CELL),0,ROWS-1);
  var R=Math.round(c.vis)+(treat?10:0),best=-1,bs=-9,x,y,gv,s,cl;
  for(y=Math.max(0,cy-R);y<=Math.min(ROWS-1,cy+R);y++)for(x=Math.max(0,cx-R);x<=Math.min(COLS-1,cx+R);x++){
    gv=S.g[y*COLS+x];cl=S.cl[y*COLS+x];
    if(treat?(cl<0.2||gv<FLOOR+0.06):(gv<0.38&&(cl<0.2||gv<FLOOR+0.06)))continue;
    s=gv+0.6*cl-0.05*Math.sqrt((x-cx)*(x-cx)+(y-cy)*(y-cy))+((x*7+y*13+c.id)%5)*0.01;
    if(s>bs){bs=s;best=y*COLS+x}
  }
  if(best<0)return false;
  c.tx=(best%COLS)*CELL+CELL/2+rnd(-3,3);c.ty=Math.floor(best/COLS)*CELL+CELL/2+rnd(-3,3);
  c.st='seek';c.tr=treat?1:0;return true;
}
function roam(c){
  var a=c.h+rnd(-0.7,0.7),d=rnd(90,170);
  var tx=c.x+Math.cos(a)*d,ty=c.y+Math.sin(a)*d;
  if(tx<8||tx>W-8||ty<8||ty>H-8){a=Math.atan2(H/2-c.y,W/2-c.x)+rnd(-0.8,0.8);tx=c.x+Math.cos(a)*d;ty=c.y+Math.sin(a)*d}
  c.tx=clamp(tx,6,W-6);c.ty=clamp(ty,6,H-6);c.st='roam';
}
function goNear(c,o,r){
  c.tx=clamp(o.x+rnd(-r,r),6,W-6);c.ty=clamp(o.y+rnd(-r,r),6,H-6);c.st='wander';
}
function wander(c,f){
  var o;
  if(f&&Math.random()<0.25+0.5*bondOf(c,f)){goNear(c,f,16);return}
  if(S.cr.length>1&&Math.random()<0.15){o=S.cr[pick(S.cr.length)];goNear(c,o,25);return}
  c.tx=clamp(c.x+rnd(-60,60),6,W-6);c.ty=clamp(c.y+rnd(-60,60),6,H-6);c.st='wander';
}
function decide(c,night){
  var hung=night?30:c.hung,o,f,par=null,juv=c.age<MATURE,d;
  if(juv){par=byId(c.ma)||byId(c.mb)}
  if(c.e<hung){
    if(par&&c.e>25&&dist(c,par)>32){c.st='follow';c.tid=par.id;return}
    if(S.g[cellOf(c)]>0.4){c.st='eat';return}
    if(seekFood(c))return;
    roam(c);return;
  }
  f=byId(c.bf);
  if(par&&Math.random()<1-0.6*c.age/MATURE){
    if(dist(c,par)>18){c.st='follow';c.tid=par.id;return}
    f=par;
  }
  if(night){
    if(f&&dist(c,f)>16&&Math.random()<0.7){goNear(c,f,8);return}
    c.st='sleep';return;
  }
  if(eligible(c)){o=findMate(c);if(o){c.st='court';c.tid=o.id;return}}
  if(S.cln>0&&c.e<88&&seekFood(c,true))return;
  if(f&&f.st!=='sleep'&&bondOf(c,f)>0.3&&Math.random()<0.6){
    d=dist(c,f);
    if(d<16){c.st='groom';c.tid=f.id;c.timer=rnd(60,180);c.h=Math.atan2(f.y-c.y,f.x-c.x);return}
    if(d<70&&Math.random()<0.5){goNear(c,f,8);return}
  }
  if(Math.random()<0.25+0.5*c.lazy){c.st='rest';c.timer=rnd(60,240)*(0.6+c.lazy)}
  else wander(c,f);
}
function mate(a,b){
  a.e-=20;b.e-=20;a.cd=COOLDOWN*rnd(0.8,1.2);b.cd=COOLDOWN*rnd(0.8,1.2);a.kids++;b.kids++;
  var ch=mkCreature((a.x+b.x)/2,(a.y+b.y)/2,mixTraits(a,b),mixLook(a,b));
  ch.pa=a.name;ch.pb=b.name;ch.ma=a.id;ch.mb=b.id;
  addBond(ch,a,1);addBond(ch,b,1);addBond(a,b,0.5);
  a.st='rest';a.timer=60;b.st='rest';b.timer=60;
  a.kl.push([ch.id,ch.name]);b.kl.push([ch.id,ch.name]);
  S.hist.born++;S.hist.db++;hlog({k:'b',n:ch.name,p:a.name+'・'+b.name,id:ch.id,pi:[a.id,b.id]});
  hooks.event('birth',{c:ch,a:a,b:b,x:ch.x,y:ch.y});
}
function die(c,why){
  c.dead=true;
  fertAt(c.x,c.y,1,0.5);
  var i=cellOf(c);if(S.g[i]<0.12)S.g[i]=0.12;
  var ad=Math.floor(c.age/DAY)+1;
  S.fl.push([Math.round(c.x),Math.round(c.y),Math.round(S.t),pick(4),c.name,ad,c.kids,c.bell?1:0,why==='age'?1:0,c.id]);
  S.hist.gone++;S.hist.dx++;hlog({k:'d',n:c.name,a:ad,w:why==='age'?1:0,kd:c.kids,bl:c.bell?1:0,id:c.id});
  hooks.event('death',{c:c,why:why,x:c.x,y:c.y});
}
function updateCreature(c,dt,night){
  if(c.dead)return;
  c.age+=dt;if(c.cd>0)c.cd-=dt;
  var juv=c.age<MATURE,old=c.age>c.life*0.8,st=c.st;
  var drain=st==='sleep'?0.001:(st==='rest'||st==='groom')?0.002:st==='eat'?0.003:0.004*(0.6+0.4*c.sp/6);
  if(juv)drain*=0.8;
  c.e-=drain*dt;
  if(c.e<=0){die(c,'starve');return}
  if(c.age>=c.life){die(c,'age');return}
  var o=null;
  if(S.cln>0&&c.e<90&&st!=='sleep'&&st!=='court'&&st!=='follow'&&st!=='groom'&&!(st==='seek'&&c.tr)){
    c.lk=(c.lk||rnd(30,60))-dt;
    if(c.lk<=0){c.lk=rnd(30,60);if(S.cl[cellOf(c)]<0.2&&seekFood(c,true))return}
  }
  if(st==='eat'){
    var i=cellOf(c),take=Math.min(Math.max(0,S.g[i]-FLOOR),BITE*dt);
    S.g[i]-=take;c.e=Math.min(100,c.e+take*GAIN*(S.cl[i]>0.05?1.5:1));
    if(S.cl[i]>0)S.cl[i]=Math.max(0,S.cl[i]-dt/900);
    c.poo+=take;
    if(c.poo>=25){
      c.poo=0;S.poo.push([Math.round(c.x+rnd(-3,3)),Math.round(c.y+rnd(-3,3)),Math.round(S.t)]);
      if(S.poo.length>220)S.poo.shift();
      fertAt(c.x,c.y,0.4,0.1);
    }
    if(c.e>=92)decide(c,night);
    else if(S.g[i]<FLOOR+0.03){if(!seekFood(c))roam(c)}
    return;
  }
  if(st==='rest'){c.timer-=dt;if(c.timer<=0||c.e<c.hung)decide(c,night);return}
  if(st==='groom'){
    c.timer-=dt;o=byId(c.tid);
    if(c.timer<=0||!o||dist(c,o)>20||c.e<c.hung)decide(c,night);
    return;
  }
  if(st==='sleep'){if(!night||c.e<28)decide(c,night);return}
  var tx=c.tx,ty=c.ty;
  if(st==='court'){
    o=byId(c.tid);
    if(!o||!eligible(o)||!eligible(c)){decide(c,night);return}
    tx=o.x;ty=o.y;
  }else if(st==='follow'){
    o=byId(c.tid);
    if(!o){decide(c,night);return}
    tx=o.x;ty=o.y;
  }
  var dx=tx-c.x,dy=ty-c.y,d=Math.sqrt(dx*dx+dy*dy);
  var v=c.sp*(c.e<20?0.55:1)*(old?0.7:1)*(juv?0.85:1),stp=v*dt;
  if(d>0.01)c.h=Math.atan2(dy,dx);
  if(st==='court'&&d<7+stp){mate(c,o);return}
  if(st==='follow'){
    if(d<10+stp){if(d>10){c.x+=dx/d*(d-9);c.y+=dy/d*(d-9)}decide(c,night);return}
    c.x+=dx/d*stp;c.y+=dy/d*stp;return;
  }
  if(d<=stp){
    c.x=tx;c.y=ty;
    if(st==='seek'){if(S.g[cellOf(c)]>FLOOR+0.05)c.st='eat';else decide(c,night)}
    else decide(c,night);
  }else{c.x+=dx/d*stp;c.y+=dy/d*stp}
}
function addImmigrant(){
  var side=pick(4),x,y;
  if(side===0){x=6;y=rnd(20,H-20)}else if(side===1){x=W-6;y=rnd(20,H-20)}
  else if(side===2){x=rnd(20,W-20);y=6}else{x=rnd(20,W-20);y=H-6}
  var c=mkCreature(x,y,randTraits(),randLook());
  c.age=rnd(0.2,0.35)*c.life;c.e=85;c.h=Math.atan2(H/2-y,W/2-x);
  S.hist.imm++;hlog({k:'i',n:c.name,id:c.id});
  hooks.event('immigrant',{c:c,x:x,y:y});
}
function tickDrought(){
  var D=S.dr;
  if(D.until>0){
    if(S.t>=D.until){D.until=0;D.next=S.t+rnd(3,6)*DAY;D.warned=false;hlog({k:'e'});hooks.event('droughtEnd',{})}
  }else{
    if(!D.warned&&S.t>=D.next-0.4*DAY){D.warned=true;hooks.event('droughtSoon',{})}
    if(S.t>=D.next){D.until=S.t+rnd(0.7,1)*DAY;S.hist.dr++;hlog({k:'s'});hooks.event('droughtStart',{})}
  }
}
function step(dt){
  S.t+=dt;S.gacc+=dt;
  if(S.gacc>=30){
    growGrass(S.gacc);tickBonds(S.gacc);tickDrought();S.imm-=S.gacc;S.gacc=0;
    while(S.poo.length&&S.t-S.poo[0][2]>9000)S.poo.shift();
    while(S.fl.length&&S.t-S.fl[0][2]>3*DAY)S.fl.shift();
    if(S.cr.length<=2&&S.imm<=0){addImmigrant();S.imm=1800}
    var hh=S.hist,hd=Math.floor(S.t/DAY)+1;
    if(S.cr.length>hh.peak)hh.peak=S.cr.length;
    if(hd!==hh.day){hh.days.push({d:hh.day,n:S.cr.length,g:Math.round(S.gavg*100),b:hh.db,x:hh.dx});if(hh.days.length>90)hh.days.shift();hh.day=hd;hh.db=0;hh.dx=0}
    hooks.tick();
  }
  var night=darkness(S.t)>0.6,i,dead=false;
  for(i=0;i<S.cr.length;i++){updateCreature(S.cr[i],dt,night);if(S.cr[i].dead)dead=true}
  if(dead)S.cr=S.cr.filter(function(c){return !c.dead});
}

  if(!c){toast('鈴をつけたい子を、先にタップしてください');return}
  c.bell=!c.bell;c.et=nowT();updateUI();save();
  toast(c.bell?c.name+' に鈴をつけました。遠くにいても見つけられます':c.name+' の鈴をはずしました');
};
elFs.onclick=function(){
  UI.full=!UI.full;saveUI();resize();
  try{if(UI.full&&!localStorage.getItem(KEY+'-hintfs')){localStorage.setItem(KEY+'-hintfs','1');toast('全画面にしました。右下の丸いボタンで戻ります')}}catch(e){}
};
function doReset(){
  newWorld();selId=null;memorial='';trail=[];fx=[];gusts=[];follow=true;select(S.cr[0].id);scx=S.cr[0].x;scy=S.cr[0].y;
  SNAPS=[];S.hist.sn=noonIdx(S.t);addSnap();save();closePage();toast('新しい草原がはじまりました');
}

function openPage(tab){
  if(busy)return;
  if(tab)pageTab=tab;
  pageOpen=true;elPage.style.display='flex';renderPage();
}
function closePage(){pageOpen=false;elPage.style.display='none';elPBody.innerHTML='';bigCv=null;resetArmed=0;last=performance.now()}
function renderPage(keep){
  var top=elPBody.scrollTop;
  Array.prototype.forEach.call(document.getElementById('tabs').children,function(b){b.className=b.getAttribute('data-t')===pageTab?'on':''});
  bigCv=null;
  if(pageTab==='map')renderMapTab();else if(pageTab==='log')renderLog();else if(pageTab==='cmp')renderCmp();else renderSum();
  elPBody.scrollTop=keep?top:0;
}
function sizeBig(){
  if(!bigCv)return;
  var bw=Math.floor(Math.min(elPBody.clientWidth-24,(elPBody.clientHeight-96)*W/H,960)),bh;
  bw=Math.max(bw,160);bh=Math.round(bw*H/W);
  bigCv.style.width=bw+'px';bigCv.style.height=bh+'px';
  bigCv.width=Math.floor(bw*dpr);bigCv.height=Math.floor(bh*dpr);bigScale=bw/W;
}
function drawBig(T){var k=mapK;ctx=bigCtx;mapK=clamp(0.42/bigScale,1,3);drawMap(T,bigCv,true);ctx=mctx;mapK=k}
function renderMapTab(){
  elPBody.innerHTML='<canvas id="bigmap"></canvas><div class="note">タップした所へ行きます。ひつじや花をタップすると、その子の所へ。<br>白いわく＝いま見ている所　金の輪＝鈴の子　うす紫の輪＝見守り中の子　白い点＝おいしい草</div>';
  bigCv=document.getElementById('bigmap');bigCtx=bigCv.getContext('2d');sizeBig();drawBig(nowT());
  bigCv.onclick=function(ev){
    if(busy)return;
    var p=toWorldOn(bigCv,ev),c=nearest(p,18/bigScale),i,f,bf=null,bd=14/bigScale,d;
    if(c){closePage();jumpTo(c);return}
    for(i=0;i<S.fl.length;i++){f=S.fl[i];d=Math.sqrt((f[0]-p[0])*(f[0]-p[0])+(f[1]-p[1])*(f[1]-p[1]));if(d<bd){bd=d;bf=f}}
    closePage();
    if(bf){goFlower(bf);return}
    follow=false;vx=vy=0;scx=clamp(p[0],0,W);scy=clamp(p[1],0,H);fx.push({k:'ping',x:scx,y:scy,t:nowT()});
  };
}
function evChild(e){
  var c=e.id!=null?byId(e.id):null,i;
  if(c||e.id!=null)return c;
  for(i=0;i<S.cr.length;i++){
    c=S.cr[i];if(c.name!==e.n)continue;
    if(e.k==='i'?(!c.pa&&S.t-c.age<e.t):Math.abs(S.t-c.age-e.t)<150)return c;
  }
  return null;
}
function evTarget(e){
  var c,f;
  if(e.k==='b'||e.k==='i'){c=evChild(e);if(c)return{c:c};f=flowerOf(e.id,e.n,null);return f?{f:f}:null}
  if(e.k==='d'){f=flowerOf(e.id,e.n,e.t);return f?{f:f}:null}
  return null;
}
function evBell(e){
  var c,names;
  if(e.k==='d')return !!e.bl;
  if(e.k!=='b'&&e.k!=='i')return false;
  c=evChild(e);if(c&&c.bell)return true;
  if(e.k!=='b')return false;
  if(e.pi)return e.pi.some(function(id){var p=byId(id);return !!(p&&p.bell)});
  names=e.p.split('・');
  return S.cr.some(function(q){return q.bell&&names.indexOf(q.name)>=0});
}
function logText(e){
  if(e.k==='b')return '✨ '+e.p.replace('・',' と ')+' に「'+e.n+'」が生まれた';
  if(e.k==='d')return '🌼 '+e.n+' が'+(e.w?'寿命で':'おなかをすかせて')+'旅立った（'+e.a+'日め'+(e.kd?'・子ども'+e.kd+'匹':'')+'）';
  if(e.k==='i')return '🚶 旅の者「'+e.n+'」がやってきた';
  if(e.k==='s')return '☀️ 日照りがはじまった';
  if(e.k==='e')return '🌧 雨がふって、日照りがおわった';
  return '';
}
function renderLog(){
  var L=S.hist.log,h='<button class="tog'+(bellOnly?' on':'')+'" id="bo">🔔 鈴の子だけ</button>',i,e,tg,n=0,lastD=-1,d,bl,plain;
  for(i=L.length-1;i>=0;i--){
    e=L[i];bl=evBell(e);
    if(bellOnly&&!bl)continue;
    d=dayOf(e.t);if(d!==lastD){lastD=d;h+='<div class="dh">'+d+'日め</div>'}
    plain=e.k==='s'||e.k==='e';tg=plain?null:evTarget(e);
    h+='<button class="ev'+(plain?' plain':tg?'':' gone')+'" data-i="'+i+'"><span class="et">'+hm(e.t)+'</span><span class="ex">'+logText(e)+(bl?' 🔔':'')+'</span>'+(tg?'<span class="ar">›</span>':'')+'</button>';
    n++;
  }
  if(!n)h+='<div class="note">'+(bellOnly?'鈴の子のできごとは、まだありません。鈴の子が生まれた・親になった・旅立った、が並びます。':'できごとは、まだありません。')+'</div>';
  else h+='<div class="note">行をタップすると、その子（旅立った子は花）の所へ行きます。うすい行は、その子も花も、もう草原にいないできごとです。新しい400件まで残ります。</div>';
  elPBody.innerHTML=h;
}
function snapLabel(sn){var d=dayOf(S.t)-dayOf(sn.t);return (d<=0?'きょう':d===1?'きのう':d+'日前')+'の'+(Math.abs(sn.t%DAY-DAY/2)<120?'昼':hm(sn.t))}
function drawSnap(cvs,sn){
  var d=img.data,i,g=cvs.getContext('2d'),k=cvs.width/W,px=cvs.width/dpr/W,v,dv=dryVis,r,c,f,fr=Math.max(2.6,3/px),mk=clamp(0.5/px,1,3);
  dryVis=sn.dry?1:0;
  for(i=0;i<N;i++){v=parseInt(sn.s.charAt(i),36)/35;grassColor(clamp(v*tex[i],0,1),i*4,d)}
  dryVis=dv;gctx.putImageData(img,0,0);
  g.setTransform(k,0,0,k,0,0);g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';g.drawImage(gc,0,0,W,H);
  for(i=0;i<sn.f.length;i++){f=sn.f[i];g.fillStyle=FLOWER[f[2]];ell(g,f[0],f[1],fr,fr);g.fillStyle='#f0b030';ell(g,f[0],f[1],fr*0.4,fr*0.4)}
  for(i=0;i<sn.c.length;i++){
    c=sn.c[i];r=5.4*mk*c[5]/10;
    g.fillStyle='rgba(20,30,10,.3)';ell(g,c[0]+0.8,c[1]+r*0.5,r*1.3,r*0.8);
    g.fillStyle='hsl('+c[2]+','+c[3]+'%,'+clamp(c[4]-28,8,97)+'%)';ell(g,c[0],c[1],r*1.25+0.9,r+0.9);
    g.fillStyle='hsl('+c[2]+','+c[3]+'%,'+c[4]+'%)';ell(g,c[0],c[1],r*1.25,r);
    if(c[6]){g.strokeStyle='#ffd23e';g.lineWidth=1.5*mk;g.beginPath();g.arc(c[0],c[1],r*2.1,0,6.2832);g.stroke()}
  }
}
function sizeCmp(cvs,cw){var ch=Math.round(cw*H/W);cvs.style.width=cw+'px';cvs.style.height=ch+'px';cvs.width=Math.floor(cw*dpr);cvs.height=Math.floor(ch*dpr)}
function snapCap(sn,head){return head+'　'+sn.n+'匹・草'+sn.ga+'%'+(sn.dry?'・日照り':'')}
function drawNow(){
  var B=document.getElementById('cmpB'),sn,o,g,i,d,aa,bb;if(!B)return;
  sn=mkSnap();drawSnap(B,sn);
  o=SNAPS[cmpSel];
  if(cmpDiff&&o){
    g=B.getContext('2d');
    for(i=0;i<N;i++){
      aa=parseInt(o.s.charAt(i),36)/35;bb=parseInt(sn.s.charAt(i),36)/35;d=bb-aa;
      if(d>0.2){g.fillStyle='rgba(90,235,255,'+Math.min(0.6,d)+')'}
      else if(d<-0.2){g.fillStyle='rgba(255,120,30,'+Math.min(0.6,-d)+')'}
      else continue;
      g.fillRect((i%COLS)*CELL,Math.floor(i/COLS)*CELL,CELL,CELL);
    }
  }
document.getElementById('capB').textContent=snapCap(sn,'いま（'+dayOf(S.t)+'日め '+hm(S.t)+'）');
}
function renderCmp(){
  var bw=elPBody.clientWidth-24,bh=elPBody.clientHeight,wide=bw>620,cw,i,h,sn,A;
  cw=Math.floor(wide?Math.min((bw-12)/2,Math.max(180,(bh-120)*W/H)):Math.min(bw,Math.max(170,(bh-150)/2*W/H)));
  if(cmpSel<0||cmpSel>=SNAPS.length){cmpSel=0;for(i=SNAPS.length-1;i>=0;i--)if(S.t-SNAPS[i].t>=DAY/2){cmpSel=i;break}}
  h='<div class="cmp'+(wide?' wide':'')+'"><div style="width:'+cw+'px"><div class="cap" id="capA"></div><canvas id="cmpA"></canvas></div><div style="width:'+cw+'px"><div class="cap" id="capB"></div><canvas id="cmpB"></canvas></div></div><div class="chips">';
  for(i=SNAPS.length-1;i>=0;i--)h+='<button class="tog'+(i===cmpSel?' on':'')+'" data-s="'+i+'">'+snapLabel(SNAPS[i])+'</button>';
  h+='</div><div class="chips"><button class="tog'+(cmpDiff?' on':'')+'" id="cdiff">草のちがいを色で見る</button><button class="tog" id="csnap">いまの草原を残す</button></div><div class="note">6時間ごとに1枚、草原のようすを残します（7日分まで。留守の間の分も残ります）。ボタンで、くらべる時をえらべます。「草のちがいを色で見る」は右の絵に色をつけます：水色＝草が増えた所、だいだい色＝草が減った所（食べられた・日照りなど）。</div>';
  elPBody.innerHTML=h;
  A=document.getElementById('cmpA');sizeCmp(A,cw);sizeCmp(document.getElementById('cmpB'),cw);
  sn=SNAPS[cmpSel];
  if(sn){drawSnap(A,sn);document.getElementById('capA').textContent=snapCap(sn,snapLabel(sn)+'（'+dayOf(sn.t)+'日め '+hm(sn.t)+'）')}
  drawNow();pageAcc=0;
}
function renderSum(){
  var hs=S.hist,cr=S.cr,juv=0,old=0,i,c,eld=null,kid=null,bells=[],h,d;
  function tr(a,b){return '<tr><td>'+a+'</td><td>'+b+'</td></tr>'}
  function dr(a,n,g,b,x){return '<tr><td>'+a+'</td><td>'+n+'匹</td><td>'+g+'%</td><td>'+(b?'+'+b:'−')+'</td><td>'+(x?x:'−')+'</td></tr>'}
  for(i=0;i<cr.length;i++){
    c=cr[i];if(c.age<MATURE)juv++;else if(c.age>c.life*0.8)old++;
    if(!eld||c.age>eld.age)eld=c;if(c.kids>0&&(!kid||c.kids>kid.kids))kid=c;if(c.bell)bells.push(nm(c.id,c.name));
  }
  h='<div class="big">'+dayOf(S.t)+'日め <span style="font-size:14px;font-weight:400">'+hm(S.t)+(S.dr.until>0?'　日照り中':'')+'</span></div><table class="st">'+
    tr('いま',cr.length+'匹（こども'+juv+'・おとな'+(cr.length-juv-old)+'・お年より'+old+'）')+
    tr('草の育ち',Math.round(S.gavg*100)+'%')+
    tr('生まれた',hs.born+'匹')+tr('旅立った',hs.gone+'匹')+tr('やってきた旅の者',hs.imm+'匹')+tr('日照り',hs.dr+'回')+
    tr('いちばん多かった時',Math.max(hs.peak,cr.length)+'匹')+
    (eld?tr('最年長',nm(eld.id,eld.name)+'（'+ageDays(eld)+'日め）'):'')+
    (kid?tr('子だくさん',nm(kid.id,kid.name)+'（'+kid.kids+'匹）'):'')+
    (bells.length?tr('鈴の子',bells.join('、')):'')+
    tr('数え始めた日',dayOf(hs.from)+'日め')+'</table>';
  h+='<h3>日ごとの記録</h3><table class="dy"><tr><th>日</th><th>ひつじ</th><th>草</th><th>生まれた</th><th>旅立った</th></tr>'+dr('きょう',cr.length,Math.round(S.gavg*100),hs.db,hs.dx);
  for(i=hs.days.length-1;i>=Math.max(0,hs.days.length-14);i--){d=hs.days[i];h+=dr(d.d+'日め',d.n,d.g,d.b,d.x)}
  h+='</table><div class="note">ひつじと草は、その日の終わりの数です。</div>';
  h+='<h3>時間の速さ</h3><div class="seg">'+[1,10,100,1000].map(function(v){return '<button data-v="'+v+'"'+(speed===v?' class="on"':'')+'>×'+v+'</button>'}).join('')+'</div><div class="note">ふだんは ×1（本物の時間と同じ）。早送り中は、時計の横に倍率が出ます。</div>';
  h+='<h3>画面の合わせ</h3><div class="note" style="margin-top:0">ホーム画面版で、上が時刻の帯に隠れる・下にすきまが出るときの調整です。</div>'+
    '<div class="fitr">上の余白<button data-f="at-">−</button><span>'+UI.at+'</span><button data-f="at+">＋</button></div>'+
    '<div class="fitr">下の長さ<button data-f="ah-">−</button><span>'+UI.ah+'</span><button data-f="ah+">＋</button></div>'+
    '<div class="fitr"><button data-f="fit">自動の補正：'+(UI.fit?'入':'切')+'</button><button data-f="rst">もどす</button></div><div class="note">'+fitInfo+'</div>';
  h+='<h3>新しい世界</h3><button class="sb" id="reset">いまの草原をおわりにして、新しく始める</button><div class="note">ひつじも記録も、すべて消えます。</div>';
  elPBody.innerHTML=h;
}
document.getElementById('pclose').onclick=closePage;
document.getElementById('tabs').onclick=function(ev){var t=ev.target.getAttribute('data-t');if(t){pageTab=t;renderPage()}};
elPBody.addEventListener('click',function(ev){
  var t=ev.target,b,e,tg,f;
  if(busy||!t.closest)return;
  if(t.classList.contains('go')){closePage();goName(+t.getAttribute('data-id'),t.getAttribute('data-n'));return}
  if(t.id==='bo'){bellOnly=!bellOnly;renderPage();return}
  if(t.id==='reset'){
    if(Date.now()-resetArmed<3500){doReset();return}
    resetArmed=Date.now();t.textContent='ほんとうに始めるなら、もう一度押す';
    setTimeout(function(){var r=document.getElementById('reset');if(r&&resetArmed&&Date.now()-resetArmed>=3400){r.textContent='いまの草原をおわりにして、新しく始める';resetArmed=0}},3500);
    return;
  }
  b=t.closest('.ev');
  if(b){
    e=S.hist.log[+b.getAttribute('data-i')];tg=e&&evTarget(e);if(!tg)return;
    closePage();if(tg.c)jumpTo(tg.c);else goFlower(tg.f);return;
  }
  if(t.id==='cdiff'){cmpDiff=!cmpDiff;renderPage(true);return}
  if(t.id==='csnap'){addSnap();cmpSel=SNAPS.length-1;renderPage(true);toast('いまの草原を残しました');return}
  b=t.closest('[data-s]');if(b){cmpSel=+b.getAttribute('data-s');renderPage(true);return}
  b=t.closest('[data-v]');if(b){speed=+b.getAttribute('data-v');renderPage(true);updateUI();return}
  b=t.closest('[data-f]');
  if(b){
    f=b.getAttribute('data-f');
    if(f==='at-')UI.at-=6;else if(f==='at+')UI.at+=6;else if(f==='ah-')UI.ah-=6;else if(f==='ah+')UI.ah+=6;
    else if(f==='fit')UI.fit=UI.fit?0:1;else{UI.at=0;UI.ah=0;UI.fit=1}
    saveUI();resize();renderPage(true);
  }
});

var last=performance.now(),uiAcc=0;
function frame(now){
  if(!document.hidden)wake();
  var rdt=Math.max(0,Math.min(0.1,(now-last)/1000));last=now;
  if(!busy){
    var sdt=rdt*speed,n=Math.max(1,Math.ceil(sdt/4)),i;
    for(i=0;i<n;i++)step(sdt/n);
    if(selId!=null){
      trailAcc+=sdt;
      if(trailAcc>=20){trailAcc=0;var c=byId(selId);if(c){trail.push([c.x,c.y]);if(trail.length>140)trail.shift()}}
    }
    uiAcc+=rdt;if(uiAcc>0.25){uiAcc=0;updateUI()}
    if(now-lastSave>10000){lastSave=now;save()}
  }
  dryVis+=((S.dr.until>0?1:0)-dryVis)*0.03;if(dryVis<0.01)dryVis=0;
  var T=nowT(),fi;
  for(fi=fx.length-1;fi>=0;fi--)if(T-fx[fi].t>4)fx.splice(fi,1);
  windTick(rdt,T);camTick(rdt);
  if(pageOpen){
    if(pageTab==='map'&&bigCv)drawBig(T);
    else if(pageTab==='cmp'){pageAcc+=rdt;if(pageAcc>3){pageAcc=0;drawNow()}}
  }else{drawMap(T);drawScope(T)}
  requestAnimationFrame(frame);
}
var lastAlive=Date.now();
function wake(){
  var wn=Date.now(),from=hiddenAt||lastAlive,el=(wn-from)/1000;
  hiddenAt=0;lastAlive=wn;
  if(el>5&&!busy){last=performance.now();catchUp(el,el>180)}
}
document.addEventListener('visibilitychange',function(){
  if(document.hidden){save();hiddenAt=Date.now()}else wake();
});
window.addEventListener('pageshow',wake);
window.addEventListener('focus',wake);
window.addEventListener('pagehide',save);
var rzT=0;
function resizeSoon(){resize();clearTimeout(rzT);rzT=setTimeout(function(){resize();rzT=setTimeout(resize,400)},120)}
window.addEventListener('resize',resizeSoon);
window.addEventListener('orientationchange',resizeSoon);
if(window.visualViewport)window.visualViewport.addEventListener('resize',resizeSoon);
if(window.ResizeObserver){new ResizeObserver(function(){var a=document.getElementById('app');if(a.clientWidth!==lastAW||a.clientHeight!==lastAH)resize()}).observe(document.getElementById('app'))}

(function init(){
  loadUI();
  var real=load();
  if(!S)newWorld();
  if(S.hist.sn==null)S.hist.sn=noonIdx(S.t);
  loadSnaps();if(!SNAPS.length)addSnap();
  resize();zcur=zT=defZ();
  if(byId(selId))select(selId);else if(selId==null&&S.cr.length)select(S.cr[0].id);else selId=null;
  var c0=byId(selId);if(c0){scx=c0.x;scy=c0.y}
  updateUI();
  try{if(!localStorage.getItem(KEY+'-hint4')){localStorage.setItem(KEY+'-hint4','1');setTimeout(function(){toast('小地図をタップすると「草原のページ」が開きます。右下の丸いボタンで全画面になります')},1500)}}catch(e){}
  if(real){var el=(Date.now()-real)/1000;if(el>30)catchUp(el,el>180)}
  requestAnimationFrame(frame);
})();

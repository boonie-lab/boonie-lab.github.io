<style>
*{box-sizing:border-box}
:root{--sat:env(safe-area-inset-top)}
html,body{margin:0;height:100%;overflow:hidden;background:#1f2a1c;color:#f3f1e6;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#probe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#app{position:relative;display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:1100px;margin:0 auto;padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left)}
header{display:flex;justify-content:space-between;align-items:center;padding:calc(6px + var(--sat)) 12px 6px;gap:8px}
#clock{font-size:13px;line-height:1.35}
#clock b{font-weight:600;font-size:15px}
#clock .c2{display:block}
#clock .spd{color:#f2d470;font-weight:600}
.seg{display:flex;border:1px solid #5d6b55;border-radius:8px;overflow:hidden;flex-shrink:0;width:max-content}
button{font:inherit;color:inherit;background:transparent;border:0;cursor:pointer}
.seg button{padding:8px 14px;font-size:13px;border-left:1px solid #5d6b55}
.seg button:first-child{border-left:0}
.seg button.on{background:#dfe8c8;color:#22301d}
#pgbtn{padding:8px 12px;border:1px solid #5d6b55;border-radius:8px;font-size:12.5px;white-space:nowrap;flex-shrink:0}
#main{flex:1;min-height:0;display:flex;flex-direction:column}
#view{flex:1;min-height:0;min-width:0;position:relative;margin:0 12px;border-radius:10px;overflow:hidden;background:#4a6b3a}
#sc{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none;display:block}
#stage{position:absolute;top:8px;right:8px;z-index:2;border-radius:6px;border:1.5px solid rgba(255,255,255,.8);overflow:hidden;opacity:.95;cursor:pointer}
#stage.inside{position:static;margin:0 auto 6px;flex:none;opacity:1}
#cv{display:block;width:100%;height:100%}
#toast{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 110px);background:rgba(31,42,28,.9);padding:6px 12px;border-radius:16px;font-size:13px;text-align:center;opacity:0;transition:opacity .5s;cursor:pointer;z-index:3}
#peek{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);width:max-content;max-width:88%;background:rgba(31,42,28,.92);padding:7px 14px;border-radius:12px;font-size:13px;line-height:1.5;text-align:center;opacity:0;transition:opacity .4s;pointer-events:none;z-index:5}
#fs{position:absolute;right:10px;bottom:10px;z-index:4;width:38px;height:38px;border-radius:50%;background:rgba(31,42,28,.72);border:1px solid rgba(255,255,255,.45);display:flex;align-items:center;justify-content:center;color:#fff;padding:0}
#side{flex:none;padding:6px 12px max(10px,calc(env(safe-area-inset-bottom) - 8px))}
#panel{height:116px;cursor:pointer;overflow-x:hidden;overflow-y:auto;padding:2px 2px 0;font-size:13px;line-height:1.45}
#panel .nm{font-size:16px;font-weight:600}
#panel .sub{color:#b9c4a8}
#panel .ttl{color:#f2d470}
#panel .care{color:#ffb38a}
.viewing{font-size:11px;color:#22301d;background:#dfe8c8;border-radius:8px;padding:1px 6px;vertical-align:2px}
.foot{position:sticky;bottom:0;background:#1f2a1c;padding:3px 0 2px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.back{display:inline-block;padding:2px 10px;border:1px solid #6f7d5e;border-radius:10px;color:#e9f1d4;cursor:pointer}
.go{text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;color:#e9f1d4;cursor:pointer}
.go.gone{opacity:.5}
.bar{display:inline-block;vertical-align:middle;width:90px;height:8px;border-radius:4px;background:#46553f;overflow:hidden;margin:0 6px}
.bar i{display:block;height:100%;background:#a9d06b}
#tools{display:flex;gap:8px;margin-top:6px}
#tools button{flex:1;padding:9px 2px;border:1px solid #5d6b55;border-radius:8px;font-size:12.5px;white-space:nowrap}
#tools button.off{opacity:.45}
#tools button.on{background:#dfe8c8;color:#22301d}
#modal{position:absolute;inset:0;background:rgba(15,22,13,.78);display:none;align-items:center;justify-content:center;padding:20px;z-index:7}
#modal .box{background:#2b3826;border-radius:12px;padding:16px 16px 14px;max-width:420px;width:100%;max-height:86%;overflow:auto;font-size:14px;line-height:1.7}
#modal h2{margin:0 0 6px;font-size:18px;font-weight:600}
#modal ul{margin:8px 0;padding-left:1.2em}
#modal .ok{margin-top:10px;width:100%;padding:11px;border-radius:8px;background:#dfe8c8;color:#22301d;font-size:15px}
.row{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 4px;border-top:1px solid #3b4a35;font-size:13px}
.row .chip{width:18px;height:18px;border-radius:50%;flex:none;border:3px solid #000}
.row .rn{font-size:15px;font-weight:600;min-width:4.2em}
.row .rs{color:#b9c4a8;flex:1}
div.row{cursor:pointer}
div.row.gone{cursor:default}
div.row.gone .rn,div.row.gone .chip{opacity:.5}
.row .chip.fl{border:0;font-size:13px;line-height:18px;text-align:center}
.fam{flex:none;padding:5px 10px;border:1px solid #6f7d5e;border-radius:14px;font-size:12px;color:#e9f1d4}
.fh{margin:12px 0 2px;font-weight:600;color:#f2d470;font-size:13px}
.cnl{margin-top:12px;text-align:center;font-weight:600;color:#f2d470;font-size:14px}
.cnav{display:flex;align-items:center;gap:8px;margin-top:4px}
.cnav input{flex:1;min-width:0;accent-color:#dfe8c8;height:28px}
.cnav .tog{flex:none}
.cnav .tog:disabled{opacity:.4}
.cnav input{touch-action:none}
#page{position:absolute;inset:0;z-index:6;background:#222d1f;display:none;flex-direction:column;padding:var(--sat) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#page .ph{display:flex;align-items:center;gap:8px;padding:8px 12px 8px}
#page .ph h2{flex:1;margin:0;font-size:17px;font-weight:600}
#pclose,.sb,.fitr button{padding:7px 14px;border:1px solid #5d6b55;border-radius:8px;font-size:13px}
#tabs{display:flex;margin:0 12px;border:1px solid #5d6b55;border-radius:8px;overflow:hidden;flex:none}
#tabs button{flex:1;padding:9px 2px;font-size:13px;border-left:1px solid #5d6b55}
#tabs button:first-child{border-left:0}
#tabs button.on{background:#dfe8c8;color:#22301d}
#pbody{flex:1;min-height:0;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px 20px;font-size:13.5px;line-height:1.6;touch-action:pan-y}
#pbody h3{font-size:14px;margin:18px 0 4px;font-weight:600}
.note{color:#b9c4a8;font-size:12px;margin-top:8px;line-height:1.55}
#bigmap{display:block;margin:0 auto;border-radius:8px}
.tog{padding:7px 12px;border:1px solid #5d6b55;border-radius:16px;font-size:13px}
.tog.on{background:#dfe8c8;color:#22301d}
.dh{margin:12px 0 2px;font-weight:600;color:#f2d470;font-size:13px}
.ev{display:flex;gap:8px;width:100%;text-align:left;padding:7px 2px;border-top:1px solid #3b4a35;font-size:13.5px;line-height:1.45;align-items:baseline}
.ev .et{color:#b9c4a8;font-size:12px;flex:none;width:3.2em}
.ev .ex{flex:1}
.ev .ar{color:#b9c4a8}
.ev.gone{opacity:.5;cursor:default}
.ev.plain{cursor:default}
.cmp{display:flex;flex-direction:column;gap:10px;align-items:center}
.cmp.wide{flex-direction:row;justify-content:center;align-items:flex-start;gap:12px}
.cmp canvas{display:block;border-radius:8px}
.cap{font-size:12.5px;margin-bottom:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.big{font-size:22px;font-weight:600;margin-bottom:6px}
table.st{border-collapse:collapse;width:100%;max-width:520px}
.st td{padding:4px 6px 4px 0;border-top:1px solid #3b4a35;vertical-align:top}
.st td:first-child{color:#b9c4a8;white-space:nowrap;width:9.5em}
table.dy{border-collapse:collapse}
.dy td,.dy th{padding:3px 12px 3px 0;text-align:right;font-weight:400;font-size:12.5px;border-top:1px solid #3b4a35}
.dy th{color:#b9c4a8;border-top:0}
.fitr{display:flex;align-items:center;gap:8px;margin:6px 0;flex-wrap:wrap}
.fitr span{min-width:2em;text-align:center}
#app.land #main{flex-direction:row}
#app.land #view{margin:calc(6px + var(--sat)) 0 calc(6px + env(safe-area-inset-bottom)) 12px}
#app.land #side{width:236px;display:flex;flex-direction:column;padding:calc(5px + var(--sat)) 12px calc(6px + env(safe-area-inset-bottom))}
#app.land header{padding:0 0 5px}
#app.land #clock{font-size:12px}
#app.land #clock b{font-size:13px}
#app.land #clock .c2{display:inline;margin-left:6px}
#app.land #clock .lg{display:none}
#app.land #pgbtn{padding:5px 7px;font-size:11.5px}
#app.land #panel{flex:1;height:auto;min-height:0;font-size:12.5px;line-height:1.42}
#app.land #panel .nm{font-size:15px}
#app.land .bar{width:60px}
#app.land #tools{gap:5px;margin-top:4px}
#app.land #tools button{padding:8px 0;font-size:11.5px}
#app.full{max-width:none;padding:0}
#app.full header,#app.full #side{display:none}
#app.full #view{margin:0;border-radius:0}
#app.full #stage{top:calc(8px + var(--sat));right:calc(8px + env(safe-area-inset-right))}
#app.full #fs{right:calc(10px + env(safe-area-inset-right));bottom:calc(10px + env(safe-area-inset-bottom))}
#app.full #toast{bottom:calc(10px + env(safe-area-inset-bottom))}
#app.full #peek{bottom:calc(78px + env(safe-area-inset-bottom))}
</style>
</head>
<body>
<div id="probe"></div>
<div id="app">
<header id="hdr">
<div id="clock"></div>
<button id="pgbtn">草原のページ</button>
</header>
<div id="main">
<div id="view">
<canvas id="sc"></canvas>
<div id="stage"><canvas id="cv"></canvas></div>

<script>
//SIM-START
var COLS=60,ROWS=40,CELL=10,W=COLS*CELL,H=ROWS*CELL,N=COLS*ROWS;
var DAY=86400,LIFE=3*DAY,MATURE=12*3600,COOLDOWN=5*3600,MAXPOP=50;
var GROW=0.0003,SPREAD=0.00012,BITE=0.02,GAIN=0.4,FLOOR=0.22,RICH=0.5,DRY=0.72,TREAT=1500;
// 天気（Bの回）。時間はすべて秒。【仮決め】の数字もここにまとめる
var WXK={
  clear:[3*3600,9*3600],   // 晴れ→次のくもりまで（1日に平均4回くらい）
  cloud:[600,1500],        // くもり 10〜25分
  noRain:0.3,              // くもりの3割は降らずに晴れる
  rain:[900,2700],         // 雨 15〜45分
  heavyP:0.4,heavy:[300,900], // 雨の4割に、本降りが5〜15分
  shower:[300,600],showerP:0.15,showerHeavyP:0.5,showerMax:3,showerWait:[60,180], // 通り雨
  dEnd:[900,2700],         // 日照りの終わり：本降り15分＋小雨45分
  wetUp:[1800,600],        // しめり気が満ちるまで（小雨・本降り）
  wetDown:10800,           // 雨あがりから約3時間で元にもどる
  wetGrow:0.25,            // しめり気があるときの草の育ち：最大×1.25【仮決め】
  eatE:40,eatTo:60,        // 本降りでも食べる目安：おなか40%を切ったら、60%まで【仮決め】
  lightRest:0.15           // 小雨のとき、ひとやすみを選びやすくする分（散歩が少なめ）
};
var SYL='モコピルタンポナミクトリハユキソラマロチ'.split('');
var WOOLS=[[45,25,93],[42,45,86],[220,6,72],[28,35,52],[260,8,36],[345,55,86],[150,35,82],[265,40,84],[52,70,80],[200,45,84]];
var S=null;
var hooks={event:function(){},tick:function(){}};

function rnd(a,b){return a+Math.random()*(b-a)}
function clamp(v,a,b){return v<a?a:v>b?b:v}
function pick(n){return Math.floor(Math.random()*n)}
function dist(a,b){var dx=a.x-b.x,dy=a.y-b.y;return Math.sqrt(dx*dx+dy*dy)}
function makeName(){
  var n,i,len,taken;
  do{
    len=Math.random()<0.6?2:3;n='';
    for(i=0;i<len;i++)n+=SYL[pick(SYL.length)];
    taken=S.cr.some(function(c){return c.name===n});
  }while(n[0]==='ン'||taken);
  return n;
}
function randWool(){var w=WOOLS[Math.random()<0.65?pick(5):5+pick(5)];return{wh:w[0],ws:w[1],wl:clamp(w[2]+rnd(-4,4),25,95)}}
function randLook(){
  var w=randWool(),r=Math.random(),r2=Math.random();
  return{wh:w.wh,ws:w.ws,wl:w.wl,fc:pick(5),pat:r<0.55?0:r<0.8?1:2,horn:r2<0.5?0:r2<0.8?1:2,ear:pick(3),size:rnd(0.88,1.12)};
}
function mixLook(a,b){
  var p=Math.random()<0.5?a:b,q=p===a?b:a,w;
  var L={wh:p.wh,ws:p.ws,wl:p.wl};
  if(Math.random()<0.3){L.ws=(a.ws+b.ws)/2;L.wl=(a.wl+b.wl)/2}
  if(Math.random()<0.05){w=randWool();L.wh=w.wh;L.ws=w.ws;L.wl=w.wl}
  L.wl=clamp(L.wl+rnd(-3,3),25,95);
  function g(k,n,m){return Math.random()<m?pick(n):(Math.random()<0.5?a:b)[k]}
  L.fc=g('fc',5,0.05);L.pat=g('pat',3,0.08);L.horn=g('horn',3,0.06);L.ear=g('ear',3,0.06);
  L.size=clamp((a.size+b.size)/2+rnd(-0.05,0.05),0.8,1.2);
  return L;
}
function mkCreature(x,y,t,L){
  var c={id:S.nid++,name:makeName(),x:x,y:y,h:rnd(0,6.28),age:0,life:LIFE*rnd(0.8,1.2),e:45,
    sp:t.sp,vis:t.vis,lazy:t.lazy,hung:t.hung,
    wh:L.wh,ws:L.ws,wl:L.wl,fc:L.fc,pat:L.pat,horn:L.horn,ear:L.ear,size:L.size,
    st:'rest',tx:x,ty:y,timer:rnd(5,40),cd:0,kids:0,pa:'',pb:'',ma:-1,mb:-1,tid:-1,b:{},bf:-1,poo:0,bell:false,kl:[],dead:false};
  S.cr.push(c);regAdd(c.id,c.name,-1,-1,Math.round(S.t),-1,0);return c;
}
// 名簿：生まれた子全員を、旅立ったあとも残す（家族の一覧用。ひつじの動きには使わない）
// 1行＝[番号, 名前, 親1の番号, 親2の番号, 生まれた時(不明はnull), 旅立った時(-1=暮らしている, -2=時期不明), 鈴(0/1)]
var REGMAX=1000;
function regFind(id){if(!S.reg)return null;for(var i=S.reg.length-1;i>=0;i--)if(S.reg[i][0]===id)return S.reg[i];return null}
function regAdd(id,name,a,b,t,g,bl){
  if(!S.reg)return null;
  var r=[id,name,a,b,t,g,bl?1:0],i;S.reg.push(r);
  if(S.reg.length>REGMAX){for(i=0;i<S.reg.length;i++)if(S.reg[i][5]!==-1){S.reg.splice(i,1);break}}
  return r;
}
function randTraits(){return{sp:rnd(4.5,7.5),vis:rnd(3,6),lazy:Math.random(),hung:rnd(48,62)}}
function mixTraits(a,b){
  function m(k,lo,hi,d){return clamp((a[k]+b[k])/2+rnd(-d,d),lo,hi)}
  return{sp:m('sp',3.5,8.5,0.45),vis:m('vis',2.5,7,0.4),lazy:m('lazy',0,1,0.12),hung:m('hung',44,66,2)};
}
function newHist(t){return{from:t,born:0,gone:0,imm:0,dr:0,rn:0,peak:0,day:Math.floor(t/DAY)+1,db:0,dx:0,dw:0,days:[],log:[]}}
function hlog(o){var h=S.hist;o.t=Math.round(S.t);h.log.push(o);if(h.log.length>400)h.log.shift()}
function newDrought(t){return{next:t+rnd(2.5,5)*DAY,until:0,warned:false}}
// 天気：st＝clear(晴れ)/cloud(くもり)/rain(雨)。until＝今の天気が終わる時、hs〜he＝本降りの時間帯、next＝次のくもり、
// k＝雨の種類(0ふつう/1通り雨/2日照りの終わり)、cr＝このくもりが雨になるか、rs＝雨の始まり、af＝雨があがった時、pend＝通り雨の予約
function newWeather(t){return{st:'clear',until:0,hs:0,he:0,next:t+rnd(WXK.clear[0],WXK.clear[1]),k:0,cr:0,rs:0,af:-1e9,pend:0,hon:0}}
function wxRain(){return !!S.wx&&S.wx.st==='rain'}
function wxHeavy(){var w=S.wx;return !!w&&w.st==='rain'&&S.t>=w.hs&&S.t<w.he}
function newWorld(){
  var now=new Date(),i,x,y,c;
  S={t:now.getHours()*3600+now.getMinutes()*60+now.getSeconds(),gacc:0,imm:0,nid:1,
     g:new Float32Array(N),f:new Float32Array(N),cl:new Float32Array(N),cln:0,cr:[],gavg:0.6,poo:[],fl:[],dr:null,reg:[],wx:null,wet:0};
  S.dr=newDrought(S.t);S.hist=newHist(S.t);S.wx=newWeather(S.t);
  var p1=rnd(0,6),p2=rnd(0,6),p3=rnd(0,6);
  for(y=0;y<ROWS;y++)for(x=0;x<COLS;x++){
    S.g[y*COLS+x]=clamp(0.62+0.25*Math.sin(x*0.31+p1)+0.25*Math.sin(y*0.23+p2)+0.15*Math.sin((x+y)*0.17+p3)+rnd(-0.06,0.06),0.15,1);
  }
  for(i=0;i<12;i++){
    c=mkCreature(rnd(60,W-60),rnd(40,H-40),randTraits(),randLook());
    c.age=rnd(0,0.4)*c.life;c.e=rnd(60,95);
  }
}
function darkness(t){
  var h=(t%DAY)/3600;
  if(h<4.5||h>=19.5)return 1;
  if(h<6)return 1-(h-4.5)/1.5;
  if(h>=18)return (h-18)/1.5;
  return 0;
}
function cellOf(c){
  var cx=clamp(Math.floor(c.x/CELL),0,COLS-1),cy=clamp(Math.floor(c.y/CELL),0,ROWS-1);
  return cy*COLS+cx;
}
function fertAt(px,py,a,b){
  var cx=clamp(Math.floor(px/CELL),0,COLS-1),cy=clamp(Math.floor(py/CELL),0,ROWS-1),x,y,i;
  for(y=cy-1;y<=cy+1;y++)for(x=cx-1;x<=cx+1;x++){
    if(x<0||y<0||x>=COLS||y>=ROWS)continue;
    i=y*COLS+x;S.f[i]=Math.min(1.5,S.f[i]+(x===cx&&y===cy?a:b));
  }
}
function growGrass(dt){
  var dry=(S.dr.until>0?DRY:1)*(1+WXK.wetGrow*(S.wet||0));
  var g=S.g,f=S.f,cl=S.cl,cn=0,r=GROW*dt*dry,sp=SPREAD*dt*dry,dec=1-dt/20000,i=0,x,y,v,na,sum=0;
  for(y=0;y<ROWS;y++)for(x=0;x<COLS;x++,i++){
    v=g[i];
    na=((x>0?g[i-1]:v)+(x<COLS-1?g[i+1]:v)+(y>0?g[i-COLS]:v)+(y<ROWS-1?g[i+COLS]:v))/4;
    v+=(r*Math.max(v,0.02)*(1-v)+sp*na*(1-v))*(1+2*f[i]);
    g[i]=v>1?1:v;sum+=g[i];
    f[i]*=dec;
    if(cl[i]>0){cl[i]-=dt/43200;if(cl[i]<0.02)cl[i]=0;else cn++}
  }
  S.gavg=sum/N;S.cln=cn;
}
function bondOf(a,b){return a.b[b.id]||0}
function addBond(a,b,v){
  a.b[b.id]=Math.min(1,(a.b[b.id]||0)+v);b.b[a.id]=Math.min(1,(b.b[a.id]||0)+v);
}
function tickBonds(dt){
  var cr=S.cr,n=cr.length,i,j,c,o,k,v,alive={},best,bv,dec=1-dt/200000,gain=0.0006*dt/30;
  for(i=0;i<n;i++)alive[cr[i].id]=1;
  for(i=0;i<n;i++){
    c=cr[i];
    for(j=i+1;j<n;j++){
      o=cr[j];
      if(Math.abs(c.x-o.x)<25&&Math.abs(c.y-o.y)<25&&dist(c,o)<25)
        addBond(c,o,gain*((c.st==='groom'&&c.tid===o.id)||(o.st==='groom'&&o.tid===c.id)?4:1));
    }
  }
  for(i=0;i<n;i++){
    c=cr[i];best=-1;bv=0.2;
    for(k in c.b){
      if(!alive[k]){delete c.b[k];continue}
      v=c.b[k]*dec;
      if(v<0.02){delete c.b[k];continue}
      c.b[k]=v;if(v>bv){bv=v;best=+k}
    }
    c.bf=best;
  }
}
function eligible(c){
  return !c.dead&&!c.held&&c.age>=MATURE&&c.age<c.life*0.9&&c.e>70&&c.cd<=0&&c.st!=='sleep'&&S.gavg>RICH&&S.cr.length<MAXPOP&&!wxHeavy();
}
function findMate(c){
  var best=null,bs=1e9,range=c.vis*CELL*2.5,i,o,d,s;
  for(i=0;i<S.cr.length;i++){
    o=S.cr[i];if(o===c||!eligible(o))continue;
    d=dist(c,o);if(d>range)continue;
    s=d-80*bondOf(c,o);
    if(s<bs){bs=s;best=o}
  }
  return best;
}
function byId(id){if(id<0||id==null)return null;for(var i=0;i<S.cr.length;i++)if(S.cr[i].id===id)return S.cr[i];return null}
function parentOf(c){
  if(c.age>=MATURE||c.lost)return null;
  var p=byId(c.ma)||byId(c.mb);
  return p&&Math.random()<1-0.6*c.age/MATURE?p:null;
}
function crowd(c,idx){
  var n=0,i,o;
  for(i=0;i<S.cr.length;i++){
    o=S.cr[i];if(o===c)continue;
    if((o.st==='eat'&&cellOf(o)===idx)||(o.st==='seek'&&o.tr&&Math.floor(o.ty/CELL)*COLS+Math.floor(o.tx/CELL)===idx))n++;
  }
  return n;
}
function seekFood(c,treat){
  var q=parentOf(c);if(!q||dist(c,q)<22)q=c;
  var cx=clamp(Math.floor(q.x/CELL),0,COLS-1),cy=clamp(Math.floor(q.y/CELL),0,ROWS-1);
  var R=Math.round(c.vis)+(treat?10:0),best=-1,bs=-9,x,y,gv,s,cl,k;
  for(y=Math.max(0,cy-R);y<=Math.min(ROWS-1,cy+R);y++)for(x=Math.max(0,cx-R);x<=Math.min(COLS-1,cx+R);x++){
    gv=S.g[y*COLS+x];cl=S.cl[y*COLS+x];
    if(treat?cl<0.2:(gv<0.38&&cl<0.2))continue;
    s=(treat?0.5:gv)+0.6*cl-0.05*Math.sqrt((x-cx)*(x-cx)+(y-cy)*(y-cy))+((x*7+y*13+c.id)%5)*(treat?0.09:0.01);
    if(cl>0.05){k=crowd(c,y*COLS+x);if(k>=2)continue;s-=0.2*k}
    if(s>bs){bs=s;best=y*COLS+x}
  }
  if(best<0)return false;
  c.tx=(best%COLS)*CELL+CELL/2+rnd(-3,3);c.ty=Math.floor(best/COLS)*CELL+CELL/2+rnd(-3,3);
  c.st='seek';c.tr=treat?1:0;return true;
}
function roam(c){
  var a=c.h+rnd(-0.7,0.7),d=rnd(90,170);
  var tx=c.x+Math.cos(a)*d,ty=c.y+Math.sin(a)*d;
  if(tx<8||tx>W-8||ty<8||ty>H-8){a=Math.atan2(H/2-c.y,W/2-c.x)+rnd(-0.8,0.8);tx=c.x+Math.cos(a)*d;ty=c.y+Math.sin(a)*d}
  c.tx=clamp(tx,6,W-6);c.ty=clamp(ty,6,H-6);c.st='roam';
}
function goNear(c,o,r){
  c.tx=clamp(o.x+rnd(-r,r),6,W-6);c.ty=clamp(o.y+rnd(-r,r),6,H-6);c.st='wander';
}
function wander(c,f){
  var o;
  if(f&&Math.random()<0.25+0.5*bondOf(c,f)){goNear(c,f,16);return}
  if(S.cr.length>1&&Math.random()<0.15){o=S.cr[pick(S.cr.length)];goNear(c,o,25);return}
  c.tx=clamp(c.x+rnd(-60,60),6,W-6);c.ty=clamp(c.y+rnd(-60,60),6,H-6);c.st='wander';
}
// 近くにいるほかの子（雨やどりの相手さがし）
function nearOther(c,r){
  var best=null,bd=r,i,o,d;
  for(i=0;i<S.cr.length;i++){o=S.cr[i];if(o===c||o.dead||o.lost===1||o.held)continue;d=dist(c,o);if(d<bd){bd=d;best=o}}
  return best;
}
// 本降り：その場の近くで仲よしのそばへ寄り、立ったままじっとする（雨やどり）
function shelter(c,o){c.st='shelter';c.tid=o?o.id:-1;c.timer=rnd(15,80);if(o&&dist(c,o)>1)c.h=Math.atan2(o.y-c.y,o.x-c.x)}
function decide(c,night){
  var hv=!night&&wxHeavy(),hung=night?30:hv?WXK.eatE:c.hung,o,f,par=null,juv=c.age<MATURE,d;
  if(juv&&c.lost!==1){par=byId(c.ma)||byId(c.mb)}
  if(c.e<hung){
    if(par&&c.e>25&&dist(c,par)>32){c.st='follow';c.tid=par.id;return}
    if(S.g[cellOf(c)]>0.4||S.cl[cellOf(c)]>0.05){c.st='eat';return}
    if(seekFood(c))return;
    roam(c);return;
  }
  if(c.lost===1){
    if(Math.random()<0.55){c.st='rest';c.timer=rnd(6,20)}
    else{c.tx=clamp(c.x+rnd(-22,22),6,W-6);c.ty=clamp(c.y+rnd(-16,16),6,H-6);c.st='wander'}
    return;
  }
  f=byId(c.bf);
  if(hv){
    if(par){if(dist(c,par)>12){c.st='follow';c.tid=par.id;return}shelter(c,par);return}
    o=f&&dist(c,f)<90?f:nearOther(c,60);
    if(o&&dist(c,o)>14){goNear(c,o,7);return}
    shelter(c,o);return;
  }
  if(par&&Math.random()<1-0.6*c.age/MATURE){
    if(dist(c,par)>18){c.st='follow';c.tid=par.id;return}
    f=par;
  }
  if(night){
    if(f&&dist(c,f)>16&&Math.random()<0.7){goNear(c,f,8);return}
    c.st='sleep';return;
  }
  if(eligible(c)){o=findMate(c);if(o){c.st='court';c.tid=o.id;return}}
  if(S.cln>0&&c.e<88&&seekFood(c,true))return;
  if(f&&f.st!=='sleep'&&bondOf(c,f)>0.3&&Math.random()<0.6){
    d=dist(c,f);
    if(d<16){c.st='groom';c.tid=f.id;c.timer=rnd(60,180);c.h=Math.atan2(f.y-c.y,f.x-c.x);return}
    if(d<70&&Math.random()<0.5){goNear(c,f,8);return}
  }
  if(Math.random()<0.25+0.5*c.lazy+(wxRain()?WXK.lightRest:0)){c.st='rest';c.timer=rnd(60,240)*(0.6+c.lazy)}
  else wander(c,f);
}
function mate(a,b){
  a.e-=20;b.e-=20;a.cd=COOLDOWN*rnd(0.8,1.2);b.cd=COOLDOWN*rnd(0.8,1.2);a.kids++;b.kids++;
  var ch=mkCreature((a.x+b.x)/2,(a.y+b.y)/2,mixTraits(a,b),mixLook(a,b));
  ch.pa=a.name;ch.pb=b.name;ch.ma=a.id;ch.mb=b.id;
  var rg=regFind(ch.id);if(rg){rg[2]=a.id;rg[3]=b.id}
  addBond(ch,a,1);addBond(ch,b,1);addBond(a,b,0.5);
  a.st='rest';a.timer=60;b.st='rest';b.timer=60;
  a.kl.push([ch.id,ch.name]);b.kl.push([ch.id,ch.name]);
  S.hist.born++;S.hist.db++;hlog({k:'b',n:ch.name,p:a.name+'・'+b.name,id:ch.id,pi:[a.id,b.id]});
  hooks.event('birth',{c:ch,a:a,b:b,x:ch.x,y:ch.y});
}
function die(c,why){
  c.dead=true;
  fertAt(c.x,c.y,1,0.5);
  var i=cellOf(c);if(S.g[i]<0.12)S.g[i]=0.12;
  var ad=Math.floor(c.age/DAY)+1;
  S.fl.push([Math.round(c.x),Math.round(c.y),Math.round(S.t),pick(4),c.name,ad,c.kids,c.bell?1:0,why==='age'?1:0,c.id]);
  var rg=regFind(c.id)||regAdd(c.id,c.name,c.ma,c.mb,Math.round(S.t-c.age),-1,0);
  if(rg){rg[5]=Math.round(S.t);rg[6]=c.bell?1:0}
  S.hist.gone++;S.hist.dx++;hlog({k:'d',n:c.name,a:ad,w:why==='age'?1:0,kd:c.kids,bl:c.bell?1:0,id:c.id});
  hooks.event('death',{c:c,why:why,x:c.x,y:c.y});
}
function updateCreature(c,dt,night){
  if(c.dead)return;
  c.age+=dt;if(c.cd>0)c.cd-=dt;
  var juv=c.age<MATURE,old=c.age>c.life*0.8,st=c.st;
  var drain=st==='sleep'?0.001:(st==='rest'||st==='groom'||st==='shelter')?0.002:st==='eat'?0.003:0.004*(0.6+0.4*c.sp/6);
  if(juv)drain*=0.8;
  if(c.held){c.e=Math.max(1,c.e-drain*dt);return}
  c.e-=drain*dt;
  if(c.e<=0){die(c,'starve');return}
  if(c.age>=c.life){die(c,'age');return}
  if(c.play)return;
  var o=null;
  if(S.cln>0&&!c.lost&&c.e<90&&st!=='sleep'&&st!=='court'&&st!=='follow'&&st!=='groom'&&!(st==='seek'&&c.tr)){
    c.lk=(c.lk||rnd(30,60))-dt;
    if(c.lk<=0){c.lk=rnd(30,60);if(S.cl[cellOf(c)]<0.2&&seekFood(c,true))return}
  }
  if(st==='eat'){
    var i=cellOf(c),take,trt=S.cl[i]>0.05;
    if(trt){take=BITE*dt;S.cl[i]=Math.max(0,S.cl[i]-dt/TREAT);c.e=Math.min(100,c.e+take*GAIN*1.5)}
    else{take=Math.min(Math.max(0,S.g[i]-FLOOR),BITE*dt);S.g[i]-=take;c.e=Math.min(100,c.e+take*GAIN)}
    c.poo+=take;
    if(c.poo>=25){
      c.poo=0;S.poo.push([Math.round(c.x+rnd(-3,3)),Math.round(c.y+rnd(-3,3)),Math.round(S.t)]);
      if(S.poo.length>220)S.poo.shift();
      fertAt(c.x,c.y,0.4,0.1);
    }
    if(c.e>=92||(c.e>=WXK.eatTo&&!night&&wxHeavy()))decide(c,night);
    else if(trt){if(S.cl[i]<=0.05)seekFood(c,true)}
    else if(S.g[i]<FLOOR+0.03){if(!seekFood(c))roam(c)}
    return;
  }
  if(st==='rest'){c.timer-=dt;if(c.timer<=0||c.e<c.hung)decide(c,night);return}
  if(st==='groom'){
    c.timer-=dt;o=byId(c.tid);
    if(c.timer<=0||!o||dist(c,o)>20||c.e<c.hung)decide(c,night);
    return;
  }
  if(st==='sleep'){if(!night||c.e<28)decide(c,night);return}
  if(st==='shelter'){
    o=byId(c.tid);
    if(night||c.e<WXK.eatE||(o&&dist(c,o)>24)){decide(c,night);return}
    if(!wxHeavy()){c.timer-=dt;if(c.timer<=0)decide(c,night)} // 本降りがやんだら、少しずつ散っていく
    return;
  }
  var tx=c.tx,ty=c.ty;
  if(st==='court'){
    o=byId(c.tid);
    if(!o||!eligible(o)||!eligible(c)){decide(c,night);return}
    tx=o.x;ty=o.y;
  }else if(st==='follow'){
    o=byId(c.tid);
    if(!o){decide(c,night);return}
    tx=o.x;ty=o.y;
  }
  var dx=tx-c.x,dy=ty-c.y,d=Math.sqrt(dx*dx+dy*dy);
  var v=c.sp*(c.e<20?0.55:1)*(old?0.7:1)*(juv?0.85:1)*(c.lost===2?1.7:1),stp=v*dt;
  if(d>0.01)c.h=Math.atan2(dy,dx);
  if(st==='court'&&d<7+stp){mate(c,o);return}
  if(st==='follow'){
    if(d<10+stp){if(d>10){c.x+=dx/d*(d-9);c.y+=dy/d*(d-9)}decide(c,night);return}
    c.x+=dx/d*stp;c.y+=dy/d*stp;return;
  }
  if(d<=stp){
    c.x=tx;c.y=ty;
    if(st==='seek'){if(S.g[cellOf(c)]>FLOOR+0.05||S.cl[cellOf(c)]>0.05)c.st='eat';else decide(c,night)}
    else decide(c,night);
  }else{c.x+=dx/d*stp;c.y+=dy/d*stp}
}
function addImmigrant(){
  var side=pick(4),x,y;
  if(side===0){x=6;y=rnd(20,H-20)}else if(side===1){x=W-6;y=rnd(20,H-20)}
  else if(side===2){x=rnd(20,W-20);y=6}else{x=rnd(20,W-20);y=H-6}
  var c=mkCreature(x,y,randTraits(),randLook());
  c.age=rnd(0.2,0.35)*c.life;c.e=85;c.h=Math.atan2(H/2-y,W/2-x);
  S.hist.imm++;hlog({k:'i',n:c.name,id:c.id});

}
function tickDrought(){
  var D=S.dr,w=S.wx;
  if(D.until>0){
    if(S.t>=D.until){
      D.until=0;D.next=S.t+rnd(3,6)*DAY;D.warned=false;hlog({k:'e'});
      startRain(WXK.dEnd[0]+WXK.dEnd[1],WXK.dEnd[0],2); // しっかりした雨で日照りがおわる
      hooks.event('droughtEnd',{});
    }
  }else{
    if(!D.warned&&S.t>=D.next-0.4*DAY){D.warned=true;hooks.event('droughtSoon',{})}
    // 日照りは晴れているときに始まる（くもり・雨の間は待つ）
    if(S.t>=D.next&&w.st==='clear'){D.until=S.t+rnd(0.7,1)*DAY;w.pend=0;S.hist.dr++;hlog({k:'s'});hooks.event('droughtStart',{})}
  }
}
// 雨を降らせる（dur＝長さ、hv＝本降りの長さ、k＝種類）
function startRain(dur,hv,k){
  var w=S.wx,a;
  w.st='rain';w.k=k;w.rs=S.t;w.until=S.t+dur;w.hs=w.he=0;w.hon=0;w.cr=0;
  if(hv>0){
    if(k===2)a=S.t;                                    // 日照りの終わり：はじめに本降り
    else if(k===1)a=S.t+Math.min(60,dur*0.15);           // 通り雨：ざっと降って、さっと上がる
    else a=S.t+rnd(0.1,0.9)*Math.max(0,dur-hv);          // ふつう：雨の途中のどこかで強まる
    w.hs=a;w.he=Math.min(w.until,a+hv);
  }
  S.hist.rn=(S.hist.rn||0)+1;S.hist.dw=(S.hist.dw||0)+1;
  if(k!==2)hlog({k:'w',m:Math.round(dur/60),sh:k===1?1:0,hv:hv>0?1:0});
  hooks.event('rainStart',{k:k});
}
// 天気の係（30秒ごと）。留守の計算でも同じように進む
function tickWeather(dt){
  var w=S.wx,D=S.dr,night=darkness(S.t)>0.6,i,c,hv;
  if(w.st==='rain'){
    S.wet=Math.min(1,(S.wet||0)+dt/WXK.wetUp[wxHeavy()?1:0]);
    hv=wxHeavy();
    if(hv&&!w.hon){
      w.hon=1;
      // 本降りになったら、みんな過ごし方を考えなおす（ねむっている子・食べているはらぺこの子・あとをついていく子はそのまま）
      for(i=0;i<S.cr.length;i++){
        c=S.cr[i];
        if(c.dead||c.held||c.play||c.lost===1||c.st==='sleep'||c.st==='follow'||(c.st==='eat'&&c.e<WXK.eatTo))continue;
        decide(c,night);
      }
      hooks.event('heavyStart',{});
    }else if(!hv&&w.hon){w.hon=0;hooks.event('heavyEnd',{})}
    if(S.t>=w.until){
      w.st='clear';w.af=S.t;w.hon=0;
      if(w.k===1)w.next=Math.max(w.next,S.t+rnd(3600,3*3600));
      else w.next=S.t+rnd(WXK.clear[0],WXK.clear[1]);
      hooks.event('rainEnd',{k:w.k});
    }
    return;
  }
  S.wet=Math.max(0,(S.wet||0)-dt/WXK.wetDown);
  if(D.until>0){w.pend=0;if(w.st==='cloud'){w.st='clear'}return} // 日照りの間は、くもり・雨・通り雨が来ない
  if(w.st==='cloud'){
    if(S.t>=w.until){
      if(w.cr)startRain(rnd(WXK.rain[0],WXK.rain[1]),Math.random()<WXK.heavyP?rnd(WXK.heavy[0],WXK.heavy[1]):0,0);
      else{w.st='clear';w.next=S.t+rnd(WXK.clear[0],WXK.clear[1]);hooks.event('cloudGone',{})}
    }
    return;
  }
  if(w.pend&&S.t>=w.pend){
    w.pend=0;i=rnd(WXK.shower[0],WXK.shower[1]);
    startRain(i,Math.random()<WXK.showerHeavyP?i*rnd(0.4,0.6):0,1);return;
  }
  if(S.t>=w.next){w.st='cloud';w.until=S.t+rnd(WXK.cloud[0],WXK.cloud[1]);w.cr=Math.random()>=WXK.noRain?1:0;hooks.event('cloud',{})}
}
function step(dt){
  S.t+=dt;S.gacc+=dt;
  if(S.gacc>=30){
    growGrass(S.gacc);tickBonds(S.gacc);tickDrought();tickWeather(S.gacc);S.imm-=S.gacc;S.gacc=0;
    while(S.poo.length&&S.t-S.poo[0][2]>9000)S.poo.shift();
    while(S.fl.length&&S.t-S.fl[0][2]>3*DAY)S.fl.shift();
    if(S.cr.length<=2&&S.imm<=0){addImmigrant();S.imm=1800}
    var hh=S.hist,hd=Math.floor(S.t/DAY)+1;
    if(S.cr.length>hh.peak)hh.peak=S.cr.length;
    if(hd!==hh.day){hh.days.push({d:hh.day,n:S.cr.length,g:Math.round(S.gavg*100),b:hh.db,x:hh.dx,w:hh.dw||0});if(hh.days.length>90)hh.days.shift();hh.day=hd;hh.db=0;hh.dx=0;hh.dw=0}
    hooks.tick();
  }
  var night=darkness(S.t)>0.6,i,dead=false;
  for(i=0;i<S.cr.length;i++){updateCreature(S.cr[i],dt,night);if(S.cr[i].dead)dead=true}
  if(dead)S.cr=S.cr.filter(function(c){return !c.dead});
}

function regSeed(){
  var idx={},i,r,e,c,f,L=S.hist&&S.hist.log||[],fresh=!S.reg;
  if(fresh)S.reg=[];
  for(i=0;i<S.reg.length;i++)idx[S.reg[i][0]]=S.reg[i];
  function add(id,name,a,b,t,g,bl){if(id==null||id<0)return null;if(idx[id])return idx[id];return idx[id]=regAdd(id,name,a,b,t,g,bl)}

    if(c.mb>=0)add(c.mb,c.pb||'？',-1,-1,null,-2,0);
    (c.kl||[]).forEach(function(k){setPar(add(k[0],k[1],c.id,-1,null,-2,0),c.id)});
  }
  for(i=0;i<S.fl.length;i++){

  if(busy)return;
  dropNow();endLost();
  var total=Math.min(sec,7*DAY),rem=total;
  busy=true;
  rep={born:[],aged:0,starved:0,imm:0,dr:0,rain:0,watched:'',bells:[]};

    if(rem>0){var p=document.getElementById('pct');if(p)p.textContent=Math.round((1-rem/total)*100);setTimeout(chunk,0);return}

function grassColor(v,o,d){
  var r,g,b,k;
  if(v<0.35){k=v/0.35;r=198+(178-198)*k;g=172+(200-172)*k;b=128+(112-128)*k}
  else if(v<0.7){k=(v-0.35)/0.35;r=178+(112-178)*k;g=200+(166-200)*k;b=112+(72-112)*k}
  else{k=(v-0.7)/0.3;r=112+(60-112)*k;g=166+(124-166)*k;b=72+(52-72)*k}
  if(dryVis>0){r+=(205-r)*0.3*dryVis;g+=(185-g)*0.22*dryVis;b+=(95-b)*0.2*dryVis}
  if(wetVis>0){k=1-0.13*wetVis;r*=k;g*=1-0.07*wetVis;b*=k} // 雨の間と雨あがりしばらくは、草の色が少し濃い
  d[o]=r;d[o+1]=g;d[o+2]=b;d[o+3]=255;
}

function openFamily(id){
  var X=regIndex(),me=X.m[id],h,seen={},cur,next,gens,k,sib=[],ps;

  h='<button class="back" id="fback">↩ みんなへ戻る</button><h2 style="margin-top:10px">'+me[1]+' の家族</h2>'+famRow(me);

  // 上の代
  seen[id]=1;cur=[me];gens=[];
  for(k=0;k<20;k++){next=[];cur.forEach(function(r){addNext(next,[X.m[r[2]],X.m[r[3]]])});if(!next.length)break;gens.push(next);cur=next}
  if(!gens.length)h+='<div class="fh">'+genUp(1)+'</div><div class="note" style="margin-top:2px">'+(me[2]<0&&me[3]<0?'親の記録はありません（旅の者や、はじめからいた子など）':'親の記録は残っていません')+'</div>';
  gens.forEach(function(g,i){h+='<div class="fh">'+genUp(i+1)+'（'+g.length+'匹）</div>';g.forEach(function(r){h+=famRow(r)})});

    if(sib.length){

    if(!next.length){if(k===1)h+='<div class="fh">'+genDown(1)+'</div><div class="note" style="margin-top:2px">まだいません</div>';break}

function sowAt(p){

  if(cx<0||cy<0||cx>=COLS||cy>=ROWS)return;
  for(y=cy-1;y<=cy+1;y++)for(x=cx-1;x<=cx+1;x++){

  S.cln=(S.cln||0)+1;
  fx.push({k:'seed',x:p[0],y:p[1],t:nowT()});
}

  var m=tummy(c);

}

function windTick(rdt,T){
  var i,c,dx,dy,q=heldGust,m;
  for(i=0;i<S.cr.length;i++){
    c=S.cr[i];
    if(c.held)continue;
    if(q){
      dx=c.x-q.x;dy=(c.y-q.y)*0.5;
      if(dx*dx+dy*dy<q.r*q.r){
        if(c.sulk>T){if(!c.sn||T-c.sn>2.4)c.sn=T;continue}
        m=tummy(c);
        if(!c.whs||T-c.wlt>1)c.whs=T;
        c.wlt=T;
        if(m>0||T-c.whs<0.9){c.wt=T;c.wd=1.2}
        if(m>0){
          c.wj=Math.min(1.6,(c.wj||0)+rdt*(m===2?0.9:0.45));
          if(!c.wn||T-c.wn>1.7)c.wn=T;
        }
        if(!c.et||T-c.et>1.3)c.et=T;
        continue;
      }
    }
    if(c.wj>0)c.wj=Math.max(0,c.wj-rdt*0.3);
  }
  if(T>nextBreeze){
    if(nextBreeze&&speed<=10&&!busy)gustAt(scx+rnd(-0.4,0.4)*zcur,scy+rnd(-25,25),0.55,0.5*zcur,T,true);

}

function hopRng(seed){var s=seed>>>0||1;return function(){s=(s*1664525+1013904223)>>>0;return s/4294967296}}

  if(type==='circle'){r=len/(2*Math.PI);for(i=0;i<=M;i++){s=len*i/M;f=s/r;pts.push([r*Math.sin(f),side*r*(1-Math.cos(f))])}}

// ===== 音（ひつじの声・鈴）=====
// 録音をそのまま鳴らす。シミュレーションには一切さわらない（乱数も別）。
var SNDK={vol:[0.12,0.3,0.6],idleMin:20,idleMax:60,night:3,vVoice:1,vBell:0.3,bellLen:1.5,bellRest:5,bellEach:60,bellGap:15,voiceMax:2,mark:1.2,far:300};
var AU={ac:null,out:null,buf:{},ok:false,loop:null,next:0,voices:[],bells:{},bellT:-99,bellSrc:[],unlocked:false,err:''};
var sndLog=[];window.__sndLog=sndLog;
var sndSeed=(Date.now()^0x5bd1e995)>>>0,SP={x:0,y:0,s:0};
function srnd(a,b){sndSeed=(sndSeed+0x6D2B79F5)>>>0;var t=sndSeed;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return a+((t^t>>>14)>>>0)/4294967296*(b-a)}

// mp3 の先頭・末尾の無音（詰め物）を飛ばして、くり返しの継ぎ目をなくす
function sndTrim(b){
  var d=b.getChannelData(0),n=d.length,pk=0,i,s=0,e=n-1;
  for(i=0;i<n;i++)if(Math.abs(d[i])>pk)pk=Math.abs(d[i]);
  for(i=0;i<n;i++)if(Math.abs(d[i])>pk*0.02){s=i;break}
  for(i=n-1;i>s;i--)if(Math.abs(d[i])>pk*0.005){e=i;break}
  return{s:s/b.sampleRate,e:(e+1)/b.sampleRate};
}
// 音の仕組みを捨てて作り直す（iPhoneで止まったまま戻らないときの保険）
function sndRebuild(){
  try{if(AU.ac&&AU.ac.close)AU.ac.close()}catch(e){}
  AU.ac=null;AU.ok=false;AU.buf={};AU.unlocked=false;AU.master=null;AU.out=null;AU.voices=[];AU.bellSrc=[];AU.bad=0;AU.rb=(AU.rb||0)+1;
}
function auTouch(){
  try{
    var now=performance.now();
    if(AU.ac&&AU.ac.state==='running')AU.bad=0;
    else if(AU.ac&&AU.ac.state==='closed')sndRebuild();
    else if(AU.ac){if(!AU.bad)AU.bad=now;else if(now-AU.bad>1500)sndRebuild()}
    if(!AU.ac){
      var C=window.AudioContext||window.webkitAudioContext;if(!C||!window.SND)return;
      try{if(navigator.audioSession&&navigator.audioSession.type!=='ambient')navigator.audioSession.type='ambient'}catch(e){}
      AU.ac=new C();
      var comp=AU.ac.createDynamicsCompressor(),g=AU.ac.createGain();
      comp.threshold.value=-8;comp.knee.value=8;comp.ratio.value=4;AU.master=g;sndVolume();
      comp.connect(g);g.connect(AU.ac.destination);AU.out=comp;
      Promise.all(['lamb','adult','bell'].map(function(k){return sndDecode(AU.ac,sndB64(SND[k])).then(function(b){AU.buf[k]=b})}))
        .then(function(){AU.loop=sndTrim(AU.buf.bell);AU.ok=true})

    if(!AU.unlocked){AU.unlocked=true;var s=AU.ac.createBufferSource();s.buffer=AU.ac.createBuffer(1,1,22050);s.connect(AU.ac.destination);s.start(0)}

['pointerdown','touchend','click','keydown'].forEach(function(n){document.addEventListener(n,auTouch,true)});
function auLive(k){return !!((k==='bell'?UI.sb:UI.sv)&&AU.ok&&AU.ac&&AU.ac.state==='running')}
// 全体の音量（小・中・大）。出口の 0.9 に掛ける
function sndVolume(){if(AU.master)AU.master.gain.value=0.9*SNDK.vol[clamp(UI.vl|0,0,2)]}

// 耳＝ズーム画面の中央・手前
function sndEar(){return scopeWorld(scw/2,sch*0.92,0.1)}
// 見えている範囲（小地図の白いわく）からの距離
function sndOut(x,y){
  var q=[scopeWorld(0,sch,0.12),scopeWorld(scw,sch,0.12),scopeWorld(scw,scHor,0.12),scopeWorld(0,scHor,0.12)],i,a,b,dx,dy,t,d,m=1e9,inside=true,cr;
  for(i=0;i<4;i++){
    a=q[i];b=q[(i+1)%4];dx=b[0]-a[0];dy=b[1]-a[1];
    cr=dx*(y-a[1])-dy*(x-a[0]);if(cr>0)inside=false;
    t=clamp(((x-a[0])*dx+(y-a[1])*dy)/(dx*dx+dy*dy||1),0,1);
    d=Math.hypot(x-a[0]-dx*t,y-a[1]-dy*t);if(d<m)m=d;

function sndPlace(c){
  var w=scw,h=sch,hor=scHor,on=proj(c.x,c.y,SP),u,dn,pan,vol,lp,k,ex,E,d,t,lp0;
  u=on?scZ*4.6*SP.s*c.size*ageScale(c):0;
  if(on&&SP.x>-u&&SP.x<w+u&&SP.y>hor&&SP.y-u*1.2<h){
    dn=clamp((SP.y-hor)/(h-hor),0,1);
    pan=clamp((SP.x-w/2)/(w/2),-1,1)*0.7;
    vol=0.5+0.45*dn;
    lp0=dn<0.35?6000+dn/0.35*12000:18000;
    ex=Math.abs(SP.x-w/2)/(w/2);k=clamp((ex-0.8)/0.3,0,1);
    if(SP.y>h)k=Math.max(k,clamp((SP.y-h)/(u*1.2),0,1));
    vol+=(0.35-vol)*k;lp=lp0+(1600-lp0)*k;
    return{on:true,pan:pan,vol:vol,lp:lp>=17000?0:lp};
  }
  E=sndEar();d=sndOut(c.x,c.y);t=clamp(d/SNDK.far,0,1);
  pan=clamp((c.x-E[0])/(zcur*0.5),-1,1)*0.75;
  return{on:false,pan:pan,vol:0.35+(0.14-0.35)*t,lp:1600+(1000-1600)*t,out:Math.round(d)};

function sndClip(name,P,gm){
  var ac=AU.ac,s=ac.createBufferSource(),last,f,g,p;
  s.buffer=AU.buf[name];last=s;
  if(P.lp){f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=P.lp;last.connect(f);last=f}
  g=ac.createGain();g.gain.value=P.vol*gm;last.connect(g);last=g;
  if(ac.createStereoPanner){p=ac.createStereoPanner();p.pan.value=P.pan;last.connect(p);last=p}
  last.connect(AU.out);s.start(ac.currentTime+0.02);

// 一声鳴く（why: idle＝ふだん／lost＝迷子／grab＝つまむ）
function sndVoice(c,why){
  if(!c||!sndAllowed())return false;
  var T=nowT(),k=c.age<MATURE?'lamb':'adult',P=sndPlace(c),live=auLive('voice'),q;
  AU.voices=AU.voices.filter(function(v){return v.end>T});
  if(why==='idle'&&AU.voices.length>=SNDK.voiceMax)return false;
  while(AU.voices.length>=SNDK.voiceMax){q=AU.voices.shift();try{if(q.src)q.src.stop()}catch(e){}}
  q={end:T+(k==='lamb'?1.3:1.07),src:null};
  if(live){try{q.src=sndClip(k,P,SNDK.vVoice)}catch(e){live=false}}
  AU.voices.push(q);
  if(why==='idle'&&UI.sv)c.vm=T;
  if(why==='grab'&&c.bell)sndBellPlay(c,'grab');
  sndPush({k:k,id:c.id,n:c.name,why:why,vol:r2(P.vol*SNDK.vVoice),pan:r2(P.pan),lp:Math.round(P.lp),on:P.on,played:live});
  return true;
}
function sndIdle(T){
  var L=lost,lc=L?byId(L.id):null,lostOn=!!(lc&&lc.lost===1),i,c,P,vis=[],near=null,nd=1e9,d,pick0;
  if(!AU.next){AU.next=T+srnd(SNDK.idleMin,SNDK.idleMax);return}
  if(T<AU.next)return;
  if(lostOn){
    if(L.baaT&&T-L.baaT<3){AU.next=L.baaT+3.1;return}
    if(L.baa-T<3){AU.next=L.baa+3.1;return}
  }
  AU.next=T+srnd(SNDK.idleMin,SNDK.idleMax)*(darkness(S.t)>0.6?SNDK.night:1)*(wxHeavy()?2:1); // 本降りの間は少なめ
  for(i=0;i<S.cr.length;i++){
    c=S.cr[i];
    if(c.dead||c.st==='sleep'||c.held||c.lost===1||(lostOn&&c.age<MATURE))continue;
    P=sndPlace(c);
    if(P.on)vis.push(c);
    else{d=P.out;if(d<nd){nd=d;near=c}}
  }
  pick0=vis.length?vis[Math.floor(srnd(0,vis.length))]:near;
  if(pick0)sndVoice(pick0,'idle');
}
// 鈴：歩き出したときに1回（約1.5秒）だけ。間引きつき
function sndBellPlay(c,why){
  var T=nowT(),P=sndPlace(c),live=auLive('bell'),ac,L,s,f,env,g,pn,t,len=SNDK.bellLen,b=AU.bells[c.id];
  if(b)b.last=T;AU.bellT=T;
  if(live){
    try{
      ac=AU.ac;L=AU.loop;t=ac.currentTime+0.02;
      s=ac.createBufferSource();s.buffer=AU.buf.bell;
      f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=P.lp||18000;
      env=ac.createGain();env.gain.setValueAtTime(0,t);env.gain.linearRampToValueAtTime(1,t+0.04);
      env.gain.setValueAtTime(1,t+len-0.5);env.gain.linearRampToValueAtTime(0,t+len);
      g=ac.createGain();g.gain.value=P.vol*SNDK.vBell;
      s.connect(f);f.connect(env);env.connect(g);
      if(ac.createStereoPanner){pn=ac.createStereoPanner();pn.pan.value=P.pan;g.connect(pn);pn.connect(AU.out)}else g.connect(AU.out);
      s.start(t,L.s);s.stop(t+len+0.05);
      AU.bellSrc.push({s:s,end:T+len});
    }catch(e){live=false}
  }
  sndPush({k:'bell',id:c.id,n:c.name,why:why,vol:r2(P.vol*SNDK.vBell),pan:r2(P.pan),lp:Math.round(P.lp),on:P.on,played:live});
}
function sndBells(T){
  var B=AU.bells,i,c,b,w,vb,id,alive={};
  vb=AU.voices.some(function(v){return v.end>T});
  for(i=0;i<S.cr.length;i++){
    c=S.cr[i];if(!c.bell||c.dead)continue;
    alive[c.id]=1;
    w=!c.held&&(c.play?!!(c.hop&&c.hop.lp):isMoving(c.st));
    b=B[c.id];
    if(!b){b=B[c.id]={wk:w,since:T,last:-99,pend:0};continue}
    if(w&&!b.wk){
      if(T-b.since>=SNDK.bellRest&&T-b.last>=SNDK.bellEach)b.pend=T+(vb?1.4:0);
    }
    if(w!==b.wk){b.wk=w;b.since=T;if(!w)b.pend=0}
    if(b.pend&&T>=b.pend){
      b.pend=0;
      if(b.wk&&T-AU.bellT>=SNDK.bellGap&&!AU.voices.some(function(v){return v.end>T+0.3}))sndBellPlay(c,'walk');
    }
  }
  for(id in B)if(!alive[id])delete B[id];
  AU.bellSrc=AU.bellSrc.filter(function(q){return q.end>T});
}
function sndQuiet(){
  var i,t;
  for(i=0;i<AU.bellSrc.length;i++)try{AU.bellSrc[i].s.stop()}catch(e){}

function sndTick(T){

}

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<title>ちいさな草原</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1f2a1c;color:#f3f1e6;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:980px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;padding:calc(6px + env(safe-area-inset-top)) 12px 6px;gap:8px}
#clock{font-size:13px;line-height:1.35}
#clock b{font-weight:600;font-size:15px}
.seg{display:flex;border:1px solid #5d6b55;border-radius:8px;overflow:hidden;flex-shrink:0}
button{font:inherit;color:inherit;background:transparent;border:0;cursor:pointer}
.seg button{padding:7px 9px;font-size:13px;border-left:1px solid #5d6b55}
.seg button:first-child{border-left:0}
.seg button.on{background:#dfe8c8;color:#22301d}
#main{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
#stage{flex:1;position:relative;min-height:0;overflow:hidden}
#cv{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
canvas{border-radius:10px;touch-action:none;display:block}
#toast{position:absolute;top:8px;left:50%;transform:translateX(-50%);max-width:94%;background:rgba(31,42,28,.9);padding:6px 12px;border-radius:16px;font-size:13px;text-align:center;opacity:0;transition:opacity .5s;cursor:pointer;z-index:3}
#tip{position:absolute;display:none;background:rgba(31,42,28,.92);padding:3px 8px;border-radius:6px;font-size:12px;white-space:nowrap;pointer-events:none}
#side{flex:none;padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
#sc{width:100%;touch-action:none}
#panel{height:86px;cursor:pointer;overflow:hidden;padding:6px 2px 0;font-size:13px;line-height:1.5}
#panel .nm{font-size:16px;font-weight:600}
#panel .sub{color:#b9c4a8}
#panel .ttl{color:#f2d470}
.bar{display:inline-block;vertical-align:middle;width:90px;height:8px;border-radius:4px;background:#46553f;overflow:hidden;margin:0 6px}
.bar i{display:block;height:100%;background:#a9d06b}
#tools{display:flex;gap:8px;margin-top:6px}
#tools button{flex:1;padding:9px 2px;border:1px solid #5d6b55;border-radius:8px;font-size:12.5px;white-space:nowrap}
#tools button.off{opacity:.45}
#tools button.on{background:#dfe8c8;color:#22301d}
#modal{position:absolute;inset:0;background:rgba(15,22,13,.78);display:none;align-items:center;justify-content:center;padding:20px;z-index:5}
#modal .box{background:#2b3826;border-radius:12px;padding:16px 16px 14px;max-width:420px;width:100%;max-height:86%;overflow:auto;font-size:14px;line-height:1.7}
#modal h2{margin:0 0 6px;font-size:18px;font-weight:600}
#modal ul{margin:8px 0;padding-left:1.2em}
#modal .ok{margin-top:10px;width:100%;padding:11px;border-radius:8px;background:#dfe8c8;color:#22301d;font-size:15px}
.row{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 4px;border-top:1px solid #3b4a35;font-size:13px}
.row .chip{width:18px;height:18px;border-radius:50%;flex:none;border:3px solid #000}
.row .rn{font-size:15px;font-weight:600;min-width:4.2em}
.row .rs{color:#b9c4a8;flex:1}
@media (min-aspect-ratio:1/1){
  #main{flex-direction:row}
  #side{width:400px;display:flex;flex-direction:column;justify-content:center}
}
#app.phone #main{flex-direction:column}
#app.phone #side{width:auto;flex:1;display:block;min-height:0}
#app.phone #stage{position:absolute;flex:none;top:14px;right:18px;z-index:2;border-radius:8px;border:1.5px solid rgba(255,255,255,.75);opacity:.94}
#app.phone #cv{border-radius:0}
</style>
</head>
<body>
<div id="app">
<header>
<div id="clock"></div>
<div class="seg" id="speeds"></div>
</header>
<div id="main">
<div id="stage">
<canvas id="cv"></canvas>
<div id="tip"></div>
</div>
<div id="toast"></div>
<div id="side">
<canvas id="sc"></canvas>
<div id="panel"></div>
<div id="tools">
<button id="roster">みんな</button>
<button id="bell">鈴をつける</button>
<button id="sow">種をまく</button>
<button id="reset">新しい世界</button>
</div>
</div>
</div>
<div id="modal"><div class="box" id="mbox"></div></div>
</div>
<script>
//SIM-START
var COLS=40,ROWS=60,CELL=10,W=COLS*CELL,H=ROWS*CELL,N=COLS*ROWS;
var DAY=86400,LIFE=3*DAY,MATURE=12*3600,COOLDOWN=5*3600,MAXPOP=50;
var GROW=0.0003,SPREAD=0.00012,BITE=0.02,GAIN=0.4,FLOOR=0.22,RICH=0.5,DRY=0.72;
var SYL='モコピルタンポナミクトリハユキソラマロチ'.split('');
var WOOLS=[[45,25,93],[42,45,86],[220,6,72],[28,35,52],[260,8,36],[345,55,86],[150,35,82],[265,40,84],[52,70,80],[200,45,84]];
var S=null;
var hooks={event:function(){}};

function rnd(a,b){return a+Math.random()*(b-a)}
function clamp(v,a,b){return v<a?a:v>b?b:v}
function pick(n){return Math.floor(Math.random()*n)}
function dist(a,b){var dx=a.x-b.x,dy=a.y-b.y;return Math.sqrt(dx*dx+dy*dy)}
function makeName(){
  var n,i,len,taken;
  do{
    len=Math.random()<0.6?2:3;n='';
    for(i=0;i<len;i++)n+=SYL[pick(SYL.length)];
    taken=S.cr.some(function(c){return c.name===n});
  }while(n[0]==='ン'||taken);
  return n;
}
function randWool(){var w=WOOLS[Math.random()<0.65?pick(5):5+pick(5)];return{wh:w[0],ws:w[1],wl:clamp(w[2]+rnd(-4,4),25,95)}}
function randLook(){
  var w=randWool(),r=Math.random(),r2=Math.random();
  return{wh:w.wh,ws:w.ws,wl:w.wl,fc:pick(5),pat:r<0.55?0:r<0.8?1:2,horn:r2<0.5?0:r2<0.8?1:2,ear:pick(3),size:rnd(0.88,1.12)};
}
function mixLook(a,b){
  var p=Math.random()<0.5?a:b,q=p===a?b:a,w;
  var L={wh:p.wh,ws:p.ws,wl:p.wl};
  if(Math.random()<0.3){L.ws=(a.ws+b.ws)/2;L.wl=(a.wl+b.wl)/2}
  if(Math.random()<0.05){w=randWool();L.wh=w.wh;L.ws=w.ws;L.wl=w.wl}
  L.wl=clamp(L.wl+rnd(-3,3),25,95);
  function g(k,n,m){return Math.random()<m?pick(n):(Math.random()<0.5?a:b)[k]}
  L.fc=g('fc',5,0.05);L.pat=g('pat',3,0.08);L.horn=g('horn',3,0.06);L.ear=g('ear',3,0.06);
  L.size=clamp((a.size+b.size)/2+rnd(-0.05,0.05),0.8,1.2);
  return L;
}
function mkCreature(x,y,t,L){
  var c={id:S.nid++,name:makeName(),x:x,y:y,h:rnd(0,6.28),age:0,life:LIFE*rnd(0.8,1.2),e:45,
    sp:t.sp,vis:t.vis,lazy:t.lazy,hung:t.hung,
    wh:L.wh,ws:L.ws,wl:L.wl,fc:L.fc,pat:L.pat,horn:L.horn,ear:L.ear,size:L.size,
    st:'rest',tx:x,ty:y,timer:rnd(5,40),cd:0,kids:0,pa:'',pb:'',ma:-1,mb:-1,tid:-1,b:{},bf:-1,poo:0,bell:false,dead:false};
  S.cr.push(c);return c;
}
function randTraits(){return{sp:rnd(4.5,7.5),vis:rnd(3,6),lazy:Math.random(),hung:rnd(48,62)}}
function mixTraits(a,b){
  function m(k,lo,hi,d){return clamp((a[k]+b[k])/2+rnd(-d,d),lo,hi)}
  return{sp:m('sp',3.5,8.5,0.45),vis:m('vis',2.5,7,0.4),lazy:m('lazy',0,1,0.12),hung:m('hung',44,66,2)};
}
function newHist(t){return{from:t,born:0,gone:0,imm:0,dr:0,peak:0,day:Math.floor(t/DAY)+1,db:0,dx:0,days:[],log:[]}}
function hlog(o){var h=S.hist;o.t=Math.round(S.t);h.log.push(o);if(h.log.length>300)h.log.shift()}
function newDrought(t){return{next:t+rnd(2.5,5)*DAY,until:0,warned:false}}
function newWorld(){
  var now=new Date(),i,x,y,c;
  S={t:now.getHours()*3600+now.getMinutes()*60+now.getSeconds(),gacc:0,imm:0,nid:1,
     g:new Float32Array(N),f:new Float32Array(N),cr:[],gavg:0.6,poo:[],fl:[],dr:null};
  S.dr=newDrought(S.t);S.hist=newHist(S.t);
  var p1=rnd(0,6),p2=rnd(0,6),p3=rnd(0,6);
  for(y=0;y<ROWS;y++)for(x=0;x<COLS;x++){
    S.g[y*COLS+x]=clamp(0.62+0.25*Math.sin(x*0.31+p1)+0.25*Math.sin(y*0.23+p2)+0.15*Math.sin((x+y)*0.17+p3)+rnd(-0.06,0.06),0.15,1);
  }
  for(i=0;i<12;i++){
    c=mkCreature(rnd(40,W-40),rnd(60,H-60),randTraits(),randLook());
    c.age=rnd(0,0.4)*c.life;c.e=rnd(60,95);
  }
}
function darkness(t){
  var h=(t%DAY)/3600;
  if(h<4.5||h>=19.5)return 1;
  if(h<6)return 1-(h-4.5)/1.5;
  if(h>=18)return (h-18)/1.5;
  return 0;
}
function cellOf(c){
  var cx=clamp(Math.floor(c.x/CELL),0,COLS-1),cy=clamp(Math.floor(c.y/CELL),0,ROWS-1);
  return cy*COLS+cx;
}
function fertAt(px,py,a,b){
  var cx=clamp(Math.floor(px/CELL),0,COLS-1),cy=clamp(Math.floor(py/CELL),0,ROWS-1),x,y,i;
  for(y=cy-1;y<=cy+1;y++)for(x=cx-1;x<=cx+1;x++){
    if(x<0||y<0||x>=COLS||y>=ROWS)continue;
    i=y*COLS+x;S.f[i]=Math.min(1.5,S.f[i]+(x===cx&&y===cy?a:b));
  }
}
function growGrass(dt){
  var dry=S.dr.until>0?DRY:1;
  var g=S.g,f=S.f,r=GROW*dt*dry,sp=SPREAD*dt*dry,dec=1-dt/20000,i=0,x,y,v,na,sum=0;
  for(y=0;y<ROWS;y++)for(x=0;x<COLS;x++,i++){
    v=g[i];
    na=((x>0?g[i-1]:v)+(x<COLS-1?g[i+1]:v)+(y>0?g[i-COLS]:v)+(y<ROWS-1?g[i+COLS]:v))/4;
    v+=(r*Math.max(v,0.02)*(1-v)+sp*na*(1-v))*(1+2*f[i]);
    g[i]=v>1?1:v;sum+=g[i];
    f[i]*=dec;
  }
  S.gavg=sum/N;
}
function bondOf(a,b){return a.b[b.id]||0}
function addBond(a,b,v){
  a.b[b.id]=Math.min(1,(a.b[b.id]||0)+v);b.b[a.id]=Math.min(1,(b.b[a.id]||0)+v);
}
function tickBonds(dt){
  var cr=S.cr,n=cr.length,i,j,c,o,k,v,alive={},best,bv,dec=1-dt/200000,gain=0.0006*dt/30;
  for(i=0;i<n;i++)alive[cr[i].id]=1;
  for(i=0;i<n;i++){
    c=cr[i];
    for(j=i+1;j<n;j++){
      o=cr[j];
      if(Math.abs(c.x-o.x)<25&&Math.abs(c.y-o.y)<25&&dist(c,o)<25)
        addBond(c,o,gain*((c.st==='groom'&&c.tid===o.id)||(o.st==='groom'&&o.tid===c.id)?4:1));
    }
  }
  for(i=0;i<n;i++){
    c=cr[i];best=-1;bv=0.2;
    for(k in c.b){
      if(!alive[k]){delete c.b[k];continue}
      v=c.b[k]*dec;
      if(v<0.02){delete c.b[k];continue}
      c.b[k]=v;if(v>bv){bv=v;best=+k}
    }
    c.bf=best;
  }
}
function eligible(c){
  return !c.dead&&c.age>=MATURE&&c.age<c.life*0.9&&c.e>70&&c.cd<=0&&c.st!=='sleep'&&S.gavg>RICH&&S.cr.length<MAXPOP;
}
function findMate(c){
  var best=null,bs=1e9,range=c.vis*CELL*2.5,i,o,d,s;
  for(i=0;i<S.cr.length;i++){
    o=S.cr[i];if(o===c||!eligible(o))continue;
    d=dist(c,o);if(d>range)continue;
    s=d-80*bondOf(c,o);
    if(s<bs){bs=s;best=o}
  }
  return best;
}
function byId(id){if(id<0||id==null)return null;for(var i=0;i<S.cr.length;i++)if(S.cr[i].id===id)return S.cr[i];return null}
function parentOf(c){
  if(c.age>=MATURE)return null;
  var p=byId(c.ma)||byId(c.mb);
  return p&&Math.random()<1-0.6*c.age/MATURE?p:null;
}
function seekFood(c){
  var q=parentOf(c);if(!q||dist(c,q)<22)q=c;
  var cx=clamp(Math.floor(q.x/CELL),0,COLS-1),cy=clamp(Math.floor(q.y/CELL),0,ROWS-1);
  var R=Math.round(c.vis),best=-1,bs=-9,x,y,gv,s;
  for(y=Math.max(0,cy-R);y<=Math.min(ROWS-1,cy+R);y++)for(x=Math.max(0,cx-R);x<=Math.min(COLS-1,cx+R);x++){
    gv=S.g[y*COLS+x];if(gv<0.38)continue;
    s=gv-0.05*Math.sqrt((x-cx)*(x-cx)+(y-cy)*(y-cy))+((x*7+y*13+c.id)%5)*0.01;
    if(s>bs){bs=s;best=y*COLS+x}
  }
  if(best<0)return false;
  c.tx=(best%COLS)*CELL+CELL/2+rnd(-3,3);c.ty=Math.floor(best/COLS)*CELL+CELL/2+rnd(-3,3);
  c.st='seek';return true;
}
function roam(c){
  var a=c.h+rnd(-0.7,0.7),d=rnd(90,170);
  var tx=c.x+Math.cos(a)*d,ty=c.y+Math.sin(a)*d;
  if(tx<8||tx>W-8||ty<8||ty>H-8){a=Math.atan2(H/2-c.y,W/2-c.x)+rnd(-0.8,0.8);tx=c.x+Math.cos(a)*d;ty=c.y+Math.sin(a)*d}
  c.tx=clamp(tx,6,W-6);c.ty=clamp(ty,6,H-6);c.st='roam';
}
function goNear(c,o,r){
  c.tx=clamp(o.x+rnd(-r,r),6,W-6);c.ty=clamp(o.y+rnd(-r,r),6,H-6);c.st='wander';
}
function wander(c,f){
  var o;
  if(f&&Math.random()<0.25+0.5*bondOf(c,f)){goNear(c,f,16);return}
  if(S.cr.length>1&&Math.random()<0.15){o=S.cr[pick(S.cr.length)];goNear(c,o,25);return}
  c.tx=clamp(c.x+rnd(-60,60),6,W-6);c.ty=clamp(c.y+rnd(-60,60),6,H-6);c.st='wander';
}
function decide(c,night){
  var hung=night?30:c.hung,o,f,par=null,juv=c.age<MATURE,d;
  if(juv){par=byId(c.ma)||byId(c.mb)}
  if(c.e<hung){
    if(par&&c.e>25&&dist(c,par)>32){c.st='follow';c.tid=par.id;return}
    if(S.g[cellOf(c)]>0.4){c.st='eat';return}
    if(seekFood(c))return;
    roam(c);return;
  }
  f=byId(c.bf);
  if(par&&Math.random()<1-0.6*c.age/MATURE){
    if(dist(c,par)>18){c.st='follow';c.tid=par.id;return}
    f=par;
  }
  if(night){
    if(f&&dist(c,f)>16&&Math.random()<0.7){goNear(c,f,8);return}
    c.st='sleep';return;
  }
  if(eligible(c)){o=findMate(c);if(o){c.st='court';c.tid=o.id;return}}
  if(f&&f.st!=='sleep'&&bondOf(c,f)>0.3&&Math.random()<0.6){
    d=dist(c,f);
    if(d<16){c.st='groom';c.tid=f.id;c.timer=rnd(60,180);c.h=Math.atan2(f.y-c.y,f.x-c.x);return}
    if(d<70&&Math.random()<0.5){goNear(c,f,8);return}
  }
  if(Math.random()<0.25+0.5*c.lazy){c.st='rest';c.timer=rnd(60,240)*(0.6+c.lazy)}
  else wander(c,f);
}
function mate(a,b){
  a.e-=20;b.e-=20;a.cd=COOLDOWN*rnd(0.8,1.2);b.cd=COOLDOWN*rnd(0.8,1.2);a.kids++;b.kids++;
  var ch=mkCreature((a.x+b.x)/2,(a.y+b.y)/2,mixTraits(a,b),mixLook(a,b));
  ch.pa=a.name;ch.pb=b.name;ch.ma=a.id;ch.mb=b.id;
  addBond(ch,a,1);addBond(ch,b,1);addBond(a,b,0.5);
  a.st='rest';a.timer=60;b.st='rest';b.timer=60;
  S.hist.born++;S.hist.db++;hlog({k:'b',n:ch.name,p:a.name+'・'+b.name});
  hooks.event('birth',{c:ch,a:a,b:b,x:ch.x,y:ch.y});
}
function die(c,why){
  c.dead=true;
  fertAt(c.x,c.y,1,0.5);
  var i=cellOf(c);if(S.g[i]<0.12)S.g[i]=0.12;
  var ad=Math.floor(c.age/DAY)+1;
  S.fl.push([Math.round(c.x),Math.round(c.y),Math.round(S.t),pick(4),c.name,ad,c.kids,c.bell?1:0]);
  S.hist.gone++;S.hist.dx++;hlog({k:'d',n:c.name,a:ad,w:why==='age'?1:0,kd:c.kids,bl:c.bell?1:0});
  hooks.event('death',{c:c,why:why,x:c.x,y:c.y});
}
function updateCreature(c,dt,night){
  if(c.dead)return;
  c.age+=dt;if(c.cd>0)c.cd-=dt;
  var juv=c.age<MATURE,old=c.age>c.life*0.8,st=c.st;
  var drain=st==='sleep'?0.001:(st==='rest'||st==='groom')?0.002:st==='eat'?0.003:0.004*(0.6+0.4*c.sp/6);
  if(juv)drain*=0.8;
  c.e-=drain*dt;
  if(c.e<=0){die(c,'starve');return}
  if(c.age>=c.life){die(c,'age');return}
  var o=null;
  if(st==='eat'){
    var i=cellOf(c),take=Math.min(Math.max(0,S.g[i]-FLOOR),BITE*dt);
    S.g[i]-=take;c.e=Math.min(100,c.e+take*GAIN);
    c.poo+=take;
    if(c.poo>=25){
      c.poo=0;S.poo.push([Math.round(c.x+rnd(-3,3)),Math.round(c.y+rnd(-3,3)),Math.round(S.t)]);
      if(S.poo.length>220)S.poo.shift();
      fertAt(c.x,c.y,0.4,0.1);
    }
    if(c.e>=92)decide(c,night);
    else if(S.g[i]<FLOOR+0.03){if(!seekFood(c))roam(c)}
    return;
  }
  if(st==='rest'){c.timer-=dt;if(c.timer<=0||c.e<c.hung)decide(c,night);return}
  if(st==='groom'){
    c.timer-=dt;o=byId(c.tid);
    if(c.timer<=0||!o||dist(c,o)>20||c.e<c.hung)decide(c,night);
    return;
  }
  if(st==='sleep'){if(!night||c.e<28)decide(c,night);return}
  var tx=c.tx,ty=c.ty;
  if(st==='court'){
    o=byId(c.tid);
    if(!o||!eligible(o)||!eligible(c)){decide(c,night);return}
    tx=o.x;ty=o.y;
  }else if(st==='follow'){
    o=byId(c.tid);
    if(!o){decide(c,night);return}
    tx=o.x;ty=o.y;
  }
  var dx=tx-c.x,dy=ty-c.y,d=Math.sqrt(dx*dx+dy*dy);
  var v=c.sp*(c.e<20?0.55:1)*(old?0.7:1)*(juv?0.85:1),stp=v*dt;
  if(d>0.01)c.h=Math.atan2(dy,dx);
  if(st==='court'&&d<7+stp){mate(c,o);return}
  if(st==='follow'){
    if(d<10+stp){if(d>10){c.x+=dx/d*(d-9);c.y+=dy/d*(d-9)}decide(c,night);return}
    c.x+=dx/d*stp;c.y+=dy/d*stp;return;
  }
  if(d<=stp){
    c.x=tx;c.y=ty;

function addImmigrant(){

  c.age=rnd(0.2,0.35)*c.life;c.e=85;c.h=Math.atan2(H/2-y,W/2-x);

  }else{

function step(dt){

    while(S.poo.length&&S.t-S.poo[0][2]>6*3600)S.poo.shift();

function catchUp(sec,showReport){

  function chunk(){
    var t0=performance.now();
    while(rem>0&&performance.now()-t0<24){var d=Math.min(10,rem);step(d);rem-=d}
    if(rem>0){var p=document.getElementById('pct');if(p)p.textContent=Math.round((1-rem/total)*100);setTimeout(chunk,0);return}

  return near?near.name+'のそばでひとやすみ':'ひとやすみ';
}
function personality(c){
  var a=[];
  if(c.lazy>0.62)a.push('のんびり屋');else if(c.lazy<0.3)a.push('はたらき者');
  if(c.sp>6.8)a.push('足が速い');else if(c.sp<5.2)a.push('ゆっくり歩き');
  if(c.vis>5)a.push('目がいい');
  if(c.hung>58)a.push('食いしんぼう');
  return a.length?a.slice(0,2).join('・'):'ふつう';
}
function titlesOf(c){
  var a=[],i,o,old=true,kids=c.kids>=2,young=c.age<MATURE;
  if(S.cr.length<2)return '';
  for(i=0;i<S.cr.length;i++){o=S.cr[i];if(o===c)continue;if(o.age>c.age)old=false;if(o.kids>c.kids)kids=false;if(o.age<c.age)young=false}
  if(old)a.push('草原の最年長');if(kids)a.push('いちばんの子だくさん');if(young)a.push('いちばん年下');
  return a.join('・');
}
function stageOf(c){return c.age<MATURE?'こども':c.age>c.life*0.8?'お年より':'おとな'}
function updateUI(){
  var t=S.t%DAY,hh=Math.floor(t/3600),mm=Math.floor(t%3600/60);
  elClock.innerHTML='<b>'+dayOf(S.t)+'日め</b> '+(hh<10?'0':'')+hh+':'+(mm<10?'0':'')+mm+(S.dr.until>0?'　日照り':'')+'<br>'+S.cr.length+'匹が暮らしています';
  var c=byId(selId),f,tt;
  elBell.textContent=c&&c.bell?'鈴をはずす':'鈴をつける';elBell.className=c?'':'off';
  if(c){
    f=byId(c.bf);tt=titlesOf(c);
    elPanel.innerHTML='<span class="nm">'+c.name+(c.bell?' 🔔':'')+'</span> <span class="sub">'+ageDays(c)+'日め・'+stageOf(c)+'・'+personality(c)+'</span><br>'+
      'おなか<span class="bar"><i style="width:'+Math.round(c.e)+'%"></i></span>'+Math.round(c.e)+'%　子ども '+c.kids+'匹<br>'+
      '<span class="sub">'+statusText(c)+(f?'　なかよし：'+f.name:'')+'<br>'+(tt?'<span class="ttl">'+tt+'</span>　':'')+(c.pa?'親：'+c.pa+'・'+c.pb:'')+(follow?'':'　（ここをタップで追いかける）')+'</span>';
  }else if(memorial){elPanel.innerHTML=memorial}
  else elPanel.innerHTML='<span class="sub">放っておいても草は育ち、ひつじたちは食べ、出会い、子が生まれ、やがて旅立ちます。</span>';
}
function openRoster(){
  var list=S.cr.slice().sort(function(a,b){return (b.bell?1:0)-(a.bell?1:0)||b.age-a.age}),h='<h2>みんな（'+list.length+'匹）</h2>',i,c,tt;
  for(i=0;i<list.length;i++){
    c=list[i];
    h+='<button class="row" data-id="'+c.id+'"><span class="chip" style="background:'+wool(c)+';border-color:'+FACE[c.fc]+'"></span><span class="rn">'+c.name+(c.bell?' 🔔':'')+'</span>'+
      '<span class="rs">'+ageDays(c)+'日め・'+stageOf(c)+'　'+((tt=titlesOf(c))?'<span style="color:#f2d470">'+tt+'</span>':statusText(c))+'</span></button>';
  }
  h+='<button class="ok" id="mok">とじる</button>';
  elBox.innerHTML=h;elModal.style.display='flex';
  document.getElementById('mok').onclick=closeModal;
  Array.prototype.forEach.call(elBox.querySelectorAll('.row'),function(b){
    b.onclick=function(){select(+b.getAttribute('data-id'));closeModal()};
  });
}

function toWorld(ev){var r=cv.getBoundingClientRect();return[(ev.clientX-r.left)/r.width*W,(ev.clientY-r.top)/r.height*H]}
function nearest(p,lim){
  var best=null,bd=lim,i,c,d;
  for(i=0;i<S.cr.length;i++){c=S.cr[i];d=Math.sqrt((c.x-p[0])*(c.x-p[0])+(c.y-p[1])*(c.y-p[1]));if(d<bd){bd=d;best=c}}
  return best;
}
function sowAt(p){
  var cx=Math.floor(p[0]/CELL),cy=Math.floor(p[1]/CELL),x,y,i;
  for(y=cy-1;y<=cy+1;y++)for(x=cx-1;x<=cx+1;x++){
    if(x<0||y<0||x>=COLS||y>=ROWS)continue;
    i=y*COLS+x;S.g[i]=Math.min(1,S.g[i]+(x===cx&&y===cy?0.3:0.12));
  }
  fx.push({k:'seed',x:p[0]+rnd(-6,6),y:p[1]+rnd(-6,6),t:nowT()});
}
function touchSheep(c,amt,T){
  var b=c.wj||0;c.wt=T;c.et=T;c.wj=Math.min(1.4,b+amt);
}
function gustAt(wx,wy,s,r,T,soft){
  var i,c,dx,dy;
  gusts.push({x:wx,y:wy,t:T,s:s,r:r,seed:Math.random()});if(gusts.length>6)gusts.shift();
  for(i=0;i<S.cr.length;i++){
    c=S.cr[i];dx=c.x-wx;dy=(c.y-wy)*0.4;
    if(dx*dx+dy*dy<r*r){if(soft)c.et=T+Math.random()*0.5;else touchSheep(c,0.35*s,T)}
  }
}
function stopHeld(){
  if(!heldGust)return;
  heldGust.hold=false;heldGust.t=nowT();heldGust=null;
}
function windTick(rdt,T){
  var i,c,dx,dy,q=heldGust;
  for(i=0;i<S.cr.length;i++){
    c=S.cr[i];
    if(c.wj>0)c.wj=Math.max(0,c.wj-rdt*0.12);
    if(q){
      dx=c.x-q.x;dy=(c.y-q.y)*0.4;
      if(dx*dx+dy*dy<q.r*q.r){c.wt=T;c.wj=Math.min(1.4,(c.wj||0)+rdt*0.75);if(!c.et||T-c.et>1.3)c.et=T}
    }
  }
  if(T>nextBreeze){
    if(nextBreeze&&speed<=10&&!busy)gustAt(scx+rnd(-0.4,0.4)*zcur,scy+rnd(-25,25),0.55,0.5*zcur,T,true);
    nextBreeze=T+rnd(25,70);
  }
}
function camTick(rdt){
  if(gest||pinch||follow||mapDrag)return;
  if(Math.abs(vx)+Math.abs(vy)<0.5){vx=vy=0;return}
  scx=clamp(scx-vx*rdt,0,W);scy=clamp(scy-vy*rdt,0,H);
  var k=Math.pow(0.03,rdt);vx*=k;vy*=k;
}
var pdown=false,mapDrag=false;
cv.addEventListener('pointerdown',function(ev){
  if(busy)return;
  var p=toWorld(ev);pdown=true;
  if(sowing){sowAt(p);return}
  if(!phone){var best=nearest(p,24);if(best){select(best.id);return}}
  mapDrag=true;follow=false;vx=vy=0;scx=clamp(p[0],0,W);scy=clamp(p[1],0,H);
  try{cv.setPointerCapture(ev.pointerId)}catch(e){}
});
cv.addEventListener('pointermove',function(ev){
  if(busy)return;
  var p=toWorld(ev);
  if(pdown&&sowing){sowAt(p);return}
  if(pdown&&mapDrag){scx=clamp(p[0],0,W);scy=clamp(p[1],0,H);return}
  if(ev.pointerType==='mouse'){
    var c=nearest(p,14);
    if(c){
      var r=cv.getBoundingClientRect(),s=document.getElementById('stage').getBoundingClientRect();
      elTip.textContent=c.name+'：'+statusText(c);elTip.style.display='block';
      elTip.style.left=Math.min(s.width-150,r.left-s.left+c.x/W*r.width+12)+'px';
      elTip.style.top=(r.top-s.top+c.y/H*r.height-28)+'px';
    }else elTip.style.display='none';
  }
});
cv.addEventListener('pointerleave',function(){elTip.style.display='none'});
window.addEventListener('pointerup',function(){pdown=false;mapDrag=false});
window.addEventListener('pointercancel',function(){pdown=false;mapDrag=false});

function scopeWorld(x,y){return[(x-scw/2)/scZ+scx,(y-scG)/scVY+scy]}
function sxy(ev){var r=sc.getBoundingClientRect();return[ev.clientX-r.left,ev.clientY-r.top]}
function two(){var k=Object.keys(ptr);return[ptr[k[0]],ptr[k[1]]]}
function zoomTo(z,ax,ay,wp){
  zcur=zT=clamp(z,ZMIN,ZMAX);
  var Z=calcZ(zcur);scZ=Z;scVY=Z*0.3;
  if(!(follow&&byId(selId))){scx=clamp(wp[0]-(ax-scw/2)/Z,0,W);scy=clamp(wp[1]-(ay-scG)/scVY,0,H)}
}
function tapScope(x,y){
  var now=performance.now(),T=nowT(),i,h,e,best=null,bd=1e9,d,c,w;
  if(sowing){sowAt(scopeWorld(x,y));return}
  for(i=0;i<edges.length;i++){
    e=edges[i];
    if(x>=e.x0-8&&x<=e.x1+8&&y>=e.y0-8&&y<=e.y1+8){select(e.id);return}
  }
  for(i=0;i<hits.length;i++){h=hits[i];d=Math.sqrt((h.x-x)*(h.x-x)+(h.y-y)*(h.y-y));if(d<h.r&&d<bd){bd=d;best=h}}
  if(best){
    select(best.id);c=byId(best.id);
    touchSheep(c,0.75,T);
    gusts.push({x:c.x,y:c.y,t:T,s:0.7,r:0.2*zcur,seed:Math.random()});if(gusts.length>6)gusts.shift();
  }else{w=scopeWorld(x,y);gustAt(w[0],w[1],1,0.36*zcur,T)}
  if(now-lastTap<380&&Math.abs(x-lastTapX)<40&&Math.abs(y-lastTapY)<40){zT=Math.abs(zT-defZ())<4?28:defZ();lastTap=0}
  else{lastTap=now;lastTapX=x;lastTapY=y}
}
sc.addEventListener('pointerdown',function(ev){
  if(busy)return;
  var p=sxy(ev);
  try{sc.setPointerCapture(ev.pointerId)}catch(e){}
  ptr[ev.pointerId]={x:p[0],y:p[1]};np=Object.keys(ptr).length;
  vx=vy=0;clearTimeout(holdTimer);
  if(np===1){
    gest={id:ev.pointerId,x0:p[0],y0:p[1],x:p[0],y:p[1],moved:false,wind:false,lt:performance.now()};
    holdTimer=setTimeout(function(){
      if(!gest||gest.moved||np!==1||sowing||busy)return;
      gest.wind=true;
      var q=scopeWorld(gest.x,gest.y);
      heldGust={x:q[0],y:q[1],t:nowT(),s:1,r:0.4*zcur,hold:true,seed:Math.random()};
      gusts.push(heldGust);if(gusts.length>6)gusts.shift();
    },420);
  }else if(np===2){
    stopHeld();
    if(gest){gest.moved=true;gest.wind=false}
    var a=two();
    pinch={d:Math.max(20,Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)),z:zcur,w:scopeWorld((a[0].x+a[1].x)/2,(a[0].y+a[1].y)/2)};
  }
  ev.preventDefault();
});
sc.addEventListener('pointermove',function(ev){
  var q=ptr[ev.pointerId];if(!q||busy)return;
  var p=sxy(ev),dx=p[0]-q.x,dy=p[1]-q.y;q.x=p[0];q.y=p[1];
  if(pinch&&np>=2){
    var a=two(),d=Math.max(20,Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y));
    zoomTo(pinch.z*pinch.d/d,(a[0].x+a[1].x)/2,(a[0].y+a[1].y)/2,pinch.w);
    return;
  }
  if(!gest||ev.pointerId!==gest.id)return;
  gest.x=p[0];gest.y=p[1];
  if(gest.wind){if(heldGust){var w=scopeWorld(p[0],p[1]);heldGust.x=w[0];heldGust.y=w[1]}return}
  if(!gest.moved){
    if(Math.hypot(p[0]-gest.x0,p[1]-gest.y0)<8)return;
    gest.moved=true;clearTimeout(holdTimer);dx=p[0]-gest.x0;dy=p[1]-gest.y0;
  }
  follow=false;
  var now=performance.now(),dtm=Math.max(8,now-gest.lt)/1000,wx=dx/scZ,wy=dy/scVY;
  gest.lt=now;
  scx=clamp(scx-wx,0,W);scy=clamp(scy-wy,0,H);
  vx=vx*0.6+wx/dtm*0.4;vy=vy*0.6+wy/dtm*0.4;
});
function scopeUp(ev){
  if(!ptr[ev.pointerId])return;
  delete ptr[ev.pointerId];np=Object.keys(ptr).length;
  clearTimeout(holdTimer);
  if(pinch){
    pinch=null;vx=vy=0;
    if(np===1){var k=Object.keys(ptr)[0],q=ptr[k];gest={id:+k,x0:q.x,y0:q.y,x:q.x,y:q.y,moved:true,wind:false,lt:performance.now()}}
    else gest=null;
    return;
  }
  if(!gest||ev.pointerId!==gest.id)return;
  var G=gest;gest=null;
  if(G.wind){stopHeld();return}
  if(!G.moved){vx=vy=0;if(ev.type==='pointerup')tapScope(G.x,G.y)}
  else if(performance.now()-G.lt>90){vx=vy=0}
}
sc.addEventListener('pointerup',scopeUp);
sc.addEventListener('pointercancel',scopeUp);
sc.addEventListener('wheel',function(ev){
  if(busy)return;
  ev.preventDefault();
  var p=sxy(ev);
  zoomTo(zcur*Math.exp(clamp(ev.deltaY,-120,120)*0.0018),p[0],p[1],scopeWorld(p[0],p[1]));
},{passive:false});
sc.addEventListener('contextmenu',function(ev){ev.preventDefault()});
['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,function(ev){ev.preventDefault()},{passive:false})});
elPanel.onclick=function(){if(byId(selId))follow=true};

var elSow=document.getElementById('sow'),elBell=document.getElementById('bell'),elReset=document.getElementById('reset'),resetArmed=0;
document.getElementById('roster').onclick=function(){if(!busy)openRoster()};
elSow.onclick=function(){sowing=!sowing;elSow.className=sowing?'on':'';elSow.textContent=sowing?'種まき中':'種をまく';if(sowing)toast('草原をタップすると、そこに種がまかれます')};
elBell.onclick=function(){
  var c=byId(selId);
  if(busy)return;
  if(!c){toast('鈴をつけたい子を、先にタップしてください');return}
  c.bell=!c.bell;c.et=nowT();updateUI();save();
  toast(c.bell?c.name+' に鈴をつけました。遠くにいても見つけられます':c.name+' の鈴をはずしました');
};
elReset.onclick=function(){
  if(busy)return;
  if(Date.now()-resetArmed<3500){
    newWorld();selId=null;memorial='';trail=[];fx=[];gusts=[];select(S.cr[0].id);scx=S.cr[0].x;scy=S.cr[0].y;save();
    elReset.textContent='新しい世界';resetArmed=0;toast('新しい草原がはじまりました');
  }else{
    resetArmed=Date.now();elReset.textContent='もう一度押す';
    setTimeout(function(){if(resetArmed&&Date.now()-resetArmed>=3400){elReset.textContent='新しい世界';resetArmed=0}},3500);
  }
};
(function(){
  var box=document.getElementById('speeds');
  [1,10,100,1000].forEach(function(v){
    var b=document.createElement('button');b.textContent='×'+v;if(v===1)b.className='on';
    b.onclick=function(){speed=v;Array.prototype.forEach.call(box.children,function(x){x.className=''});b.className='on'};
    box.appendChild(b);
  });
})();

var last=performance.now(),uiAcc=0;
function frame(now){
  var rdt=Math.min(0.1,(now-last)/1000);last=now;
  if(!busy){
    var sdt=rdt*speed,n=Math.max(1,Math.ceil(sdt/4)),i;
    for(i=0;i<n;i++)step(sdt/n);
    if(selId!=null){
      trailAcc+=sdt;
      if(trailAcc>=20){trailAcc=0;var c=byId(selId);if(c){trail.push([c.x,c.y]);if(trail.length>140)trail.shift()}}
    }
    uiAcc+=rdt;if(uiAcc>0.25){uiAcc=0;updateUI()}
    if(now-lastSave>10000){lastSave=now;save()}
  }
  dryVis+=((S.dr.until>0?1:0)-dryVis)*0.03;if(dryVis<0.01)dryVis=0;
  windTick(rdt,now/1000);camTick(rdt);
  drawMap(now/1000);drawScope(now/1000);
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',function(){
  if(document.hidden){save();hiddenAt=Date.now()}
  else if(hiddenAt){
    var el=(Date.now()-hiddenAt)/1000;hiddenAt=0;last=performance.now();
    if(el>5)catchUp(el,el>600);
  }
});
window.addEventListener('pagehide',save);
var rzT=0;
function resizeSoon(){resize();clearTimeout(rzT);rzT=setTimeout(function(){resize();rzT=setTimeout(resize,400)},120)}
window.addEventListener('resize',resizeSoon);
window.addEventListener('orientationchange',resizeSoon);
if(window.visualViewport)window.visualViewport.addEventListener('resize',resizeSoon);
if(window.ResizeObserver){new ResizeObserver(function(){var a=document.getElementById('app');if(a.clientWidth!==lastAW||a.clientHeight!==lastAH)resize()}).observe(document.getElementById('app'))}
if(window.ResizeObserver){new ResizeObserver(function(){if(phone)return;var st=document.getElementById('stage');if(Math.abs(st.clientHeight-4-H*scale)>2&&Math.abs(st.clientWidth-16-W*scale)>2||H*scale>st.clientHeight)resize()}).observe(document.getElementById('stage'))}

(function init(){
  var real=load();
  if(!S)newWorld();
  resize();zcur=zT=defZ();
  if(byId(selId))select(selId);else if(selId==null&&S.cr.length)select(S.cr[0].id);else selId=null;
  var c0=byId(selId);if(c0){scx=c0.x;scy=c0.y}
  updateUI();
  try{if(!localStorage.getItem(KEY+'-hint2')){localStorage.setItem(KEY+'-hint2','1');setTimeout(function(){toast('ontouchstart' in window?'なぞると草原を散歩、2本指で拡大。ひつじをタップでそよ風、長押しで風が吹きます':'ドラッグで草原を散歩、ホイールで拡大。ひつじをクリックでそよ風、長押しで風が吹きます')},1500)}}catch(e){}
  if(real){var el=(Date.now()-real)/1000;if(el>30)catchUp(el,el>600)}
  requestAnimationFrame(frame);
})();
</script>
</body>

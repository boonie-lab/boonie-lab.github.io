      const pics = c.photos.filter(p => p.blob); if (!pics.length) continue;
      let spId = null, gid = c.genreId;
      if (c.name.trim()) { const {sp} = resolveSpecies(c.name, c.genreId, ops); spId = sp.id; gid = gid || sp.genreId; }
      const geo = pics.find(p => p.lat != null);
      const e = {id:uuid(), takenAt:c.takenAt || pics[0].takenAt, photoIds:[], genreId:gid || null, speciesId:spId,
        confidence: spId ? 'sure' : 'unknown', candidates:[], note:c.note.trim(), place:''};
      if (geo) { e.lat = geo.lat; e.lng = geo.lng; }
      for (const p of pics) {   // 写真ごとの時刻・位置・切り出し（photoRecsFrom）
        const r = await photoRecsFrom(p, e.id);
        if (r.failed) failedDetails++;
        for (const rec of r.recs) { e.photoIds.push(rec.id); ops.push({store:'photos', rec:Store.stamp(rec)}); }
      }
      e.takenEnd = pics.map(p => p.takenAt).filter(Boolean).sort().pop() || e.takenAt;   // 写真の中でいちばん遅い時刻
      ops.push({store:'entries', rec:Store.stamp(e)}); newEntries.push(e); count++;
    }
    await Store.write(ops);
  } catch(err) {
    console.error(err); alert('保存できませんでした。\n' + (err && err.message || err));
    // 種を先に S に入れているので読み直して整合を取る
    await loadAll(); R.saving = false; buildFoot(R.sheet); return;
  }
  newEntries.forEach(e => S.entries.set(e.id, e));
  S.meta = await Store.setMeta({entriesSinceBackup:(S.meta.entriesSinceBackup || 0) + count});
  R.done = true; R.saving = false;
  closeSheet(R.sheet, true);
  S.tab = S.tab === 'settings' ? 'log' : S.tab; render();
  pinToast(`${count}件 留めました`);
  if (failedDetails) setTimeout(() => alert(`${failedDetails}枚は切り出せませんでした（元の写真は保存しました）。\n出会いの記録の「✏️ この写真を編集」から、あとで切れます。`), 400);
  Place.autoFill(newEntries.map(e => e.id));
}

/* ================= 写真の編集（切る・主役の位置） ================= */
/**
 * src：表示する写真（Blob）。init：{crop, keep, focus}
 *   crop：{fx, fy, sz, shape} か null（fx, fy：枠の中心 0〜1／sz：枠の大きさ 0.15〜0.9／shape：'sq'＝正方形（sz は写真の短い辺に対する割合）、'orig'＝元の形（sz は縦横それぞれに対する割合））
 *   keep：前に決めた「元の写真も残す」／focus：{x, y} か null（主役の位置）
 * onDone({crop, keep, focus, focusChanged})：決定のあとに呼ぶ。crop が null なら切らない。
 *   切ったときは「元の写真も残しますか？」を聞く（「やめる」なら編集画面に戻る）。focusChanged：主役の位置を動かしたか
 */
function openPhotoEdit(src, init, onDone){
  init = init || {};
  const url = URL.createObjectURL(src);
  const c = init.crop ? {fx:init.crop.fx, fy:init.crop.fy, sz:init.crop.sz, shape:init.crop.shape || 'sq', shown:true}
    : {fx:0.5, fy:0.5, sz:0.45, shape:'sq', shown:false};
  const f = init.focus ? {x:init.focus.x, y:init.focus.y} : {x:0.5, y:0.5};
  const cropKey = () => c.shown ? [c.fx.toFixed(3), c.fy.toFixed(3), c.sz.toFixed(2), c.shape].join() : '';
  const focusKey = () => f.x.toFixed(3) + ',' + f.y.toFixed(3);
  const crop0 = cropKey(), focus0 = focusKey();
  const changed = () => cropKey() !== crop0 || focusKey() !== focus0;
  let mode = 'crop';
  openSheet({title:'写真を編集', form:true,
    beforeClose: async () => changed() ? (await ask3('変更があります', ['変更を捨てて戻る', '編集を続ける'])) === 0 : true,
    onClose(){ URL.revokeObjectURL(url); },
    build(sh){
      const seg = `<div class="seg" id="pe-mode"><button data-m="crop" class="${mode === 'crop' ? 'on' : ''}">切る</button><button data-m="focus" class="${mode === 'focus' ? 'on' : ''}">主役の位置</button></div>`;
      sh.foot.innerHTML = `<button class="btn primary" id="pe-ok" disabled>決定</button>`;
      const ok = $('#pe-ok', sh.foot);
      if (mode === 'crop') {
        sh.body.innerHTML = `${seg}<p class="hint" style="margin:0 0 6px">主役をタップすると、そこを中心に枠が出ます。枠は指で動かせます。</p>
          <div class="fpick"><div class="fpi crop" id="pe-box"><img src="${url}" alt="" draggable="false"><span class="frame" hidden></span></div></div>
          <label class="fl">枠の大きさ</label><input type="range" id="pe-size" min="15" max="90" step="1" value="${Math.round(c.sz * 100)}">
          <div class="chips"><button class="chip ${c.shape === 'sq' ? 'on' : ''}" data-sh="sq">正方形</button><button class="chip ${c.shape === 'orig' ? 'on' : ''}" data-sh="orig">元の形</button></div>
          <div class="row-btns"><button class="btn small danger" id="pe-none" ${c.shown ? '' : 'disabled'}>切らない</button></div>`;
        const box = $('#pe-box', sh.body), img = $('img', box), fr = $('.frame', box), none = $('#pe-none', sh.body);
        /** 枠が写真からはみ出さないように中心を寄せて描く */
        const paint = () => {
          ok.disabled = !changed();
          const W = img.clientWidth, H = img.clientHeight; if (!W || !H) return;
          const fw = c.shape === 'orig' ? c.sz * W : c.sz * Math.min(W, H), fh = c.shape === 'orig' ? c.sz * H : fw;
          const hx = fw / 2 / W, hy = fh / 2 / H;
          c.fx = Math.max(hx, Math.min(1 - hx, c.fx)); c.fy = Math.max(hy, Math.min(1 - hy, c.fy));
          fr.hidden = !c.shown; none.disabled = !c.shown;
          Object.assign(fr.style, {width:fw + 'px', height:fh + 'px', left:(c.fx * W - fw / 2) + 'px', top:(c.fy * H - fh / 2) + 'px'});
          ok.disabled = !changed();
        };
        if (img.complete && img.naturalWidth) paint(); else img.onload = paint;
        let drag = null;
        box.addEventListener('pointerdown', ev => {
          const r = img.getBoundingClientRect(); if (!r.width) return;
          const px = (ev.clientX - r.left) / r.width, py = (ev.clientY - r.top) / r.height;
          box.setPointerCapture(ev.pointerId);
          if (c.shown && !fr.hidden) {   // 枠の中からなら、つかんで動かす
            const fb = fr.getBoundingClientRect();
            if (ev.clientX >= fb.left && ev.clientX <= fb.right && ev.clientY >= fb.top && ev.clientY <= fb.bottom) { drag = {dx:c.fx - px, dy:c.fy - py}; return; }
          }
          c.fx = px; c.fy = py; c.shown = true; drag = {dx:0, dy:0}; paint();
        });
        box.addEventListener('pointermove', ev => {
          if (!drag) return;
          const r = img.getBoundingClientRect();
          c.fx = (ev.clientX - r.left) / r.width + drag.dx; c.fy = (ev.clientY - r.top) / r.height + drag.dy; paint();
        });
        const up = () => { drag = null; };
        box.addEventListener('pointerup', up); box.addEventListener('pointercancel', up);
        $('#pe-size', sh.body).oninput = ev => { c.sz = ev.target.value / 100; paint(); };
        $$('[data-sh]', sh.body).forEach(b => b.onclick = () => { c.shape = b.dataset.sh; $$('[data-sh]', sh.body).forEach(x => x.classList.toggle('on', x === b)); paint(); });
        none.onclick = () => { c.shown = false; paint(); };
      } else {
        sh.body.innerHTML = `${seg}<p class="hint" style="margin:0 0 6px">写真の主役をタップしてください（印は指で動かせます）</p>
          <div class="fpick"><div class="fpi" id="pe-fp"><img src="${url}" alt="" draggable="false"><span class="mk"></span></div></div>
          <p class="hint">できあがり</p>
          <div class="fprev"><div><img class="sq" src="${url}" alt=""><span>図鑑のカード</span></div><div><img class="wd" src="${url}" alt=""><span>表紙</span></div></div>`;
        const fp = $('#pe-fp', sh.body), mk = $('.mk', fp);
        const paint = () => {
          mk.style.left = (f.x * 100) + '%'; mk.style.top = (f.y * 100) + '%';
          const pos = `${(f.x * 100).toFixed(1)}% ${(f.y * 100).toFixed(1)}%`;
          $$('.fprev img', sh.body).forEach(i => i.style.objectPosition = pos);
          ok.disabled = !changed();
        };
        paint();
        const setAt = (x, y) => {
          const r = $('img', fp).getBoundingClientRect(); if (!r.width) return;
          f.x = Math.max(0, Math.min(1, (x - r.left) / r.width)); f.y = Math.max(0, Math.min(1, (y - r.top) / r.height)); paint();
        };
        let dragging = false;
        fp.addEventListener('pointerdown', ev => { dragging = true; fp.setPointerCapture(ev.pointerId); setAt(ev.clientX, ev.clientY); });
        fp.addEventListener('pointermove', ev => { if (dragging) setAt(ev.clientX, ev.clientY); });
        fp.addEventListener('pointerup', () => { dragging = false; });
        fp.addEventListener('pointercancel', () => { dragging = false; });
      }
      $('#pe-mode', sh.body).onclick = ev => { const b = ev.target.closest('[data-m]'); if (!b || b.dataset.m === mode) return; mode = b.dataset.m; sh.refresh(); };
      ok.onclick = async () => {
        if (!changed()) return;
        const crop = c.shown ? {fx:+c.fx.toFixed(4), fy:+c.fy.toFixed(4), sz:+c.sz.toFixed(3), shape:c.shape} : null;
        let keep = !!init.keep;
        if (crop && cropKey() !== crop0) {
          const k = await ask3('元の写真も残しますか？', ['残す（1枚増える）', '残さない（切った写真にする）', 'やめる']);
          if (k === 2) return;   // 編集画面に戻る
          keep = k === 0;
        }
        if (!crop) keep = false;
        const fc = focusKey() !== focus0;
        closeSheet(sh, true);
        onDone({crop, keep, focus: fc ? {x:+f.x.toFixed(4), y:+f.y.toFixed(4)} : (init.focus ? {x:init.focus.x, y:init.focus.y} : null), focusChanged:fc});
      };
    }});
}
/** 原本（File／Blob）から枠の部分を切り出す。長辺1024px・品質0.8（小さければ拡大しない）＋サムネイル320px。正方形でも元の形でも使える */
async function makeDetail(src, crop){
  const {img, url} = await decodeImage(src);
  try {
    const w = img.naturalWidth, hh = img.naturalHeight, orig = crop.shape === 'orig';
    const cw = Math.max(1, Math.round(crop.sz * (orig ? w : Math.min(w, hh))));
    const ch = orig ? Math.max(1, Math.round(crop.sz * hh)) : cw;
    const sx = Math.max(0, Math.min(w - cw, Math.round(crop.fx * w - cw / 2)));
    const sy = Math.max(0, Math.min(hh - ch, Math.round(crop.fy * hh - ch / 2)));
    const enc = async (max, q) => {
      const k = Math.min(1, max / Math.max(cw, ch)), ow = Math.max(1, Math.round(cw * k)), oh = Math.max(1, Math.round(ch * k));
      const cv = document.createElement('canvas'); cv.width = ow; cv.height = oh;
      cv.getContext('2d').drawImage(img, sx, sy, cw, ch, 0, 0, ow, oh);
      const b = await new Promise(r => cv.toBlob(r, 'image/jpeg', q)); cv.width = cv.height = 0;
      if (!b) throw new Error('encode'); return b;
    };
    return {blob: await enc(1024, 0.8), thumb: await enc(320, 0.7)};
  } finally { URL.revokeObjectURL(url); }
}

/* ---------------- 写真のレコードまわり ---------------- */
/** 古い写真（takenAt・位置がない）に、出会いの時刻と位置を写す。書き換えたら true */
function fillFrom(p, e){
  let ch = false;
  if (!p.takenAt && e.takenAt) { p.takenAt = e.takenAt; ch = true; }
  if (p.lat == null && e.lat != null) { p.lat = e.lat; p.lng = e.lng; ch = true; }
  return ch;
}
/** 出会いの時刻の幅の終わり＝写真の中でいちばん遅い撮影時刻（時刻のない写真は出会いの時刻）。pending：まだ保存していない写真のレコード */
async function calcTakenEnd(e, pending = []){
  const pm = new Map(pending.map(p => [p.id, p]));
  let max = '';
  for (const pid of e.photoIds) {
    const p = pm.get(pid) || await Store.get('photos', pid);
    if (!p || p.deleted) continue;
    const t = p.takenAt || e.takenAt;
    if (t > max) max = t;
  }
  return max || e.takenAt;
}
/**
 * processFile の結果 p（crop・keep・focus つき）から、保存する写真のレコードを作る（登録・写真を足す、共通）
 * crop があって keep → 元の写真（主役の位置つき）＋切った写真（croppedFrom）／crop があって keep でない → 切った写真だけ／crop なし → 元の写真だけ
 * 戻り値 {recs, failed}（failed：切り出しに失敗して元の写真だけ保存したとき true）
 */
async function photoRecsFrom(p, entryId){
  const base = () => { const o = {entryId, originalName:p.name, takenAt:p.takenAt, fromExif:!!p.fromExif}; if (p.lat != null) { o.lat = p.lat; o.lng = p.lng; } return o; };
  const pr = {id:uuid(), ...base(), blob: await p.blob.arrayBuffer(), thumb: await p.thumb.arrayBuffer()};
  let failed = false;
  if (p.crop && p.file) {
    try {
      const d = await makeDetail(p.file, p.crop);
      const dr = {id:uuid(), ...base(), blob: await d.blob.arrayBuffer(), thumb: await d.thumb.arrayBuffer()};
      if (p.keep) {
        dr.croppedFrom = pr.id;
        const fc = p.focus || {x:p.crop.fx, y:p.crop.fy};   // 元の写真の主役は、決めていなければ枠の中心
        pr.focusX = fc.x; pr.focusY = fc.y;
        return {recs:[pr, dr], failed:false};
      }
      return {recs:[dr], failed:false};
    } catch(err) { console.warn(err); failed = true; }
  }
  if (p.focus) { pr.focusX = p.focus.x; pr.focusY = p.focus.y; }
  return {recs:[pr], failed};
}
/** 写真を何枚か選ぶ（出会いの記録の「写真を足す」用）。選ばなければ空の配列 */
function pickPhotos(){
  return new Promise(res => {
    const inp = $('#upIn');
    inp.onchange = () => { const fs = [...inp.files]; inp.value = ''; res(fs); };
    inp.oncancel = () => res([]);
    inp.click();
  });
}

/* ================= 出会いの記録：写真を足す ================= */
/** 選んだ写真を、足す前に1枚ずつ切れる小さな画面。保存すると出会いの写真の後ろに足す。onSaved(最初に足した写真のid) */
function openAddPhotos(files, entryId, onSaved){
  files = [...files].filter(f => !f.type || f.type.startsWith('image/') || /\.(jpe?g|png|heic|heif|webp|gif)$/i.test(f.name));
  if (!files.length) return;
  const A = {items: files.map(f => ({key:uuid(), file:f, name:f.name, loading:true})), saving:false, done:false};
  const sh = openSheet({title:'写真を足す', form:true,
    beforeClose: async () => A.saving ? false : A.done ? true : (await ask3('写真を足すのをやめますか？', ['やめる', 'つづける'], '選んだ写真は足されません')) === 0,
    onClose(){ A.items.forEach(p => p.thumbUrl && URL.revokeObjectURL(p.thumbUrl)); },
    build(s){
      const loading = A.items.some(p => p.loading), n = A.items.filter(p => p.blob).length;
      s.body.innerHTML = `<div class="agrid">${A.items.map(p => `<div class="it">${
        p.loading ? '<div class="ld">読み込み中…</div>' : p.err ? `<div class="ld">読み込めない写真です<br>${h(p.name)}</div>`
        : `<button class="ed" data-ed="${p.key}" aria-label="この写真を編集"><img src="${p.thumbUrl}" alt=""></button>${p.crop ? '<b class="zb">✂</b>' : ''}`
      }<button class="rmx" data-rm="${p.key}" aria-label="外す">✕</button></div>`).join('')}</div>
        <p class="hint">写真をタップすると、足す前に切れます。</p>`;
      s.foot.innerHTML = `<button class="btn primary" id="aa-ok" ${loading || !n ? 'disabled' : ''}>${loading ? '写真を準備中…' : `${n}枚を足す`}</button>`;
      s.foot.style.display = '';
      s.body.onclick = ev => {
        const rm = ev.target.closest('[data-rm]');
        if (rm) {
          if (A.saving) return;
          const it = A.items.find(x => x.key === rm.dataset.rm); if (it && it.thumbUrl) URL.revokeObjectURL(it.thumbUrl);
          A.items = A.items.filter(x => x !== it);
          if (!A.items.length) { A.done = true; closeSheet(s, true); return; }
          return s.refresh();
        }
        const ed = ev.target.closest('[data-ed]'); if (!ed) return;
        const p = A.items.find(x => x.key === ed.dataset.ed); if (!p || !p.blob) return;
        openPhotoEdit(p.blob, {crop:p.crop || null, keep:p.keep, focus:p.focus || null}, r => {
          if (r.crop) { p.crop = r.crop; p.keep = r.keep; } else { delete p.crop; delete p.keep; }
          if (r.focusChanged) p.focus = r.focus;
          if (A.sheet && sheets.includes(A.sheet)) A.sheet.refresh();
        });
      };
      $('#aa-ok', s.foot).onclick = async () => {
        if (A.saving || A.items.some(p => p.loading)) return;
        A.saving = true; $('#aa-ok', s.foot).disabled = true;
        const e2 = S.entries.get(entryId);
        if (!e2 || e2.deleted) { A.saving = false; return; }
        const recs = []; let failed = 0;
        try {
          for (const p of A.items.filter(x => x.blob)) {
            const r = await photoRecsFrom(p, entryId); if (r.failed) failed++;
            recs.push(...r.recs);
          }
          e2.photoIds = [...e2.photoIds, ...recs.map(r => r.id)];
          e2.takenEnd = await calcTakenEnd(e2, recs);   // takenAt（出会いの時刻）は変えない：手で直した値を守るため
          await Store.putMany([...recs.map(rec => ({store:'photos', rec})), {store:'entries', rec:e2}]);
        } catch(err) {
          console.error(err); alert('保存できませんでした。\n' + (err && err.message || err));
          await loadAll(); A.saving = false; if (sheets.includes(s)) s.refresh(); return;
        }
        recs.forEach(noteFocus);
        A.done = true; A.saving = false;
        const skipped = A.items.filter(p => p.err).length;
        closeSheet(s, true);
        onSaved && onSaved(recs[0].id);
        pinToast('写真を足しました');
        if (failed || skipped) setTimeout(() => alert([skipped ? `${skipped}枚は読み込めませんでした。` : '', failed ? `${failed}枚は切り出せなかったので、元の写真のまま足しました。` : ''].filter(Boolean).join('\n')), 400);
      };
    }});
  A.sheet = sh;
  (async () => {
    for (const p of A.items.slice()) {
      try { Object.assign(p, await processFile(p.file)); } catch(e) { p.err = true; }
      p.loading = false;
      if (!sheets.includes(sh)) return;
      sh.refresh();
    }
  })();
}

/* ================= 出会いの記録：この写真を編集（編集画面の結果を保存する） ================= */
/** 保存してある写真 pid に、編集画面の結果 r を当てる。戻り値 {showId}（このあと見せる写真）か null（失敗・何もしなかった） */
async function applyPhotoEdit(eid, pid, r){
  const e = S.entries.get(eid), old = await Store.get('photos', pid);
  if (!e || e.deleted || !old) return null;
  const ops = [], pend = [];
  let showId = pid, dropOld = false;
  if (r.crop) {
    let d;
    try { d = await makeDetail(new Blob([old.blob], {type:'image/jpeg'}), r.crop); }
    catch(err) { console.warn(err); alert('切り出せませんでした。'); return null; }
    const nr = {id:uuid(), entryId:eid, blob: await d.blob.arrayBuffer(), thumb: await d.thumb.arrayBuffer(), originalName:old.originalName, croppedFrom:pid, takenAt: old.takenAt || e.takenAt};
    if (old.fromExif !== undefined) nr.fromExif = old.fromExif;
    const lat = old.lat != null ? old.lat : e.lat; if (lat != null) { nr.lat = lat; nr.lng = old.lat != null ? old.lng : e.lng; }
    const at = e.photoIds.indexOf(pid);
    if (r.keep) {   // 元の写真のすぐ後ろに入れる。元の写真の主役の位置は、決めていなければ枠の中心
      e.photoIds.splice(at < 0 ? e.photoIds.length : at + 1, 0, nr.id);
      const fc = r.focusChanged ? r.focus : {x:r.crop.fx, y:r.crop.fy};
      old.focusX = fc.x; old.focusY = fc.y; fillFrom(old, e);
      ops.push({store:'photos', rec:old}); pend.push(old);
    } else {        // 同じ位置で置き換える。元の写真は削除の印。種の表紙だったら付け替える
      if (at < 0) e.photoIds.push(nr.id); else e.photoIds[at] = nr.id;
      old.deleted = true; ops.push({store:'photos', rec:old}); dropOld = true;
      const sp = e.speciesId && S.species.get(e.speciesId);
      if (sp && sp.coverPhotoId === pid) { sp.coverPhotoId = nr.id; ops.push({store:'species', rec:sp}); }
    }
    ops.push({store:'photos', rec:nr}); pend.push(nr); showId = nr.id;
  } else if (r.focusChanged) {   // 主役の位置だけ
    old.focusX = r.focus.x; old.focusY = r.focus.y; fillFrom(old, e);
    ops.push({store:'photos', rec:old}); pend.push(old);
  } else return {showId};
  e.takenEnd = await calcTakenEnd(e, pend);
  ops.push({store:'entries', rec:e});
  if (!(await safeWrite(() => Store.putMany(ops)))) { await loadAll(); return null; }
  if (dropOld) dropPhotoCache(pid);
  pend.forEach(p => { if (!p.deleted) { dropPhotoCache(p.id); noteFocus(p); } });
  return {showId};
}

/* ================= 出会いの記録：写真の並べ替え ================= */
/** 並べ替えの画面：サムネに ‹ ›（前へ・後ろへ）。指のドラッグは使わない。1枚目が「サムネ」（ログ・なぞのカードに使われる写真）。onSaved(pid)：保存したあとに呼ぶ */
function openReorder(entryId, curPid, onSaved){
  const e0 = S.entries.get(entryId); if (!e0) return;
  const order = e0.photoIds.slice(), orig = order.join(',');
  const dirty = () => order.join(',') !== orig;
  const save = async () => {
    const e2 = S.entries.get(entryId); if (!e2 || e2.deleted) return false;
    e2.photoIds = order.slice();
    if (await safeWrite(() => Store.put('entries', e2))) return true;
    await loadAll(); return false;
  };
  openSheet({title:'写真の並べ替え', form:true,
    beforeClose: async () => {
      if (!dirty()) return true;
      const k = await ask3('変更があります', ['保存して戻る', '保存しないで戻る', '並べ替えを続ける']);
      if (k === 2) return false;
      if (k === 1) return true;
      const ok = await save(); if (ok) { onSaved && onSaved(curPid); pinToast('並べ替えました'); }
      return ok;
    },
    build(sh){
      sh.body.innerHTML = `<div class="rgrid">${order.map((pid, i) => `<div class="rt"><img data-photo="${pid}" alt="">${i === 0 ? '<span class="sm">サムネ</span>' : ''}
        <div class="mv"><button class="btn" data-mv="-1" data-i="${i}" ${i === 0 ? 'disabled' : ''} aria-label="前へ">‹</button><span class="pos">${i + 1}</span><button class="btn" data-mv="1" data-i="${i}" ${i === order.length - 1 ? 'disabled' : ''} aria-label="後ろへ">›</button></div></div>`).join('')}</div>`;
      sh.foot.innerHTML = `<button class="btn primary" id="ro-ok" ${dirty() ? '' : 'disabled'}>決定</button>`;
      sh.body.onclick = ev => {
        const b = ev.target.closest('[data-mv]'); if (!b || b.disabled) return;
        const i = +b.dataset.i, j = i + (+b.dataset.mv);
        if (j < 0 || j >= order.length) return;
        [order[i], order[j]] = [order[j], order[i]];
        sh.refresh();
      };
      $('#ro-ok', sh.foot).onclick = async () => {
        if (!dirty()) return;
        if (await save()) { closeSheet(sh, true); onSaved && onSaved(curPid); pinToast('並べ替えました'); }
      };
    }});
}

/* ================= ほかの出会いとまとめる ================= */
/** 同じ日の続きの確認文などに使う「11/22 0:10」 */
const fmtMDHM = d => `${d.getMonth() + 1}/${d.getDate()} ${fmtHM(d)}`;
/**
 * 出会い2件を1件にまとめる。aId：始めた画面の出会い、bId：選んだ相手。時刻が早いほうを残す（同じなら a）
 * 名前の食い違い・確認の文を出して、書き込む。残した出会いの id を返す（やめたとき・失敗したときは null）
 */
async function mergeEntries(aId, bId){
  const a = S.entries.get(aId), b = S.entries.get(bId);
  if (!a || !b || a.deleted || b.deleted || a === b) return null;
  const [keep, gone] = b.takenAt < a.takenAt ? [b, a] : [a, b];
  const nameOf = e => { const s = e.speciesId && S.species.get(e.speciesId); return s ? s.name : ''; };
  // 名前：同じ・両方なぞはそのまま／片方だけ名前あり→名前ありのほう／別の種どうし→選んでもらう
  let finalSp = keep.speciesId || gone.speciesId || null;
  let conf = keep.speciesId ? keep.confidence : gone.confidence;
  if (a.speciesId && b.speciesId && a.speciesId !== b.speciesId) {
    const k = await ask3('名前が違います', [`「${nameOf(a)}」にする`, `「${nameOf(b)}」にする`, 'やめる']);
    if (k === 2) return null;
    const pick = k === 0 ? a : b;
    finalSp = pick.speciesId; conf = pick.confidence;
  }
  // 確認の文（いつも出す。元に戻せないため）
  const da = new Date(keep.takenAt), db = new Date(gone.takenAt);
  let msg;
  if (sameDay(da, db)) msg = 'この2件を1件にまとめますか？';
  else if (db - da <= 6 * 3600000) msg = `日付をまたいでいます（${fmtMDHM(da)}・${fmtMDHM(db)}）。1件にまとめますか？`;
  else msg = `日付が違います（${da.getMonth() + 1}/${da.getDate()}・${db.getMonth() + 1}/${db.getDate()}）。まとめると出会いは1回になります`;
  const sub = [];
  const now = entriesLive(), after = now.filter(x => x.id !== gone.id).map(x => x.id === keep.id ? {...x, speciesId:finalSp} : x);
  if (finalSp) {
    const st = list => {
      const es = list.filter(x => x.speciesId === finalSp), months = new Set(); let first = null;
      es.forEach(x => { months.add(new Date(x.takenAt).getMonth()); if (!first || x.takenAt < first) first = x.takenAt; });
      return {n:es.length, months, first};
    };
    const bf = st(now), af = st(after), nm = (S.species.get(finalSp) || {}).name || '';
    if (bf.n !== af.n) sub.push(`「${nm}」の出会い ${bf.n}回 → ${af.n}回`);
    const lost = [...bf.months].filter(m => !af.months.has(m)).sort((x, y) => x - y);
    if (lost.length) sub.push(`会った月から${lost.map(m => (m + 1) + '月').join('・')}が消えます`);
    if (bf.first && af.first && fmtDate(bf.first) !== fmtDate(af.first)) sub.push(`初めて会った日が ${fmtDate(bf.first)} → ${fmtDate(af.first)} になります`);
  } else {
    const bn = now.filter(x => !x.speciesId).length, an = after.filter(x => !x.speciesId).length;
    if (bn !== an) sub.push(`なぞ ${bn}件 → ${an}件`);
  }
  if ((await ask3(msg, ['まとめる', 'やめる'], sub.join('\n'))) !== 0) return null;
  // 中身をまとめる
  const ops = [], pend = [];
  try {
    for (const pid of keep.photoIds) { const p = await Store.get('photos', pid); if (p && fillFrom(p, keep)) { ops.push({store:'photos', rec:p}); pend.push(p); } }
    for (const pid of gone.photoIds) {   // 相手の写真を付け替える（写真は消さない）。時刻・位置がなければ相手の出会いの値を入れる
      const p = await Store.get('photos', pid); if (!p) continue;
      p.entryId = keep.id; fillFrom(p, gone); ops.push({store:'photos', rec:p}); pend.push(p);
    }
    keep.photoIds = [...keep.photoIds, ...gone.photoIds];   // 時刻順には並べ直さない
    keep.speciesId = finalSp; keep.confidence = finalSp ? (conf || 'sure') : 'unknown';
    if (!keep.genreId && gone.genreId) keep.genreId = gone.genreId;
    keep.note = [keep.note, gone.note].map(x => (x || '').trim()).filter(Boolean).join(' / ');
    keep.candidates = [...new Set([...(keep.candidates || []), ...(gone.candidates || [])])];
    if (!keep.place && gone.place) { keep.place = gone.place; if (gone.placeSrc) keep.placeSrc = gone.placeSrc; else delete keep.placeSrc; }
    if (keep.lat == null && gone.lat != null) { keep.lat = gone.lat; keep.lng = gone.lng; }
    keep.takenEnd = await calcTakenEnd(keep, pend);
    gone.deleted = true; gone.mergedInto = keep.id;
    ops.push({store:'entries', rec:keep}, {store:'entries', rec:gone});
    await Store.putMany(ops);
  } catch(err) {
    console.error(err); alert('まとめられませんでした。\n' + (err && err.message || err));
    await loadAll(); return null;
  }
  pend.forEach(p => noteFocus(p));
  return keep.id;
}
/** 候補の1行（ログの行に近い見た目）。違う日のものには「別の日」の印 */
function mergeRow(x, me){
  const sp = x.speciesId && S.species.get(x.speciesId), g = entryGenre(x);
  const name = sp ? h(sp.name) + (x.confidence === 'maybe' ? '<span class="conf">たぶん</span>' : '') : '？ <span class="conf">なぞ</span>';
  const diff = !sameDay(new Date(x.takenAt), new Date(me.takenAt));
  return `<button class="lrow" data-mg="${x.id}" style="--gc:${h(g.color)}"><img class="th" data-photo="${x.photoIds[0]}" alt="">
    <div class="m"><div class="nm ${sp ? '' : 'q'}">${name}${diff ? '<span class="conf">別の日</span>' : ''}</div>
    <div class="sub">${h(g.emoji)} ${h(g.name)}・${fmtMDS(x)}${x.photoIds.length > 1 ? ` <span class="more-photos">📷${x.photoIds.length}</span>` : ''}${x.place ? '・' + h(x.place) : ''}</div>
    ${x.note ? `<div class="note">${h(x.note)}</div>` : ''}</div></button>`;
}
/** まとめる相手を選ぶ画面。同じ名前→なぞどうし→残り、それぞれ時刻が近い順。違う日も出す。onMerged(残った出会いのid) */
function openMergePick(selfId, onMerged){
  let q = '', limit = 30;
  openSheet({title:'まとめる相手を選ぶ', form:true, build(sh){
    const me = S.entries.get(selfId);
    sh.body.innerHTML = `<p class="hint" style="margin-top:0">この出会いと1件にまとめる相手を選んでください。</p>
      <input type="search" id="mg-q" placeholder="🔍 名前・ひとこと・場所で探す" value="${h(q)}"><div id="mg-list" style="margin-top:8px"></div>`;
    const draw = () => {
      const n = normName(q), t0 = new Date(me.takenAt).getTime();
      const rank = x => me.speciesId && x.speciesId === me.speciesId ? 0 : (!me.speciesId && !x.speciesId ? 1 : 2);
      let list = entriesLive().filter(x => x.id !== selfId);
      if (n) list = list.filter(x => { const sp = x.speciesId && S.species.get(x.speciesId); return [sp ? sp.name : '', x.note, (x.candidates || []).join(' '), x.place].some(t => normName(t).includes(n)); });
      list.sort((x, y) => rank(x) - rank(y) || Math.abs(new Date(x.takenAt) - t0) - Math.abs(new Date(y.takenAt) - t0));
      const box = $('#mg-list', sh.body);
      box.innerHTML = list.slice(0, limit).map(x => mergeRow(x, me)).join('')
        + (list.length > limit ? `<button class="btn block" id="mg-more">もっと見る（残り${list.length - limit}件）</button>` : '')
        || '<p class="hint">ほかの出会いがありません。</p>';
      hydrate(box);
    };
    $('#mg-q', sh.body).oninput = ev => { q = ev.target.value; limit = 30; draw(); };
    draw();
    sh.body.onclick = async ev => {
      if (ev.target.closest('#mg-more')) { limit += 30; return draw(); }
      const b = ev.target.closest('[data-mg]'); if (!b || sh.merging) return;
      sh.merging = true;
      try {
        const keepId = await mergeEntries(selfId, b.dataset.mg);
        if (keepId) { closeSheet(sh, true); onMerged(keepId); render(); }
      } finally { sh.merging = false; }
    };
  }});
}

/* ================= 場所の名前（写真の位置 → 名前） ================= */
/**
 * 決め方の順番：① 自分で付けた場所名（150m以内でいちばん近いもの）② 前に調べた名前（50m以内）③ OpenStreetMap の Nominatim
 * Nominatim の利用規約：同時に1件・1.1秒以上あける・独自のヘッダーは付けない・403/429 が来たら開き直すまでやめる
 */
const Place = {
  URL: 'https://nominatim.openstreetmap.org/reverse',
  last: 0, chain: Promise.resolve(), blocked: false,
  auto: () => !S.meta || S.meta.autoPlace !== false,
  /** 2点の距離（m）。球面の公式（ハバーサイン） */
  dist(a, b){
    const R = 6371000, rad = x => x * Math.PI / 180;
    const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
    const t = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(t)));
  },
  srcOf: e => e.placeSrc || (e.place ? 'hand' : null),
  nearest(pt, src, maxM, exceptId){
    let best = null, bd = Infinity;
    for (const e of entriesLive()) {
      if (e.id === exceptId || e.lat == null || !e.place || this.srcOf(e) !== src) continue;
      const d = this.dist(pt, e); if (d <= maxM && d < bd) { bd = d; best = e; }
    }
    return best;
  },
  mine(pt, exceptId){ const e = this.nearest(pt, 'hand', 150, exceptId); return e && e.place; },
  cached(pt, exceptId){ const e = this.nearest(pt, 'osm', 50, exceptId); return e && e.place; },
  /** Nominatim の答えから候補を最大3つ（施設の名前 → 町の名前 → 市区町村＋町の名前）。実機で見てから直す前提 */
  candidatesFrom(j){
    const out = [], add = x => { x = String(x || '').trim(); if (x && !out.includes(x)) out.push(x); };
    const a = (j && j.address) || {};
    if (['leisure','natural','tourism','historic','waterway','landuse','boundary'].includes(j && j.category) && j.name) add(j.name);
    for (const k of ['park','leisure','tourism','natural','historic']) if (a[k]) add(a[k]);
    const town = a.neighbourhood || a.quarter || a.suburb;
    const city = a.city || a.town || a.village || a.municipality || a.county;
    if (town) add(town);
    if (city) add(town ? city + town : city);
    return out.slice(0, 3);
  },
  /** Nominatim に問い合わせる（順番待ちで1件ずつ）。候補の配列、だめなら null */
  ask(pt){
    const run = async () => {
      if (this.blocked || !this.auto()) return null;
      const wait = this.last + 1100 - Date.now(); if (wait > 0) await new Promise(r => setTimeout(r, wait));
      const ac = new AbortController(), to = setTimeout(() => ac.abort(), 8000);
      try {
        const url = `${this.URL}?format=jsonv2&lat=${pt.lat}&lon=${pt.lng}&zoom=18&addressdetails=1&accept-language=ja`;
        const r = await fetch(url, {signal:ac.signal});
        if (r.status === 403 || r.status === 429) { this.blocked = true; return null; }
        if (!r.ok) return null;
        return this.candidatesFrom(await r.json());
      } catch(e) { return null; }
      finally { clearTimeout(to); this.last = Date.now(); }
    };
    const p = this.chain.then(run, run); this.chain = p.catch(() => null); return p;
  },
  /** 1件の名前を決める。{place, src} か null。net=false なら通信しない */
  async resolve(e, net = true){
    const pt = {lat:e.lat, lng:e.lng};
    const m = this.mine(pt, e.id); if (m) return {place:m, src:'mine'};
    const c = this.cached(pt, e.id); if (c) return {place:c, src:'osm'};
    if (!net || !this.auto()) return null;
    const cs = await this.ask(pt);
    return cs && cs.length ? {place:cs[0], src:'osm'} : null;
  },
  /** 位置があって場所が空の出会いに、裏で順番に名前を入れる。入れた件数を返す */
  async autoFill(ids, onStep){
    let n = 0, k = 0;
    for (const id of ids) {
      const e = S.entries.get(id);
      if (e && !e.deleted && e.lat != null && !e.place) {
        const r = await this.resolve(e);
        const e2 = S.entries.get(id);   // その間に手で入れていたら上書きしない
        if (r && e2 && !e2.deleted && !e2.place) {
          e2.place = r.place; e2.placeSrc = r.src;
          try { await Store.put('entries', e2); n++; } catch(err) { console.warn(err); }
        }
      }
      onStep && onStep(++k);
    }
    if (n) {
      const top = sheets[sheets.length - 1]; if (top && !top.opts.form) top.refresh();
      const a = document.activeElement;   // 入力中（検索など）は描き直さない
      if (!(a && a.matches && a.matches('input,textarea'))) render();
    }
    return n;
  },
  emptyWithGeo: () => entriesLive().filter(e => e.lat != null && !e.place),
};

/* ================= 出会いの詳細 ================= */
/** 写真は1枚ずつ表示。2枚以上なら端の ‹ › で切り替え */
/** opt.eids：写真ごとの出会いのid（表紙スライド用。下に「日付・ひとこと」の1行を出す） */
function galleryHTML(ids, opt = {}){   // opt.eid：この出会いのid（写真ごとの時刻に使う）
  const many = ids.length > 1, eids = opt.eids;
  const ind = !many ? '' : ids.length <= 8 ? `<div class="dots">${ids.map((_, i) => `<i class="${i ? '' : 'on'}"></i>`).join('')}</div>` : `<div class="cnt">1 / ${ids.length}</div>`;
  return `<div class="gal ${eids ? 'cover' : ''}" data-ids="${ids.join(',')}" ${eids ? `data-eids="${eids.join(',')}"` : ''} ${opt.eid ? `data-eid="${opt.eid}"` : ''} data-i="0"><div class="gi"><img data-full="${ids[0]}" alt="">`
    + (many ? `<button class="ga prev" data-ga="-1" aria-label="前の写真" hidden>‹</button><button class="ga next" data-ga="1" aria-label="次の写真">›</button>` : '')
    + ind + `</div>` + (eids ? `<button class="cap" data-entry="${eids[0]}">${capText(eids[0])}</button>` : '') + `</div>`;
}
function capText(eid){
  const e = S.entries.get(eid); if (!e) return '';
  const n = (e.note || '').replace(/\s+/g, ' ').trim();
  return h(fmtDate(e.takenAt)) + (n ? '・' + h(n.length > 26 ? n.slice(0, 26) + '…' : n) : '') + ' <span class="go">›</span>';
}
/* ---------------- 写真の拡大ビューア ---------------- */
/**
 * ids：写真の並び、i0：最初に見せる番号、onIndex(i)：閉じたときに最後に見ていた番号を返す、timeOf(i)：その写真の撮影時刻の文字（上の「1 / 3」の横に出す）
 * 写真は <img> のまま transform で動かす（長押しの「調べる」「コピー」を残すため）
 */
function openViewer(ids, i0, onIndex, timeOf){
  if (document.querySelector('.viewer')) return;
  let i = Math.max(0, Math.min(ids.length - 1, i0 || 0));
  const v = document.createElement('div'); v.className = 'viewer';
  v.innerHTML = `<img alt=""><div class="vc"></div><button class="vx" aria-label="閉じる">✕</button>`;
  document.body.appendChild(v);
  const img = $('img', v), vc = $('.vc', v);
  let s = 1, tx = 0, ty = 0;   // 拡大率と、ずらす量（px）
  let closed = false;

  const draw = (anim) => {
    img.style.transition = anim ? 'transform .2s ease-out' : 'none';
    img.style.transform = `translate(${tx}px,${ty}px) scale(${s})`;
  };
  /** 写真の端より外へは行かない */
  const clamp = () => {
    const w = img.offsetWidth * s, hh = img.offsetHeight * s, W = v.clientWidth, H = v.clientHeight;
    const mx = Math.max(0, (w - W) / 2), my = Math.max(0, (hh - H) / 2);
    tx = Math.max(-mx, Math.min(mx, tx)); ty = Math.max(-my, Math.min(my, ty));
  };
  /** 画面の点 (px,py) を動かさずに拡大率を ns にする */
  const zoomAt = (ns, px, py, base) => {
    const b = base || {s, tx, ty};
    const cx = v.clientWidth / 2, cy = v.clientHeight / 2;
    const qx = (px - cx - b.tx) / b.s, qy = (py - cy - b.ty) / b.s;
    s = Math.max(1, Math.min(4, ns));
    tx = px - cx - s * qx; ty = py - cy - s * qy;
    if (s <= 1.001) { s = 1; tx = 0; ty = 0; }
    clamp();
  };
  const label = () => [ids.length > 1 ? `${i + 1} / ${ids.length}` : '', timeOf ? timeOf(i) : ''].filter(Boolean).join('・');
  const show = async () => {
    vc.textContent = label();
    s = 1; tx = 0; ty = 0; draw(false);
    const want = i, u = await fullURL(ids[i]);
    if (!closed && want === i && u) { img.src = u; vc.textContent = label(); }
    for (const d of [-1, 1]) if (ids[i + d]) fullURL(ids[i + d]);   // 前後を先に読む
  };
  const go = async d => {
    const j = i + d; if (j < 0 || j >= ids.length) { tx = 0; draw(true); return; }
    const W = v.clientWidth;
    tx = -d * W; draw(true);
    await new Promise(r => setTimeout(r, reduceMotion() ? 0 : 170));
    i = j; img.removeAttribute('src');
    await show();
    tx = d * W * 0.4; draw(false);
    requestAnimationFrame(() => { tx = 0; draw(true); });
  };
  const close = () => {
    if (closed) return; closed = true;
    v.remove(); document.removeEventListener('keydown', onKey, true);
    window.removeEventListener('mousemove', mm); window.removeEventListener('mouseup', mu);
    onIndex && onIndex(i);
  };
  const onKey = ev => {
    if (ev.key === 'Escape') { ev.preventDefault(); ev.stopPropagation(); close(); }
    else if (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight') { ev.preventDefault(); ev.stopPropagation(); if (s === 1) go(ev.key === 'ArrowRight' ? 1 : -1); }
  };
  document.addEventListener('keydown', onKey, true);
  $('.vx', v).addEventListener('click', ev => { ev.stopPropagation(); close(); });
  v.addEventListener('click', ev => ev.stopPropagation());
  v.addEventListener('wheel', ev => {
    ev.preventDefault();
    zoomAt(s * Math.exp(-ev.deltaY * 0.0025), ev.clientX, ev.clientY); draw(false);
  }, {passive:false});
  v.addEventListener('dblclick', ev => {   // PC 用（タッチは下で自前に判定）
    if (performance.now() - lastTouch < 800) return;   // タッチから来た dblclick は無視
    if (s > 1) { s = 1; tx = 0; ty = 0; } else zoomAt(2.5, ev.clientX, ev.clientY);
    draw(true);
  });
  /* PC：拡大中はマウスでドラッグして動かす */
  let md = null;
  v.addEventListener('mousedown', ev => { if (s > 1 && ev.target === img) { md = {x:ev.clientX, y:ev.clientY, tx, ty}; ev.preventDefault(); } });
  const mm = ev => { if (!md || closed) return; tx = md.tx + ev.clientX - md.x; ty = md.ty + ev.clientY - md.y; clamp(); draw(false); };
  const mu = () => { md = null; };
  window.addEventListener('mousemove', mm); window.addEventListener('mouseup', mu);

  /* タッチ。touch-action:none なので preventDefault はしない（長押しメニューを残すため） */
  let t = null, lastTap = null, lastTouch = -1e9;
  const mid = ts => ({x:(ts[0].clientX + ts[1].clientX) / 2, y:(ts[0].clientY + ts[1].clientY) / 2});
  const dist = ts => Math.hypot(ts[0].clientX - ts[1].clientX, ts[0].clientY - ts[1].clientY);
  v.addEventListener('touchstart', ev => {
    lastTouch = performance.now();
    if (ev.target.closest('.vx')) return;
    const ts = ev.touches;
    if (ts.length >= 2) {
      const m = mid(ts);
      t = {pinch:true, d0:dist(ts), m0:m, base:{s, tx, ty}, moved:true};
    } else {
      t = {pinch:false, x0:ts[0].clientX, y0:ts[0].clientY, base:{s, tx, ty}, moved:false, t0:ev.timeStamp, axis:null};
    }
  }, {passive:true});

    if (!t) return;
    const ts = ev.touches;

      // 指の間の点を固定したまま拡大し、指の中点の移動ぶんずらす
      zoomAt(t.base.s * r, t.m0.x, t.m0.y, t.base);
      tx += m.x - t.m0.x; ty += m.y - t.m0.y;
      if (s === 1) { tx = 0; ty = 0; } else clamp();
      draw(false); return;
    }
    if (t.pinch) return;
    const dx = ts[0].clientX - t.x0, dy = ts[0].clientY - t.y0;
    if (!t.moved && Math.hypot(dx, dy) > 8) t.moved = true;
    if (!t.moved) return;
    if (t.base.s > 1) { tx = t.base.tx + dx; ty = t.base.ty + dy; clamp(); draw(false); return; }

    else { ty = Math.max(0, dy); tx = 0; v.style.background = `rgba(0,0,0,${Math.max(0.3, 1 - ty / 400)})`; draw(false); }
  }, {passive:true});

    if (!t) return;

        if (s > 1) { s = 1; tx = 0; ty = 0; } else zoomAt(2.5, c.clientX, c.clientY);
        draw(true);
      } else lastTap = {t:now, x:c.clientX, y:c.clientY};

    }
    if (was.base.s > 1) return;
    if (was.axis === 'x') {
      if (Math.abs(tx) > 60) go(tx < 0 ? 1 : -1); else { tx = 0; draw(true); }
    } else if (was.axis === 'y') {
      if (ty > 100) close(); else { ty = 0; v.style.background = ''; draw(true); }

}

    const preG = pre ? pre.genreId : null;

/** 判明の演出の前に、虫眼鏡の穴が広がって写真全体がはっきりする（0.6秒・タップで飛ばせる） */
async function lensReveal(pid){
  if (reduceMotion() || !pid) return;
  const u = await fullURL(pid); if (!u) return;
  const f = focusCache.get(pid) || [0.5, 0.5];
  const d = document.createElement('div'); d.className = 'lensrev';
  d.innerHTML = `<div class="lr-in"><img alt=""><span class="lr-lens"></span></div>`;
  document.body.appendChild(d);
  const img = $('img', d), lens = $('.lr-lens', d);
  await new Promise(r => { img.onload = img.onerror = r; img.src = u; setTimeout(r, 800); });
  const w = img.clientWidth || 300, hh = img.clientHeight || 300;
  const cx = f[0] * w, cy = f[1] * hh;
  const r0 = 0.38 * Math.min(w, hh), r1 = Math.hypot(Math.max(cx, w - cx), Math.max(cy, hh - cy)) + 2;
  const paint = r => { lens.style.background = `radial-gradient(circle ${r}px at ${cx}px ${cy}px,transparent 0,transparent ${Math.max(0, r - 1)}px,rgba(244,238,224,.78) ${r}px)`; };
  paint(r0);
  await new Promise(res => {
    let done = false;
    const end = () => { if (done) return; done = true; d.remove(); res(); };
    d.addEventListener('click', end);
    setTimeout(() => {
      const t0 = performance.now();
      const step = now => {
        if (done) return;
        const k = Math.min(1, (now - t0) / 600), e = 1 - Math.pow(1 - k, 3);
        paint(r0 + (r1 - r0) * e);
        if (k < 1) requestAnimationFrame(step); else setTimeout(end, 120);
      };
      requestAnimationFrame(step);
    }, 150);
  });
}
function reveal(sp, first){

  document.body.appendChild(d);

}

      const ops = [];
      for (const e of entriesLive()) if (e.speciesId === id) { e.speciesId = to.id; if (!e.genreId) e.genreId = to.genreId; ops.push({store:'entries', rec:e}); }
      if (!to.summary && sp.summary) Object.assign(to, {summary:sp.summary, sourceTitle:sp.sourceTitle, sourceUrl:sp.sourceUrl, fetchedAt:sp.fetchedAt});
      if (sp.myMemo) to.myMemo = [to.myMemo, `（${sp.name}より）${sp.myMemo}`].filter(Boolean).join('\n');
      to.links = [...(to.links || []), ...(sp.links || [])];
      if (!to.group && sp.group) to.group = sp.group;
      if (!to.genreId) to.genreId = sp.genreId;
      sp.deleted = true; sp.mergedInto = to.id;
      ops.push({store:'species', rec:to}, {store:'species', rec:sp});
      if (await safeWrite(() => Store.putMany(ops))) {
        closeSheet(sh, true);
        const spSheet = sheets.find(s => s.opts.title === '種のページ'); if (spSheet) closeSheet(spSheet, true);
        openSpecies(to.id); pinToast('統合しました');
      } else await loadAll();
    };
  }});
}

/* ================= Wikipedia 取り込み ================= */
const WIKI = 'https://ja.wikipedia.org';
async function wikiSearch(q){
  const r = await fetch(`${WIKI}/w/api.php?action=opensearch&search=${encodeURIComponent(q)}&limit=5&namespace=0&format=json&origin=*`);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const j = await r.json(); return (j[1] || []).map((t, i) => ({title:t, url:(j[3] || [])[i] || `${WIKI}/wiki/${encodeURIComponent(t)}`}));
}
async function wikiSummary(title){
  const enc = encodeURIComponent(title.replace(/ /g, '_'));
  try {
    const r = await fetch(`${WIKI}/api/rest_v1/page/summary/${enc}`);
    if (r.ok) { const j = await r.json();
      if (j.extract) return {title:j.title, extract:j.extract, url:(j.content_urls && j.content_urls.desktop && j.content_urls.desktop.page) || `${WIKI}/wiki/${enc}`, type:j.type}; }
  } catch(e) {}
  // 予備：Action API の extracts
  const r2 = await fetch(`${WIKI}/w/api.php?action=query&prop=extracts&exintro=1&explaintext=1&redirects=1&titles=${encodeURIComponent(title)}&format=json&origin=*`);
  if (!r2.ok) throw new Error('HTTP ' + r2.status);
  const j2 = await r2.json(); const pg = Object.values((j2.query && j2.query.pages) || {})[0];
  if (!pg || pg.missing !== undefined || !pg.extract) throw new Error('notfound');
  return {title:pg.title, extract:pg.extract.trim(), url:`${WIKI}/wiki/${encodeURIComponent(pg.title.replace(/ /g,'_'))}`};
}
function openWiki(id){
  const sp = S.species.get(id);
  const w = {q:sp.name, results:null, preview:null, err:'', busy:false, manual:sp.summary || ''};
  const sh = openSheet({title:'Wikipediaで調べる', form:true, build(sh){
    sh.body.innerHTML = `<div class="grow-row"><input type="search" id="w-q" value="${h(w.q)}" style="flex:1"><button class="btn" id="w-go" style="min-width:76px">探す</button></div>
      <div id="w-res"></div>
      <details style="margin-top:18px" ${w.err ? 'open' : ''}><summary class="hint" style="min-height:40px;line-height:40px">見つからないとき・ほかのサイトで調べたとき（手で入力）</summary>
        <label class="fl">説明文</label><textarea id="w-manual" rows="5">${h(w.manual)}</textarea>
        <label class="fl">出典URL（あれば）</label><input id="w-murl" type="url" value="">
        <button class="btn block" id="w-msave" style="margin-top:8px">手入力した説明を保存</button>
        <p class="hint">ほかのサイトのURLとメモは、種のページの「調べたリンク」に貼れます。</p></details>`;
    const draw = () => {
      const box = $('#w-res', sh.body);
      if (w.busy) { box.innerHTML = `<p class="hint">さがしています…</p>`; return; }
      let s = w.err ? `<div class="err">${h(w.err)}</div>` : '';
      if (w.preview) {
        s += `<div class="preview"><div class="serif" style="font-weight:700;font-size:17px">${h(w.preview.title)}</div>
          <div class="summary" style="margin-top:6px">${h(w.preview.extract)}</div>
          <div class="source">出典：<a href="${h(w.preview.url)}" target="_blank" rel="noopener">Wikipedia「${h(w.preview.title)}」</a>（CC BY-SA）</div>
          ${w.preview.type === 'disambiguation' ? '<div class="err">※曖昧さ回避のページです。別の候補を選ぶと良いかもしれません。</div>' : ''}</div>`;
      }
      if (w.results) s += (w.results.length ? `<div class="wres">${w.preview ? '<p class="hint">ほかの候補</p>' : '<p class="hint">候補をタップすると中身を確認できます</p>'}` + w.results.map((r, i) =>
        `<button class="list-btn" data-r="${i}"><span style="flex:1">${h(r.title)}</span><small>›</small></button>`).join('') + `</div>` : '');
      box.innerHTML = s;
      buildFootW();
    };
    const buildFootW = () => {
      sh.foot.innerHTML = `<button class="btn primary" id="w-take" ${w.preview ? '' : 'disabled'}>この説明を取り込む</button>`;
      sh.foot.style.display = '';
      $('#w-take', sh.foot).onclick = async () => {
        const p = w.preview; if (!p) return;
        if (sp.summary && !confirm('今の説明文を置き換えます。よろしいですか？')) return;
        Object.assign(sp, {summary:p.extract, sourceTitle:p.title, sourceUrl:p.url, fetchedAt:nowISO()});
        if (await safeWrite(() => Store.put('species', sp))) { closeSheet(sh, true); pinToast('取り込みました'); }
      };
    };
    const search = async () => {
      w.q = $('#w-q', sh.body).value.trim(); if (!w.q) return;
      w.busy = true; w.err = ''; w.preview = null; draw();
      try {
        w.results = await wikiSearch(w.q);
        if (!w.results.length) w.err = '見つかりませんでした。名前を変えて探すか、下の手入力を使ってください。';
      } catch(e) { w.results = null; w.err = '通信できませんでした（オフラインかもしれません）。下の「手で入力」から登録できます。'; $('details', sh.body).open = true; }
      w.busy = false; draw();
    };
    $('#w-go', sh.body).onclick = search;
    $('#w-q', sh.body).addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); search(); } });
    $('#w-manual', sh.body).oninput = ev => w.manual = ev.target.value;
    $('#w-msave', sh.body).onclick = async () => {
      const url = $('#w-murl', sh.body).value.trim();
      Object.assign(sp, {summary:w.manual.trim()});
      if (url) Object.assign(sp, {sourceUrl:url, sourceTitle:url, fetchedAt:nowISO()});
      if (await safeWrite(() => Store.put('species', sp))) { closeSheet(sh, true); pinToast('保存しました'); }
    };
    sh.body.addEventListener('click', async ev => {
      const b = ev.target.closest('[data-r]'); if (!b) return;
      const r = w.results[+b.dataset.r];
      w.busy = true; draw();
      try { w.preview = await wikiSummary(r.title); w.err = ''; }
      catch(e) { w.err = e.message === 'notfound' ? 'このページの要約が取れませんでした。' : '通信できませんでした。下の「手で入力」から登録できます。'; }
      w.busy = false; draw();
      sh.body.scrollTop = 0;
    });
    draw();
  }});
  search0(sh);
  function search0(sh){ if (navigator.onLine !== false) $('#w-go', sh.body).click(); }
}

/* ================= バックアップ ================= */
function ab2b64(ab){
  const u = new Uint8Array(ab); let s = '';
  for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
  return btoa(s);
}
function b642ab(b64){ const s = atob(b64), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u.buffer; }
const PART_SIZE = 200;
async function buildBackup(withPhotos){
  const [entries, species, genres] = await Promise.all(['entries','species','genres'].map(n => Store.getAll(n)));
  const photos = [], fullIds = [];
  await Store.each('photos', p => {
    const {blob, thumb, ...rest} = p;
    photos.push({...rest, thumb: thumb ? ab2b64(thumb) : null});
    if (withPhotos && blob && !p.deleted) fullIds.push(p.id);
  });
  const stamp = nowISO(), date = ymd();
  const head = {app:'my-field-guide', schemaVersion:SCHEMA_VERSION, exportedAt:stamp, kind: withPhotos ? 'full' : 'standard'};
  const chunks = [];
  for (let i = 0; i < fullIds.length; i += PART_SIZE) chunks.push(fullIds.slice(i, i + PART_SIZE));
  const total = Math.max(1, chunks.length);
  const parts = [];
  for (let k = 0; k < total; k++) {
    parts.push({index:k + 1, total, ids:chunks[k] || [],
      name: total > 1 ? `my-field-guide-backup-${date}-part${k+1}.json` : `my-field-guide-backup-${date}.json`});
  }
  /** パートごとにファイルを作る（写真は必要になった時に読む） */
  const make = async part => {
    const pieces = [];
    const meta = {...head, part:part.index, totalParts:part.total};
    let headJson = JSON.stringify(meta).slice(0, -1);
    if (part.index === 1) headJson += `,"data":{"entries":${JSON.stringify(entries)},"species":${JSON.stringify(species)},"genres":${JSON.stringify(genres)},"photos":${JSON.stringify(photos)},"photoBlobs":[`;
    else headJson += `,"data":{"photoBlobs":[`;
    pieces.push(headJson);
    let first = true;
    for (const pid of part.ids) {
      const p = await Store.get('photos', pid); if (!p || !p.blob) continue;
      pieces.push((first ? '' : ',') + JSON.stringify({id:p.id, blob:ab2b64(p.blob)})); first = false;
    }
    pieces.push(']}}');
    return new File(pieces, part.name, {type:'application/json'});
  };
  return {parts, make, counts:{entries:entries.filter(e => !e.deleted).length, photos:fullIds.length}};
}
async function deliverFile(file){
  try {
    if (navigator.canShare && navigator.canShare({files:[file]})) {
      await navigator.share({files:[file], title:file.name});
      return true;
    }
  } catch(e) { if (e && e.name === 'AbortError') return false; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 10000);
  return true;
}
async function startExport(withPhotos){
  const area = $('#expArea'); area.innerHTML = `<p class="hint">準備しています…</p>`;
  let bk;
  try { bk = await buildBackup(withPhotos); } catch(e) { area.innerHTML = `<div class="err">書き出しの準備に失敗しました：${h(e.message)}</div>`; return; }
  const files = {};
  const draw = () => {
    area.innerHTML = `<div class="parts" style="margin-top:10px">${bk.parts.map(p => `<div class="grow-row"><span class="hint" style="flex:1">${h(p.name)}${p.total > 1 ? `<br>写真 ${p.ids.length}枚${p.index === 1 ? '＋記録すべて' : ''}` : ''}</span>
      ${files[p.index] === 'done' ? '<span>✅ 保存済み</span>' : files[p.index] ? `<button class="btn primary small" data-save="${p.index}">ファイルに保存</button>` : `<button class="btn small" data-prep="${p.index}">準備する</button>`}</div>`).join('')}</div>
      <p class="hint">「ファイルに保存」を押すと共有メニューが開きます。「"ファイル"に保存」を選んでください。</p>`;
  };
  area.onclick = async ev => {
    const pr = ev.target.closest('[data-prep]'), sv = ev.target.closest('[data-save]');
    if (pr) {
      pr.disabled = true; pr.textContent = '作成中…';
      try { files[pr.dataset.prep] = await bk.make(bk.parts[pr.dataset.prep - 1]); } catch(e) { alert('作成に失敗しました：' + e.message); }
      draw();
    } else if (sv) {
      const i = +sv.dataset.save, f = files[i];
      if (await deliverFile(f)) {
        files[i] = 'done';
        if (i === 1) { S.meta = await Store.setMeta({lastBackupAt:nowISO(), entriesSinceBackup:0, reminderDismissedAt:null}); }
        draw();
        if (bk.parts.every(p => files[p.index] === 'done')) { const big = $('.card .big'); if (big) big.innerHTML = `前回のバックアップ：<b>今日</b>（その後 0件追加）`; }
      }
    }
  };
  // 1つ目はすぐ準備しておく
  files[1] = await bk.make(bk.parts[0]).catch(e => { alert('作成に失敗しました：' + e.message); return null; });
  draw();
}
async function importFiles(fileList){
  const area = $('#impArea'); if (area) area.innerHTML = `<p class="hint">読み込んでいます…</p>`;
  const files = [...fileList].sort((a, b) => a.name.localeCompare(b.name));
  const st = {added:0, updated:0, same:0, photos:0, files:0, bad:[]};
  const newer = (a, b) => (a.updatedAt || '') > (b.updatedAt || '');
  for (const f of files) {
    let obj;
    try { obj = JSON.parse(await f.text()); } catch(e) { st.bad.push(f.name); continue; }
    if (!obj || obj.app !== 'my-field-guide' || !obj.data) { st.bad.push(f.name); continue; }
    if ((obj.schemaVersion || 1) > SCHEMA_VERSION) { st.bad.push(f.name + '（新しい形式）'); continue; }
    st.files++;
    const d = obj.data;
    for (const name of ['genres','species','entries']) {
      const ops = [];
      for (const rec of d[name] || []) {
        if (!rec || !rec.id) continue;
        const cur = await Store.get(name, rec.id);
        if (!cur) { ops.push({store:name, rec}); if (name === 'entries') st.added++; }
        else if (newer(rec, cur)) { ops.push({store:name, rec}); if (name === 'entries') st.updated++; }
        else if (name === 'entries') st.same++;
      }
      for (let i = 0; i < ops.length; i += 200) await Store.putRaw(ops.slice(i, i + 200));
    }
    let ops = [];
    for (const p of d.photos || []) {
      const cur = await Store.get('photos', p.id);
      const incoming = {...p, thumb: p.thumb ? b642ab(p.thumb) : null};
      let rec;
      if (!cur) rec = incoming;
      else {
        rec = newer(incoming, cur) || !cur.entryId ? {...cur, ...incoming} : {...cur};
        rec.blob = cur.blob || null;
        rec.thumb = cur.thumb || incoming.thumb;
      }
      if (!rec.blob) delete rec.blob;
      ops.push({store:'photos', rec});
      if (ops.length >= 100) { await Store.putRaw(ops); ops = []; }
    }
    await Store.putRaw(ops); ops = [];
    for (const p of d.photoBlobs || []) {
      const cur = await Store.get('photos', p.id);
      if (cur && cur.blob) continue;
      const rec = cur ? {...cur} : {id:p.id, createdAt:'', updatedAt:'', deleted:false};
      rec.blob = b642ab(p.blob); st.photos++;
      ops.push({store:'photos', rec});
      if (ops.length >= 50) { await Store.putRaw(ops); ops = []; }
    }
    await Store.putRaw(ops);
  }
  await loadAll(); thumbCache.forEach(u => URL.revokeObjectURL(u)); thumbCache.clear();
  const msg = `${st.files}ファイルを読み込みました。出会い：新しく${st.added}件・更新${st.updated}件・変化なし${st.same}件／写真の本体 ${st.photos}枚`
    + (st.bad.length ? `<br><span class="err">読み込めなかったファイル：${h(st.bad.join('、'))}</span>` : '');
  render();
  const a2 = $('#impArea'); if (a2) a2.innerHTML = `<p>${msg}</p>`;
}

/* ================= 起動 ================= */
async function init(){
  try { await Store.open(); }
  catch(e) { $('#view').innerHTML = `<div class="warn">データベースを開けませんでした。プライベートブラウズでは使えないことがあります。<br>${h(e.message)}</div>`; return; }
  await loadAll();
  if (!S.genres.size) { await Store.putMany(DEFAULT_GENRES.map(g => ({store:'genres', rec:{...g}}))); await loadAll(); }
  if (!(await Store.get('meta','meta'))) S.meta = await Store.setMeta({schemaVersion:SCHEMA_VERSION});
  try {
    if (navigator.storage && navigator.storage.persist) S.persisted = (await navigator.storage.persisted()) || (await navigator.storage.persist());
  } catch(e) {}
  $$('nav.tabs [data-tab]').forEach(b => b.onclick = () => {
    if (S.tab === b.dataset.tab) {
      if (window.scrollY > 4) { window.scrollTo({top:0, behavior:'smooth'}); return; }
      if (S.tab === 'zukan' && S.zCh) { S.zCh = null; S.zQuery = ''; }
    }
    S.tab = b.dataset.tab; render(); resetZoom(); });
  document.addEventListener('focusout', ev => { if (ev.target && ev.target.closest && ev.target.closest('input,textarea,select')) setTimeout(realignViewport, 200); });
  if (window.visualViewport) { let vt = null; window.visualViewport.addEventListener('resize', () => { if (vt) return; vt = setTimeout(() => { vt = null; realignViewport(); }, 150); }); }
  $('#plusBtn').onclick = () => { R && (R.addMode = false); $('#fileIn').click(); };
  $('#fileIn').onchange = ev => {
    const fs = [...ev.target.files]; ev.target.value = '';
    if (!fs.length) return;
    if (R && R.addMode) { addToRegister(fs); return; }
    startRegister(fs);
  };
  $('#importIn').onchange = ev => { const fs = [...ev.target.files]; ev.target.value = ''; if (fs.length) importFiles(fs).catch(e => alert('読み込みに失敗しました：' + e.message)); };
  render();
}
function addToRegister(files){
  R.addMode = false;
  const add = files.map(f => ({key:uuid(), photos:[{name:f.name, file:f, loading:true}], genreId:null, name:'', note:'', takenAt:null, sel:false}));
  R.cards.push(...add); R.sheet.refresh();
  (async () => { for (const c of add) for (const p of c.photos) {
    try { Object.assign(p, await processFile(p.file)); } catch(e) { p.err = true; }
    p.loading = false; if (!R) return; c.takenAt = cardTime(c); updateCard(c);
  } if (R) buildFoot(R.sheet); })();
}
init();

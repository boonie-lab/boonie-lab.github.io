<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>算数ソリティア</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
  /* レイアウト: 方眼ノートの上に、計算カードを並べる1画面アプリ。
     上から 見出し / 山札とノルマ / 親枠6つ / 場札6列 / 操作ボタン */
  :root {
    --bg: #13212c;
    --bg-2: #1b2f3e;
    --line: #1f3443;
    --paper: #f2f5f7;
    --ink: #14212c;
    --ans: #0d7a86;
    --ans-soft: #7fb4bb;
    --hi: #ffb703;
    --warn: #ff6a55;
    --ok: #5ad1a0;
    --back: #323f92;
    --back-2: #4a57b8;
    --muted: #8ba4b4;
    --text: #e8f0f5;
    --font-ui: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', system-ui, sans-serif;
    --font-num: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
    --gap: 6px;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    background-color: var(--bg);
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 24px 24px;
    color: var(--text);
    font-family: var(--font-ui);
    font-size: 14px;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    overflow-x: hidden;
  }
  .app {
    max-width: 480px;
    margin: 0 auto;
    padding-top: calc(10px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  button { font-family: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--hi); outline-offset: 2px; }

  /* 見出し */
  .brand { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .brand h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: .06em; }
  .pill { border: 1px solid var(--line); background: var(--bg-2); border-radius: 999px; padding: 5px 12px; font-size: 12px; font-weight: 700; }
  .stats { display: grid; grid-template-columns: 1.9fr .9fr 1.1fr; gap: 8px; align-items: end; }
  .stat { min-width: 0; }
  .lbl { display: block; font-size: 11px; color: var(--muted); letter-spacing: .08em; }
  .stat b { font: 700 28px/1.05 var(--font-num); font-variant-numeric: tabular-nums; }
  .lv { display: flex; align-items: center; gap: 4px; }
  .lv b { font-size: 21px; white-space: nowrap; letter-spacing: .02em; }
  .lv button { border: 0; background: transparent; font-size: 22px; line-height: 1; padding: 2px 6px; color: var(--muted); }
  .lv button:disabled { opacity: .3; cursor: default; }
  #level { cursor: pointer; text-decoration: underline dotted; text-decoration-color: #58788c; text-underline-offset: 5px; }
  #level::after { content: ' ▾'; font-size: .6em; color: var(--muted); }
  /* 問題の一覧・バックアップ */
  .panel.qp { display: flex; flex-direction: column; max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); }
  .qp .acts { flex: none; }
  .qp h2 { flex: none; }
  .qsub { color: var(--muted); font-size: 14px; margin: 0 0 6px; }
  #qgrid, .bkbody { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; margin: 0 -6px; padding: 0 6px; }
  .qg { margin: 0 0 12px; }
  .qgh { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin: 4px 2px 5px; letter-spacing: .06em; font-variant-numeric: tabular-nums; }
  .qgh.done { color: var(--hi); font-weight: 700; }
  .qrow { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .qc { position: relative; min-height: 48px; border-radius: 10px; border: 1px solid #2d4658; background: var(--bg); color: var(--text); font: 700 19px/1 var(--font-num); display: flex; align-items: center; justify-content: center; padding: 0; font-variant-numeric: tabular-nums; }
  .qc.done { background: #14423b; border-color: #2c7a63; color: #c6f3e1; }
  .qc.done::after { content: '✓'; position: absolute; right: 5px; top: 3px; font: 700 12px/1 var(--font-ui); color: var(--ok); }
  .qc.cur { box-shadow: 0 0 0 3px var(--hi); }
  .qc.mid::before { content: '途中'; position: absolute; left: 0; right: 0; bottom: 4px; text-align: center; font: 700 10px/1 var(--font-ui); color: var(--hi); }
  .qc.pend { outline: 3px dashed var(--warn); outline-offset: 1px; }
  .big .qc { min-height: 54px; font-size: 22px; }
  textarea.bk { display: block; width: 100%; box-sizing: border-box; background: var(--bg); color: var(--text); border: 1px solid #2d4658; border-radius: 10px; padding: 8px; font: 12px/1.5 ui-monospace, Menlo, monospace; resize: none; word-break: break-all; -webkit-user-select: all; user-select: all; }
  textarea.bk.in { font-size: 16px; -webkit-user-select: text; user-select: text; }
  .stat b.low { color: var(--warn); }
  .meter { height: 4px; border-radius: 4px; background: var(--bg-2); margin: 8px 0 12px; overflow: hidden; }
  .meter i { display: block; height: 100%; width: 100%; background: var(--ok); transition: width .25s; }
  .meter i.low { background: var(--warn); }

  /* 盤面 */
  .board { --ch: calc(var(--cw) * 1.4); display: flex; flex-direction: column; gap: 14px; min-height: 300px; }
  .loading { margin: 60px 0; text-align: center; color: var(--muted); }
  .row { display: grid; grid-template-columns: repeat(var(--nc, 6), var(--cw)); gap: var(--gap); align-items: start; }

  .card {
    position: absolute; left: 0; right: 0; height: var(--ch);
    box-sizing: border-box;
    border-radius: calc(var(--cw) * .1);
    background: var(--paper);
    box-shadow: 0 1px 0 rgba(0,0,0,.45), 0 0 0 1px rgba(8,16,22,.35);
    overflow: hidden;
  }
  .pile .card, .slot .card { top: 0; }
  .card.full { padding: calc(var(--cw) * .07) calc(var(--cw) * .1); }
  .eq { display: flex; flex-direction: column; align-items: flex-end; font: 700 calc(var(--cw) * .36)/1.02 var(--font-num); color: var(--ink); font-variant-numeric: tabular-nums; }
  .l2 { display: flex; justify-content: space-between; width: 100%; }
  .l2 i { font-style: normal; }
  .rule { height: 2px; background: var(--ink); margin: calc(var(--cw) * .04) 0; }
  .ans { min-height: calc(var(--cw) * .4); text-align: right; font: 700 calc(var(--cw) * .4)/1 var(--font-num); color: var(--ans); font-variant-numeric: tabular-nums; }
  .ans.soft { color: var(--ans-soft); }
  .card.strip { padding-top: calc(var(--cw) * .06); text-align: center; font: 700 calc(var(--cw) * .26)/1 var(--font-num); color: var(--ink); white-space: nowrap; }
  .card.back {
    background-color: var(--back);
    background-image: repeating-linear-gradient(45deg, var(--back-2) 0 2px, transparent 2px 8px), repeating-linear-gradient(-45deg, var(--back-2) 0 2px, transparent 2px 8px);
  }
  .card.sel { box-shadow: 0 0 0 3px var(--hi), 0 2px 0 rgba(0,0,0,.4); }
  .card.parent { background: #efe7ff; }
  .card.parent .pk { position: absolute; left: calc(var(--cw) * .08); top: calc(var(--cw) * .05); font: 700 calc(var(--cw) * .2)/1 var(--font-num); color: #6a3fd0; font-variant-numeric: tabular-nums; }
  .pstar { height: calc(var(--cw) * .74); display: grid; place-items: center; }
  .pstar svg { width: calc(var(--cw) * .5); fill: #8a5cf0; }
  .card.parent .rule { background: #6a3fd0; }
  .card.parent .ans { color: #6a3fd0; }

  /* 山札・捨て札 */
  .tally { min-width: 0; }
  .tally .lbl { margin-bottom: 5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { font: 700 14px/1 var(--font-num); padding: 4px 7px; border-radius: 999px; background: var(--bg-2); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .chip small { font-size: 11px; color: var(--muted); margin-left: 2px; }
  .chip em { font-style: normal; font-size: 11px; color: #b79cff; margin-left: 3px; }
  .chip.on { border-color: var(--ans-soft); background: #21485a; }
  .chip.done { opacity: .35; text-decoration: line-through; }
  .pile, .slot, .col { position: relative; height: var(--ch); border-radius: calc(var(--cw) * .1); }
  .pile.empty, .slot.empty, .col.empty { border: 2px dashed #34546a; box-sizing: border-box; }
  .pile .cnt { position: absolute; inset: 0; display: grid; place-items: center; font: 700 calc(var(--cw) * .42)/1 var(--font-num); color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
  .pile svg { position: absolute; left: 50%; top: 50%; width: 46%; transform: translate(-50%, -50%); fill: var(--muted); }
  .pile.stock .card.back { box-shadow: 2px 2px 0 var(--back-2), 4px 4px 0 #1f2766, 0 0 0 1px rgba(8,16,22,.35); }

  /* 親枠 */
  .fs { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .badge { font: 700 12px/1 var(--font-num); padding: 3px 7px; border-radius: 999px; background: #3d3470; color: #e4dcff; font-variant-numeric: tabular-nums; }
  .badge.none { background: transparent; color: var(--muted); font-family: var(--font-ui); font-weight: 500; }
  .slot { width: 100%; }
  .slot.empty { border: 2px solid #2a475c; background: #162838; }
  .slot .ph { position: absolute; inset: 0; display: grid; place-items: center; }
  .slot .ph svg { width: 46%; fill: #2d4d63; }
  .slot.locked { box-sizing: border-box; border: 2px dashed #2a3f50; opacity: .5; }
  .slot .card.full { background: #f5efff; }
  .slot .ans { color: #6a3fd0; }

  .tgt { outline: 2px dashed var(--hi); outline-offset: 2px; }
  .hint-s .card, .hint-t { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 2px var(--hi); } 50% { box-shadow: 0 0 0 6px rgba(255,183,3,.45); } }
  .hint-t { outline: 2px solid var(--hi); outline-offset: 2px; }
  .shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  @media (prefers-reduced-motion: reduce) {
    .hint-s .card, .hint-t, .shake { animation: none; }
    .hint-s .card { box-shadow: 0 0 0 4px var(--hi); }
    .meter i { transition: none; }
  }

  /* 操作ボタン */
  .foot { position: sticky; bottom: 0; display: flex; gap: 8px; padding-top: 16px; padding-bottom: 6px; margin-top: 10px; background: linear-gradient(to bottom, transparent, var(--bg) 40%); }
  .btn { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 2px 7px; border-radius: 14px; background: var(--bg-2); border: 1px solid var(--line); font-size: 11px; font-weight: 700; }
  .btn svg { width: 22px; height: 22px; fill: currentColor; }
  .btn:disabled { opacity: .4; }
  .btn .st { font: 700 15px/22px var(--font-num); height: 22px; }
  .btn.on { border-color: var(--ans-soft); color: var(--ans-soft); }

  /* ダイアログ・トースト */
  .ov { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; background: rgba(8,16,22,.76);
        padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .panel { width: 100%; max-width: 340px; box-sizing: border-box; background: var(--bg-2); border: 1px solid #2d4658; border-radius: 18px; padding: 20px; max-height: 100%; overflow-y: auto; }
  .panel h2 { margin: 0 0 10px; font-size: 22px; letter-spacing: .04em; text-wrap: balance; }
  .panel p, .panel li { line-height: 1.7; margin: 0 0 8px; }
  .panel ol { margin: 0 0 10px; padding-left: 20px; }
  .panel .acts { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .go { flex: 1; min-width: 120px; border: 0; border-radius: 12px; padding: 12px 10px; font-size: 14px; font-weight: 700; background: var(--hi); color: #2a1d00; }
  .go.sub { background: transparent; color: var(--text); border: 1px solid #3a566a; }
  .toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 40; max-width: min(88vw, 400px); padding: 9px 16px; border-radius: 999px; background: #0b151d; border: 1px solid #36566b; font-weight: 700; font-size: 13px; text-align: center; pointer-events: none; opacity: 0; transition: opacity .2s; }
  .toast.show { opacity: 1; }

  /* 演出：めくり・そろったときの粒 */
  .fx { position: fixed; inset: 0; z-index: 60; pointer-events: none; overflow: hidden; }
  .pt { position: absolute; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 2px; animation: burst .85s cubic-bezier(.15,.7,.3,1) forwards; }
  @keyframes burst { from { transform: translate(0, 0) rotate(0) scale(1); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(.4); opacity: 0; } }
  .ring { position: absolute; border-radius: 50%; border: 3px solid var(--hi); box-sizing: border-box; animation: ring .6s ease-out forwards; }
  @keyframes ring { from { transform: translate(-50%, -50%) scale(.4); opacity: .9; } to { transform: translate(-50%, -50%) scale(1.8); opacity: 0; } }
  .flipin { animation: flipin .38s ease-out; }
  @keyframes flipin { from { transform: perspective(400px) rotateY(90deg); } to { transform: perspective(400px) rotateY(0); } }
  @media (prefers-reduced-motion: reduce) { .flipin { animation: none; } .ring { animation: none; opacity: 0; } }

  /* コース選択 */
  .pills { display: flex; gap: 6px; }
  .cbtn { display: block; width: 100%; text-align: left; padding: 12px 14px; margin-bottom: 8px; border-radius: 14px; background: var(--bg); border: 1px solid #2d4658; color: var(--text); font-size: 14px; }
  .cbtn b { font-size: 17px; }
  .cbtn small { display: block; margin-top: 3px; color: var(--muted); line-height: 1.5; font-size: 12px; }
  .cbtn.on { border-color: var(--hi); }
  .cbtn .ok { font-size: 11px; color: var(--ok); margin-left: 6px; }
  .cbtn .cur { font-size: 11px; color: var(--hi); margin-left: 6px; }
  .note { color: var(--muted); font-size: 12px; line-height: 1.6; min-height: 1em; }

  /* ゆったりコース：文字・ボタンを大きく */
  .big .brand { flex-wrap: wrap; gap: 8px; }
  .big .brand h1 { font-size: 20px; white-space: nowrap; }
  .big .pill { font-size: 15px; padding: 8px 14px; white-space: nowrap; }
  .big .stats { grid-template-columns: 2.3fr .8fr 1fr; }
  .big .lbl { font-size: 13px; }
  .big .stat b { font-size: 36px; }
  .big .lv b { font-size: 21px; }
  .big .lv button { font-size: 26px; padding: 4px 8px; }
  .big .chip { font-size: 19px; padding: 6px 10px; }
  .big .chip small { font-size: 14px; }
  .big .badge { font-size: 16px; padding: 4px 10px; }
  .big .btn { font-size: 13px; padding: 12px 2px 10px; }
  .big .btn svg { width: 28px; height: 28px; }
  .big .btn .st { font-size: 20px; height: 28px; line-height: 28px; }
  .big .toast { font-size: 17px; bottom: calc(112px + env(safe-area-inset-bottom, 0px)); }
  .big .panel { font-size: 16px; }
  .big .go { font-size: 16px; padding: 14px 10px; }

  /* あそびかた（ゆったりコース）：本物そっくりのミニ盤面を台本どおりに動かす */
  #rules-slides { position: relative; }
  .sl-title { margin: 0 44px 4px 0; font-size: 20px; letter-spacing: .03em; line-height: 1.4; }
  .sl-stage { background: var(--bg); border: 1px solid #2d4658; border-radius: 14px; margin: 8px 0 6px; padding: 8px 0 10px; }
  .sl-txt { font-size: 17px; line-height: 1.7; margin: 0 0 6px; }
  .sl-note { font-size: 15px; color: var(--muted); line-height: 1.6; margin: 0; }
  .sl-bar { display: flex; align-items: center; justify-content: space-between; margin: 10px 0 0; }
  .sl-dots { display: flex; gap: 8px; }
  .sl-dots i { width: 10px; height: 10px; border-radius: 50%; background: #34546a; }
  .sl-dots i.on { background: var(--hi); }
  .sl-acts { display: flex; gap: 8px; margin-top: 12px; }
  .sl-acts .go { min-width: 0; }
  .sl-close { position: absolute; top: -6px; right: -6px; width: 38px; height: 38px; border-radius: 50%; border: 1px solid #3a566a; background: transparent; color: var(--muted); font-size: 20px; line-height: 1; padding: 0; }
  .sl-replay { border: 1px solid #3a566a; background: transparent; color: var(--text); border-radius: 999px; padding: 6px 12px; font-size: 14px; }
  .dm-wrap { --cw: 52px; --ch: calc(var(--cw) * 1.4); --nc: 4; --gap: 8px; position: relative; width: calc(var(--cw) * 4 + var(--gap) * 3); margin: 0 auto; }
  .dm { display: flex; flex-direction: column; gap: 9px; }
  .bub { min-height: 2.7em; margin: 0 0 8px; padding: 6px 10px; box-sizing: border-box; border-radius: 12px; background: #0b151d; border: 1px solid #36566b; font-size: 16px; font-weight: 700; line-height: 1.45; text-align: center; display: flex; align-items: center; justify-content: center; }
  .dm-fg { position: absolute; left: 50%; top: 100%; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; box-sizing: border-box; background: rgba(255,183,3,.5); border: 3px solid var(--hi); box-shadow: 0 0 0 2px rgba(0,0,0,.35); opacity: 0; transition: left .75s ease, top .75s ease, opacity .3s; pointer-events: none; z-index: 200; }
  .dm-fg.tap { animation: dmt .45s ease-out; }
  @keyframes dmt { 0% { transform: scale(1); } 40% { transform: scale(.7); } 100% { transform: scale(1); } }
  .dm-x { position: absolute; z-index: 210; font: 700 64px/1 var(--font-num); color: var(--warn); text-shadow: 0 2px 6px rgba(0,0,0,.6); transform: translate(-50%, -50%); pointer-events: none; }
  .dm-x[hidden] { display: none; }
  .vanish .card { animation: dmv .6s ease-in forwards; }
  @keyframes dmv { to { transform: scale(.7); opacity: 0; } }
  .dm-ring { position: absolute; width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 50%; box-sizing: border-box; border: 3px solid var(--hi); pointer-events: none; animation: dmr .7s ease-out forwards; z-index: 150; }
  @keyframes dmr { from { transform: scale(.4); opacity: .9; } to { transform: scale(1.8); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .dm-fg, .dm-ring { display: none; } .vanish .card { animation: none; } }
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand">
      <h1>算数ソリティア</h1>
      <div class="pills">
        <button id="btn-course" class="pill" type="button">ふつう ▾</button>
        <button id="btn-help" class="pill" type="button">あそびかた</button>
      </div>
    </div>
    <div class="stats">
      <div class="stat">
        <span class="lbl">問題</span>
        <div class="lv"><button id="prev" type="button" aria-label="前の問題">‹</button><b id="level" role="button" tabindex="0" aria-label="問題の一覧を開く">--</b><button id="next" type="button" aria-label="次の問題">›</button></div>
      </div>
      <div class="stat"><span class="lbl">スコア</span><b id="score">0</b></div>
      <div class="stat"><span class="lbl">のこり手数</span><b id="left">--</b></div>
    </div>
    <div class="meter"><i id="meter"></i></div>
  </header>

  <main id="board" class="board"><p class="loading">盤面を作っています…</p></main>

  <footer class="foot">
    <button id="btn-undo" class="btn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>もどす</button>
    <button id="btn-hint" class="btn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7z"/></svg><span id="hint-lbl">ヒント 3</span></button>
    <button id="btn-ans" class="btn" type="button" aria-pressed="false"><span class="st" id="ans-st">×</span>答え表示</button>
    <button id="btn-snd" class="btn" type="button" aria-pressed="true"><svg id="snd-ico" viewBox="0 0 24 24" aria-hidden="true"></svg><span id="snd-lbl">音 オン</span></button>

    mutate(); DU.sel = null; DU.tgts = []; dmDraw();
    var dst = [].slice.call(host.querySelectorAll(toSel + ' .card')).slice(-n);
    dst.forEach(function (e) { e.style.visibility = 'hidden'; });
    void wrap.offsetWidth;
    gh.forEach(function (g, i) {
      var t = dst[Math.min(i, dst.length - 1)]; if (!t) return;

  function dmShake(sel) { var el = $('dm') && $('dm').querySelector(sel); if (el) el.classList.add('shake'); }

  }

  var FND4 = ['fnd:0', 'fnd:1', 'fnd:2', 'fnd:3'];
  var SCENES = [
    { t: '同じ答えを 重ねる', say0: '6＋2 … 答えは？',

      init: function () {

        dmAt(3300, function () { dmFg('[data-a="fnd:0"]'); });
        dmAt(4200, function () {
          dmTap();
          dmMove('[data-a="col:1"]', 2, '[data-a="fnd:0"]', function () { var u = DS.cols[1].up; DS.fnd[0] = { top: u[u.length - 1], k: 2 }; DS.cols[1].up = []; });

        dmAt(5300, function () { dmSay('列が 空いたよ'); dmFg('[data-a="col:2"]'); });
        dmAt(6200, function () { dmTap(); dmSel('col:2', ['col:1']); dmSay('空いた列には どのカードも置ける'); });
        dmAt(7200, function () { dmFg('[data-a="col:1"]'); });

      } },
    { t: 'そろうと 消える', say0: '4＋4＝8 … 親枠の山へ',
      d: '親カードに同じ答えのカードを決まった枚数そろえると、山ごと消えます。',
      init: function () {
        return { need: 3, waste: kc(4, '+', 4), stock: 9, fnd: [{ top: kc(10, '−', 2), k: 2 }, null, null, null],
          cols: [{ down: 0, up: [kc(7, '+', 7)] }, { down: 1, up: [kc(9, '−', 4)] }, { down: 0, up: [kc(12, '+', 3)] }, { down: 1, up: [kc(6, '+', 5)] }] };
      },
      run: function () {
        dmAt(1400, function () { dmFg('[data-a="waste"]'); });

  function runScene(i) {
    stopDemo(); dmXOff(); dmFgOff();
    var sc = SCENES[i];

  function drawSlide() {
    var s = SCENES[slideNo], last = slideNo === SCENES.length - 1, dots = '', i, nx;
    stopDemo();
    for (i = 0; i < SCENES.length; i++) dots += '<i' + (i === slideNo ? ' class="on"' : '') + '></i>';
    $('rules-slides').innerHTML =
      '<button type="button" class="sl-close" data-sl="x" aria-label="とじて はじめる">×</button>' +
      '<h2 id="sl-title" class="sl-title">' + s.t + '</h2>' +
      '<div class="sl-stage"><div id="dm-wrap" class="dm-wrap" aria-hidden="true"><div id="dm-bub" class="bub"></div><div id="dm" class="dm"></div><div id="dm-fg" class="dm-fg"></div><div id="dm-x" class="dm-x" hidden>×</div></div></div>' +
      '<p class="sl-txt">' + s.d + '</p>' + (s.n ? '<p class="sl-note">' + s.n + '</p>' : '') +
      '<div class="sl-bar"><div class="sl-dots" role="img" aria-label="' + (slideNo + 1) + '枚目 / ' + SCENES.length + '枚">' + dots + '</div>' +

      '<div class="sl-acts">' + (slideNo ? '<button type="button" class="go sub" data-sl="-1">まえへ</button>' : '') +
      '<button type="button" class="go" data-sl="1">' + (last ? 'はじめる' : 'つぎへ') + '</button></div>';
    nx = $('rules-slides').querySelector('.go[data-sl="1"]');
    if (nx && nx.focus) try { nx.focus({ preventScroll: true }); } catch (e) {}
    runScene(slideNo);
  }
  function openRules() {
    var c = cfgNow(), sl = !!c.big;
    $('rules-text').hidden = sl; $('rules-slides').hidden = !sl;
    $('rules-panel').setAttribute('aria-labelledby', sl ? 'sl-title' : 'rules-title');
    if (!sl) {
      $('rules-list').innerHTML = rulesItems(c).map(function (t) { return '<li>' + t + '</li>'; }).join('');
      $('rules-extra').textContent = '「もどす」は盤面だけが戻り、手数は戻りません。' + (c.hints > 50 ? 'ヒントは何回でも使えます。' : 'ヒントは1回のプレイで' + c.hints + '回まで。');
    }
    $('rules').hidden = false;
    if (sl) { slideNo = 0; drawSlide(); } /* 表示してから描く（位置を測るため） */
  }
  function closeRules() { stopDemo(); $('rules').hidden = true; lsSet('ks_seen', '1'); if (cfgNow().big) lsSet('ks_seen_gentle', '1'); }
  $('btn-help').addEventListener('click', openRules);
  $('rules-ok').addEventListener('click', closeRules);
  $('rules-slides').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-sl]') : null;
    if (!b) return;
    var v = b.getAttribute('data-sl');
    if (v === 'r') { runScene(slideNo); return; }
    if (v === 'x' || (v === '1' && slideNo === SCENES.length - 1)) { closeRules(); return; }
    slideNo += +v; drawSlide();
  });
  var rt = 0;
  window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(render, 80); });

  /* ---------- 起動 ---------- */
  showAns = lsGet('ks_ans') === '1';
  sndUI();
  COURSE = lsGet('ks_course'); if (!COURSES[COURSE]) COURSE = 'normal';
  persistAsk();
  startLevel(resumeTarget(COURSE));
  if (!lsGet('ks_seen') || (cfgNow().big && !lsGet('ks_seen_gentle'))) openRules();
  window.__ks = { get S() { return S; }, get LV() { return LV; }, tap: tap, doMove: doMove, get over() { return over; }, get qNo() { return qNo; }, isDone: isDone, doneCount: doneCount, bkMake: bkMake, bkRestore: bkRestore };
})();

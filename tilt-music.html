<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>傾き音楽</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #0b0d18; color: #e8eaf6;
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; overflow: hidden; touch-action: none; }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  canvas { flex: 1; width: 100%; min-height: 0; display: block; }
  #hud { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 14px; }
  #info { font-size: 13px; line-height: 1.5; opacity: .85; }
  #info b { white-space: nowrap; font-size: 22px; font-weight: 600; letter-spacing: .02em; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  button { font: inherit; font-size: 14px; color: #e8eaf6; background: #1c2040; border: 1px solid #343a70;
    border-radius: 999px; padding: 9px 14px; }
  button:active { background: #2a3066; }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; background: rgba(11,13,24,.92); text-align: center; padding: 24px; z-index: 5; }
  #overlay h1 { margin: 0; font-size: 28px; font-weight: 600; }
  #overlay p { margin: 0; font-size: 14px; line-height: 1.7; opacity: .8; max-width: 320px; }
  #start { font-size: 18px; padding: 14px 34px; background: #5b6cff; border-color: #8a96ff; }
  #msg { font-size: 12px; opacity: .7; min-height: 1.4em; }
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <div id="hud">
    <div id="info"><b id="note">–</b><br><span id="tone">–</span></div>
    <div class="btns">
      <button id="center">真ん中に合わせる</button>
      <button id="mode">指で操作</button>
      <button id="stop">止める</button>
    </div>
  </div>
</div>

<div id="overlay">
  <h1>傾き音楽（ハープ）</h1>
  <p>iPhoneを傾けると、ハープの弦をはじくよ。<br>
     <b>前後</b>の傾き → 弦（上が高い音）<br>
     <b>左右</b>の傾き → 音色（左：やわらかい → 右：明るい）<br>
     すばやく傾けると、ハープのグリッサンド（ぽろろろん）になるよ</p>
  <button id="start">はじめる</button>
  <div id="msg">音が出るので、音量に注意してね</div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const canvas = $('c'), ctx = canvas.getContext('2d');

  // ---- 状態 ----
  let mode = 'sensor';          // 'sensor' | 'touch'
  let running = false;
  let gotSensor = false;
  let centerBeta = null;        // 「真ん中」とみなす前後の傾き
  let rawBeta = 0, rawGamma = 0;
  let nx = 0.5, ny = 0.5;       // 画面上の点の位置 (0..1) 右・下がプラス
  let tx = 0.5, ty = 0.5;       // 目標位置（なめらかに追従させる）
  const RANGE_BETA = 50, RANGE_GAMMA = 55; // 何度傾けたら端まで行くか（大きいほどゆっくり）
  const FOLLOW = 0.07;                     // 点が追いかける速さ（小さいほどゆっくり）
  const trail = [];
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  // ---- 音階（ペンタトニック＝どう弾いても気持ちいい5音階） ----
  const NAMES = ['ド','レ','ミ','ソ','ラ'];
  const SEMI  = [0, 2, 4, 7, 9];
  const STEPS = 10;             // 2オクターブ分（＝ハープの弦10本）
  const baseMidi = 60;          // ド(C4)
  const midiOf = i => baseMidi + 12 * Math.floor(i / 5) + SEMI[i % 5];
  const freqOf = m => 440 * Math.pow(2, (m - 69) / 12);

  // ---- オーディオ（ハープ＝はじいた弦の音） ----
  let ac, filt, master, delay, fb, wet;
  const strings = [];           // 弦ごとの音のデータ

  // はじいた弦の音を計算でつくる（Karplus-Strong法：ノイズを弦の長さでぐるぐる回して、少しずつ弱める）
  function makeString(freq) {
    const sr = ac.sampleRate;
    const N = Math.max(2, Math.round(sr / freq - 0.5));
    const actual = sr / (N + 0.5);                // 実際にできる音の高さ
    const len = Math.floor(sr * 4);
    const ring = new Float32Array(N);
    let prev = 0;
    for (let i = 0; i < N; i++) {                 // やわらかい「はじき」＝なめらかにしたノイズ
      prev = prev * 0.6 + (Math.random() * 2 - 1) * 0.4;
      ring[i] = prev;
    }
    const buf = ac.createBuffer(1, len, sr);
    const d = buf.getChannelData(0);
    const g = 0.9989;                             // 1周ごとに弱まる割合（大きいほど長く響く）
    let idx = 0, peak = 0;
    for (let i = 0; i < len; i++) {
      const cur = ring[idx], nx2 = ring[(idx + 1) % N];
      d[i] = cur;
      ring[idx] = g * 0.5 * (cur + nx2);
      idx = (idx + 1) % N;
      const a = Math.abs(cur); if (a > peak) peak = a;
    }
    const k = 0.9 / (peak || 1), fade = Math.floor(sr * 0.3);
    for (let i = 0; i < len; i++) {
      let s = d[i] * k;
      if (i > len - fade) s *= (len - i) / fade;
      d[i] = s;
    }
    return { buf, rate: freq / actual };          // 再生速度で音の高さをぴったり合わせる
  }

  function initAudio() {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = 0;
    filt = ac.createBiquadFilter(); filt.type = 'lowpass'; filt.Q.value = 0.5; filt.frequency.value = 2500;
    filt.connect(master);
    // ほんのりエコー（響き）
    delay = ac.createDelay(1); delay.delayTime.value = 0.3;
    fb = ac.createGain(); fb.gain.value = 0.3;
    wet = ac.createGain(); wet.gain.value = 0.22;
    master.connect(delay); delay.connect(fb).connect(delay); delay.connect(wet);
    master.connect(ac.destination); wet.connect(ac.destination);
    for (let i = 0; i < STEPS; i++) strings.push(makeString(freqOf(midiOf(i))));
  }

  // 弦を1本はじく
  function pluck(step, vel, delaySec) {
    const s = strings[step];
    const src = ac.createBufferSource();
    src.buffer = s.buf; src.playbackRate.value = s.rate;
    const g = ac.createGain(); g.gain.value = 0.5 * vel;
    src.connect(g).connect(filt);
    src.start(ac.currentTime + delaySec);
  }

  let lastStep = -1, prevNx = 0.5, prevNy = 0.5, lastT = 0;
  function updateSound() {
    if (!ac) return;
    const t = ac.currentTime;
    const step = Math.min(STEPS - 1, Math.max(0, Math.floor((1 - ny) * STEPS)));

    // 左右＝音色：左はやわらかく、右は明るく
    filt.frequency.setTargetAtTime(1000 + 6500 * nx * nx, t, 0.08);

    // 動いた速さ（速いほど強くはじく）
    const now = performance.now();
    const dt = lastT ? Math.min(0.1, (now - lastT) / 1000) : 1 / 60;
    lastT = now;
    const speed = Math.hypot(nx - prevNx, ny - prevNy) / dt;
    prevNx = nx; prevNy = ny;

    // 弦をまたいだら、その弦をはじく（またいだ弦が複数ならグリッサンド）
    if (step !== lastStep) {
      const vel = clamp(0.55 + speed * 1.2, 0.55, 1);
      if (lastStep < 0) {
        pluck(step, vel, 0);
      } else {
        const dir = step > lastStep ? 1 : -1;
        let k = 0;
        for (let s = lastStep + dir; s !== step + dir; s += dir) {
          pluck(s, vel, Math.min(k, 7) * 0.035);
          k++;
        }
      }
      lastStep = step;
      $('note').textContent = NAMES[step % 5] + (step >= 5 ? '↑' : '');
    }
    $('tone').textContent = nx < .25 ? 'やわらかい' : nx < .5 ? 'まるい' : nx < .75 ? '明るい' : 'はっきり';
  }

  // ---- センサー ----
  let sensorErr = '';
  function onOrient(e) {
    if (e.beta == null || e.gamma == null) return;
    gotSensor = true;
    rawBeta = e.beta; rawGamma = e.gamma;
    if (centerBeta === null) centerBeta = rawBeta;
    if (mode !== 'sensor') return;
    const dy = (rawBeta - centerBeta) / RANGE_BETA;   // 上を手前に起こす→プラス→点は下（低い音）
    const dx = rawGamma / RANGE_GAMMA;                // 右を下げる→プラス→点は右
    ty = clamp(0.5 + dy / 2, 0, 1);
    tx = clamp(0.5 + dx / 2, 0, 1);
  }

  async function requestSensor() {
    try {
      if (typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        const r = await DeviceOrientationEvent.requestPermission(); // iPhone：許可ダイアログが出る
        if (r !== 'granted') return false;
      }
      window.addEventListener('deviceorientation', onOrient);
      return true;
    } catch (err) { sensorErr = (err && (err.name + ': ' + err.message)) || String(err); return false; }
  }

  // ---- 指・マウス操作（センサーが使えない時の代わり） ----
  let dragging = false;
  function pointerSet(ev) {
    const r = canvas.getBoundingClientRect();
    tx = clamp((ev.clientX - r.left) / r.width, 0, 1);
    ty = clamp((ev.clientY - r.top) / r.height, 0, 1);
  }
  canvas.addEventListener('pointerdown', ev => { if (mode === 'touch') { dragging = true; pointerSet(ev); } });
  canvas.addEventListener('pointermove', ev => { if (mode === 'touch' && dragging) pointerSet(ev); });
  window.addEventListener('pointerup', () => { dragging = false; });

  function setMode(m) {
    mode = m;
    $('mode').textContent = m === 'sensor' ? '指で操作' : '傾きで操作';
    $('center').style.display = m === 'sensor' ? '' : 'none';
  }

  // ---- 描画 ----
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = canvas.clientWidth * dpr;
    canvas.height = canvas.clientHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);

  function draw() {
    const W = canvas.clientWidth, H = canvas.clientHeight;
    nx += (tx - nx) * FOLLOW; ny += (ty - ny) * FOLLOW;
    ctx.clearRect(0, 0, W, H);

    // 背景：左→右で色が変わる（音色の見える化）
    const g = ctx.createLinearGradient(0, 0, W, 0);
    g.addColorStop(0, '#12183a'); g.addColorStop(1, '#3a1650');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    // 弦（横線）を10本。いま鳴らした弦は明るく光る
    const step = Math.min(STEPS - 1, Math.max(0, Math.floor((1 - ny) * STEPS)));
    for (let i = 0; i < STEPS; i++) {
      const y0 = H * (1 - (i + 1) / STEPS), h = H / STEPS;
      ctx.fillStyle = i === step ? 'rgba(255,255,255,.10)' : (i % 2 ? 'rgba(255,255,255,.025)' : 'rgba(255,255,255,0)');
      ctx.fillRect(0, y0, W, h);
      const yl = y0 + h / 2;
      ctx.strokeStyle = i === step ? 'rgba(255,240,200,.85)' : 'rgba(255,255,255,.22)';
      ctx.lineWidth = i === step ? 2 : 1;
      ctx.beginPath(); ctx.moveTo(34, yl); ctx.lineTo(W - 10, yl); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.4)';
      ctx.font = '12px sans-serif';
      ctx.fillText(NAMES[i % 5], 10, yl + 4);
    }

    const px = nx * W, py = ny * H;
    const hue = 210 + nx * 130;
    trail.push({ x: px, y: py });
    if (trail.length > 40) trail.shift();
    for (let i = 0; i < trail.length; i++) {
      const a = i / trail.length;
      ctx.beginPath();
      ctx.arc(trail[i].x, trail[i].y, 4 + a * 12, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${hue},90%,65%,${a * 0.35})`;
      ctx.fill();
    }
    // 点（ビー玉みたいな丸）
    const rg = ctx.createRadialGradient(px - 6, py - 6, 2, px, py, 30);
    rg.addColorStop(0, '#fff'); rg.addColorStop(.3, `hsl(${hue},95%,70%)`); rg.addColorStop(1, `hsl(${hue},90%,45%)`);
    ctx.shadowColor = `hsl(${hue},100%,65%)`; ctx.shadowBlur = 30;
    ctx.beginPath(); ctx.arc(px, py, 22, 0, Math.PI * 2); ctx.fillStyle = rg; ctx.fill();
    ctx.shadowBlur = 0;

    if (running) updateSound();
    requestAnimationFrame(draw);
  }

  // ---- ボタン ----
  $('start').addEventListener('click', async () => {
    $('start').disabled = true;
    // iPhoneは「タップの直後」にしか許可ダイアログを出せないので、最初に呼ぶ
    const sensorPromise = requestSensor();
    if (!ac) initAudio();
    try { await ac.resume(); } catch (e) {}
    const ok = await sensorPromise;
    running = true;
    master.gain.setTargetAtTime(0.8, ac.currentTime, 0.05);
    $('overlay').style.display = 'none';
    // 1.5秒たってもセンサーの値が来なければ、指で操作モードに切り替える
    setTimeout(() => {
      if (!gotSensor) { setMode('touch'); $('tone').textContent = '画面をなぞってね（傾きセンサーが使えない）' + (sensorErr ? ' [' + sensorErr + ']' : ''); }
    }, 1500);
    if (!ok) { setMode('touch'); if (sensorErr) $('tone').textContent = '画面をなぞってね [' + sensorErr + ']'; }
  });
  $('center').addEventListener('click', () => { centerBeta = rawBeta; });
  $('mode').addEventListener('click', () => setMode(mode === 'sensor' ? 'touch' : 'sensor'));
  $('stop').addEventListener('click', () => {
    if (!ac) return;
    running = !running;
    master.gain.setTargetAtTime(running ? 0.8 : 0, ac.currentTime, 0.05);
    $('stop').textContent = running ? '止める' : '再開';
  });

  resize(); draw();
})();
</script>
</body>
</html>
